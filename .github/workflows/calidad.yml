# Lint y pruebas en cada push: corren sin Docker ni base de datos (las pruebas con datos se hacen con la skill
# «verificar», en una máquina con los servicios levantados).
name: Calidad
on: [push, pull_request]
jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -q
