<text x="140" y="34" text-anchor="middle" font-size="22" font-weight="700" letter-spacing="2" fill="#2F6FB5">FUENTES PÚBLICAS</text>
<text x="440" y="34" text-anchor="middle" font-size="22" font-weight="700" letter-spacing="2" fill="#2F6FB5">ALMACENAMIENTO</text>
<text x="900" y="34" text-anchor="middle" font-size="22" font-weight="700" letter-spacing="2" fill="#2F6FB5">CAPA SEMÁNTICA</text>
<text x="1440" y="34" text-anchor="middle" font-size="22" font-weight="700" letter-spacing="2" fill="#2F6FB5">QUIÉN LA USA</text>
<rect x="20" y="60" width="240" height="250" rx="14" fill="#FFFFFF" stroke="#9AA5B8" stroke-width="2"/>
<text x="140.0" y="98" text-anchor="middle" font-size="26" font-weight="700" fill="#14213D">Proveedores</text>
<text x="140.0" y="128" text-anchor="middle" font-size="22" fill="#4A5568">(EE. UU.)</text>
<text x="140.0" y="158" text-anchor="middle" font-size="22" fill="#4A5568"></text>
<text x="140.0" y="188" text-anchor="middle" font-size="22" fill="#4A5568">USAspending</text>
<text x="140.0" y="218" text-anchor="middle" font-size="22" fill="#4A5568">NAICS · GLEIF</text>
<text x="140.0" y="248" text-anchor="middle" font-size="22" fill="#4A5568">listas de control</text>
<text x="140.0" y="278" text-anchor="middle" font-size="22" fill="#4A5568">Wikidata</text>
<rect x="20" y="340" width="240" height="250" rx="14" fill="#FFFFFF" stroke="#9AA5B8" stroke-width="2"/>
<text x="140.0" y="378" text-anchor="middle" font-size="26" font-weight="700" fill="#14213D">Oncología</text>
<text x="140.0" y="408" text-anchor="middle" font-size="22" fill="#4A5568"></text>
<text x="140.0" y="438" text-anchor="middle" font-size="22" fill="#4A5568">AACT</text>
<text x="140.0" y="468" text-anchor="middle" font-size="22" fill="#4A5568">ChEMBL</text>
<text x="140.0" y="498" text-anchor="middle" font-size="22" fill="#4A5568">openFDA</text>
<text x="140.0" y="528" text-anchor="middle" font-size="22" fill="#4A5568">MeSH</text>
<rect x="320" y="60" width="240" height="400" rx="14" fill="#FFFFFF" stroke="#9AA5B8" stroke-width="2"/>
<text x="440.0" y="98" text-anchor="middle" font-size="26" font-weight="700" fill="#14213D">Postgres</text>
<text x="440.0" y="128" text-anchor="middle" font-size="22" fill="#4A5568">un esquema</text>
<text x="440.0" y="158" text-anchor="middle" font-size="22" fill="#4A5568">por fuente</text>
<text x="440.0" y="188" text-anchor="middle" font-size="22" fill="#4A5568"></text>
<text x="440.0" y="218" text-anchor="middle" font-size="22" fill="#4A5568">+ los enlaces</text>
<text x="440.0" y="248" text-anchor="middle" font-size="22" fill="#4A5568">de Rastro,</text>
<text x="440.0" y="278" text-anchor="middle" font-size="22" fill="#4A5568">con su evidencia</text>
<rect x="320" y="490" width="240" height="100" rx="14" fill="#FFFFFF" stroke="#9AA5B8" stroke-width="2"/>
<text x="440.0" y="528" text-anchor="middle" font-size="26" font-weight="700" fill="#14213D">GraphDB</text>
<text x="440.0" y="558" text-anchor="middle" font-size="22" fill="#4A5568">MeSH completo</text>
<line x1="262" y1="185" x2="318" y2="185" stroke="#4A5568" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="262" y1="420" x2="318" y2="380" stroke="#4A5568" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="262" y1="540" x2="318" y2="540" stroke="#4A5568" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="140" y="628" text-anchor="middle" font-size="20" fill="#4A5568">un cargador por fuente</text>
<rect x="620" y="50" width="560" height="590" rx="20" fill="#2F6FB5"/>
<rect x="650" y="80" width="500" height="120" rx="14" fill="#4A84C4" stroke="#4A84C4" stroke-width="2"/>
<text x="900.0" y="118" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">Entity linking</text>
<text x="900.0" y="148" text-anchor="middle" font-size="22" fill="#FFFFFF">empresa → LEI → grupo · ensayo → fármaco</text>
<text x="900.0" y="178" text-anchor="middle" font-size="22" fill="#FFFFFF">cada enlace con su evidencia (PROV-O)</text>
<rect x="650" y="220" width="240" height="130" rx="14" fill="#4A84C4" stroke="#4A84C4" stroke-width="2"/>
<text x="770.0" y="258" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">Ontología</text>
<text x="770.0" y="288" text-anchor="middle" font-size="22" fill="#FFFFFF">el diccionario</text>
<text x="770.0" y="318" text-anchor="middle" font-size="22" fill="#FFFFFF">de cada dominio</text>
<rect x="910" y="220" width="240" height="130" rx="14" fill="#4A84C4" stroke="#4A84C4" stroke-width="2"/>
<text x="1030.0" y="258" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">Mapeos</text>
<text x="1030.0" y="288" text-anchor="middle" font-size="22" fill="#FFFFFF">columna → concepto</text>
<text x="1030.0" y="318" text-anchor="middle" font-size="22" fill="#FFFFFF">(R2RML)</text>
<rect x="650" y="400" width="500" height="130" rx="14" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/>
<text x="900.0" y="438" text-anchor="middle" font-size="26" font-weight="700" fill="#14213D">Ontop, uno por dominio</text>
<text x="900.0" y="468" text-anchor="middle" font-size="22" fill="#4A5568">traduce cada consulta SPARQL</text>
<text x="900.0" y="498" text-anchor="middle" font-size="22" fill="#4A5568">a SQL sobre Postgres</text>
<text x="900" y="600" text-anchor="middle" font-size="22" fill="#FFFFFF">Grafo virtual: los datos no se mueven</text>
<line x1="562" y1="270" x2="618" y2="270" stroke="#4A5568" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="900" y1="352" x2="900" y2="396" stroke="#FFFFFF" stroke-width="2.5" marker-end="url(#white)"/>
<rect x="1250" y="50" width="380" height="230" rx="14" fill="#FFFFFF" stroke="#9AA5B8" stroke-width="2"/>
<text x="1440.0" y="88" text-anchor="middle" font-size="26" font-weight="700" fill="#14213D">App Rastro (dos dominios)</text>
<text x="1440.0" y="118" text-anchor="middle" font-size="22" fill="#4A5568">preguntas: el LLM lee el</text>
<text x="1440.0" y="148" text-anchor="middle" font-size="22" fill="#4A5568">diccionario y escribe SPARQL</text>
<text x="1440.0" y="178" text-anchor="middle" font-size="22" fill="#4A5568">textos: el grafo elige los</text>
<text x="1440.0" y="208" text-anchor="middle" font-size="22" fill="#4A5568">registros; el LLM los resume</text>
<text x="1440.0" y="238" text-anchor="middle" font-size="22" fill="#4A5568">y cita cada uno</text>
<rect x="1250" y="300" width="380" height="100" rx="14" fill="#FFFFFF" stroke="#9AA5B8" stroke-width="2"/>
<text x="1440.0" y="338" text-anchor="middle" font-size="26" font-weight="700" fill="#14213D">Otras herramientas</text>
<text x="1440.0" y="368" text-anchor="middle" font-size="22" fill="#4A5568">cualquier cliente SPARQL</text>
<rect x="1250" y="420" width="380" height="110" rx="14" fill="#FFFFFF" stroke="#9AA5B8" stroke-width="2"/>
<text x="1440.0" y="458" text-anchor="middle" font-size="26" font-weight="700" fill="#14213D">GraphDB federa</text>
<text x="1440.0" y="488" text-anchor="middle" font-size="22" fill="#4A5568">Rastro + MeSH + Wikidata</text>
<rect x="1250" y="560" width="380" height="80" rx="14" fill="#F7F6F2" stroke="#9AA5B8" stroke-width="2" stroke-dasharray="8,6"/>
