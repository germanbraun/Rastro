# Los dominios que muestra la app. Oncología tiene su propia pantalla (app.py); los demás
# se dibujan con dominio.py a partir de su archivo de configuración.
# El primero es el que abre la app: la demo empieza por petróleo y gas.
- id: energia
  name: Petróleo y gas en Argentina
  config: /app/dominios/energia.yaml
- id: proveedores
  name: Proveedores del Estado de EE. UU.
  config: /app/dominios/proveedores.yaml
- id: afiliaciones
  name: Afiliaciones de investigación en Argentina
  config: /app/dominios/afiliaciones.yaml
- id: oncologia
  name: Oncología
