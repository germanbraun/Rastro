      dato: Rastro entity (URI)
      regla: Rule
      evidencia: Evidence
      origen: Source record or source (URI)
      identificador: Original identifier
      mes: Production month
      cargado: Load date
  inputs:
    - {}
    - {}
    - field: participacion (map text)
  sources:
    inicio:
      note: Original production records of the well. The linked evidence indicates the first month selected;
        later months are used to calculate the observed target, not as predictors.
    fractura:
      note: Original reports of the well, including those the rule might exclude by date. Rastro's evidence
        shows the selection and aggregation used; the load dates reveal late arrivals.
    socios:
      note: Original map text for the well's concession. The linked evidence shows whether Rastro applies a
        reviewed correction; keeping that difference is part of the comparison.
    trayectoria:
      note: Original trajectories of the well. The linked rule indicates which one was selected; it is not claimed that all
        these rows go into the model.
  pasos:
    - titulo: 1 · Give meaning to the sources
      parte: >-
        Dictionary, mappings and links: the model's variables come from Rastro concepts (Well start,
        Fracturing, Trajectory, Share), with the concession and the company already linked.
      contenido: |
        The sources are loaded as they come. The links identify the well, the concession and the companies, with their
        rule and their evidence, and the mappings expose those records with the dictionary. No row is labelled by hand.

        **Source tables → links with evidence → mappings to the dictionary → query → table for the model.**

        | Source data | Meaning in Rastro | Use in the model |
        |---|---|---|
        | Production declaration | Well start and observed gas | Cohort, cut-off date and target |
        | Fracturing report | Lateral length, stages, sand, water and pressure | Numeric variables |
        | Well trajectory | Vertical depth | Numeric variable |
        | Concession and partners | Concession, company and share | Context variables |
    - titulo: 2 · Prepare and train
      parte: >-
        Rastro Lab: the same model, trained twice, with a chronological cut-off and late arrivals in view.
        The walkthrough is retrospective; it does not guarantee that all the data was available when the well started.
      contenido: |
        Each row is an eligible well, with its identifier and its start date. **Target:** the cumulative gas of
        months 2 to 7 since it started, in million m³. That gas is used to train and to check; it does not enter as a variable.

        The model is trained on the wells that started before 2025 and tested on those of 2025. Categories become
        numeric columns, missing values are filled in with the training average, and a regularized linear regression
        is fitted. Fracturing is taken according to the well's start, and the load date is kept, to flag what
        arrived later.
    - titulo: 3 · Explain the number
      parte: >-
        The explanation: a base and what each dictionary concept adds or subtracts, calculated by the model, not
        written by an AI.
      contenido: |
        **The general formula of linear regression:**

        $$\hat y = \beta_0 + \sum_i \beta_i x_i$$

        Here, **ŷ** is the estimated gas; **xᵢ**, each characteristic of the well; **βᵢ**, its learned coefficient;
        and **β₀**, the intercept. Rastro Lab uses this regression with regularization (*ridge*).

        **The same calculation, starting from the average:**

        $$\hat y = \bar y + \sum_i \beta_i (x_i - \bar x_i)$$

        **ȳ** is the training average gas and **x̄ᵢ**, the average of each input.
        Each term of the sum is a **contribution**. «Fracturing» adds up the contributions of lateral, stages, sand, water and pressure;
        the other groups gather those of location and depth. The calculation for the selected well is shown below.

        The **coefficients** are learned from the wells before 2025: they are the ones that bring that sum as close as possible to the
        gas those wells actually produced, with a small penalty (*ridge*) so that none of them runs away. Then
        they are applied to the 2025 wells. Categories are converted into 0/1 columns. If a numeric value is missing, the
        training average is used.

        Below you can open each group and see its variables, coefficients and sources. **A single coefficient can look
        odd**, for example a negative one for lateral length: the fracturing variables change together and the model
        spreads their effect among them. That is why the explanation adds them up in «How the well was fractured».
        The contributions explain the model's arithmetic; **they do not prove physical causes**.
    - titulo: 4 · Open the evidence
      parte: >-
        Traceability (PROV-O): each published prediction keeps the run, what each factor added and the records
        it used, and is queried like any other Rastro data.
      contenido: |
        When a run of the model is published, Rastro keeps each prediction as one more piece of data: the run that
        generated it, what each factor added and **the source records it used** (`prov:used`). Below, the published
        prediction for the selected well, queried now:

        1. the number and its range;
        2. its factors, as they were saved; the comparison status shows whether they match step 3;
        3. each record it used, with the rule that chose it, its evidence and its source.

        So from the predicted gas you reach the well's gas declarations, the fracturing the operator reported (and
        when it was loaded), the trajectory and the share in the concession.
      consultas:
        - titulo: The published prediction (compared run, million m³)
        - titulo: What each factor added, saved with the prediction
        - titulo: The records it used, with their rule, their evidence and their source
