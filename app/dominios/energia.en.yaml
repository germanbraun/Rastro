# English overlay of energia.yaml: only the visible texts, laid over the Spanish file by app/idioma.py.
# Same nesting as the Spanish file; lists without «id» line up by position ({} keeps an item as it is).

avisos_cambio:                 # the change test's check in English: {0}, {1}… are the numbers or words it found
  - texto: "2025 oil adds up to {0} million m³, and national production is around {1}: did the unit change?"
resumen: >-
  Public data from Argentina: 2025 production well by well (Capítulo IV, with 2023 and 2024
  to see who operated each concession), the maps of
  concessions, partners and gas venting and the environmental studies of the Secretaría de Energía, the pipelines of ENARGAS, the
  towns and protected areas of the IGN, and the global company identifier (GLEIF).
portada:
  cifras:
    - valor: "US$ {e01[dolares]} M"
      etiqueta: of oil assigned in excess
      texto: "To YPF in 2025, summing by who reports the production: {e01[exceso]} million m³ of its partners' oil, at US$ {e01[precio]} a barrel (an assumption)."
    - valor: "{cambio[b_broken]}"
      etiqueta: broken queries
      texto: "when the source renames a column. With Rastro, it is fixed in one line."
    - valor: "{correccion[lugares]}"
      etiqueta: places for one value
      texto: "where the same value lives without Rastro. With Rastro it is corrected in one, and reaches every answer and the model."
ejemplo_libre: "For example: who produced the most gas in 2025? And then: and how much belongs to it by its share?"
diagrama: {titulo: oil and gas dictionary}

demo_porque: >-
  Two acts. In Rastro Layer, a number you can trust: it answers with evidence, it is fixed in one place when a
  database changes, and a correction made once reaches every answer. In Rastro Lab, a prediction you can defend:
  the model inherits all of the above, and the same correction (Aguada Pichana Este) has already reached its input and
  its explanation.
  Everything runs live on public oil and gas data.
  The other questions (who operates each well, venting on the map) are in «Ask».
demo:
  - paso: Ask
    titulo: "How much oil belongs to each company?"
    muestra: >-
      The answer first. With «Why this number?», choose a company and a concession to follow
      the calculation, the connections between sources and the original records. Operated production and share are different measures.
  - paso: The database changes
    titulo: "The source publishes a new version"
    muestra: >-
      Without Rastro, the number changes and nobody notices. With Rastro, a rule warns and it is fixed in one place.
  - paso: A correction
    titulo: "A value is corrected once, and every answer changes"
    muestra: >-
      A document says that in Aguada Pichana Este Total holds 55%, not the 27.27% on the map. It is corrected once
      in Rastro, with the document, and every answer that depends on that share changes on its own.
  - paso: Predict
    titulo: "How much gas will a new well produce?"
    puente: >-
      Everything Rastro knows (every link, every rule, every correction) a model inherits too.
    muestra: >-
      A new Vaca Muerta well. The same model with and without Rastro: they predict equally well, but with
      Rastro the prediction says what it relies on, where each value comes from and which ones are worth checking.

fuentes:
  sig_energia: Maps (WFS)
  rastro: Rastro link
nota_rastro: >-
  The companies with their names in each source, the partners of each concession, who operates each well
  and which concession each venting event falls in, and who operated each concession month by month, which Rastro resolves
  once and keeps with its evidence

fuentes_detalle:
  - id: capitulo4
    nombre: "Chapter IV: well production and register"
    organismo: Argentina's Energy Secretariat, open data portal
    que_es: >-
      The sworn statements every company files each month with the oil, gas and water production of each well, and
      the register of every well in the country, with its registered company and its location.
    que_usa: >-
      2025 production, well by well and month by month, to know how much each concession and each company produces;
      2023 and 2024, to see who operated each concession over time. From the register, each well's location and type.
      Rastro Lab adds 2018 to 2022, in a separate space that changes no answer.
    cuidado:
      - >-
        The reporting company is the operator, and it reports all of the concession's production, its partners' share
        included. That is why «what it operates» and «what belongs to it» are different numbers.
      - Oil comes in m³ and gas in thousands of m³; Rastro shows them in millions.
      - 2025 is used because the 2026 file does not yet include every operator.
      - The register and the statement may name different companies for the same well; Rastro shows both.
  - id: sig_energia
    nombre: Maps of concessions, partners and venting
    organismo: Argentina's Energy Secretariat, map service
    que_es: >-
      The production concessions with their outline, their operator and their partners; the venting and flaring
      points companies declare; and the possible venting a satellite detects.
    que_usa: >-
      Each concession's partners and their percentage, to split the production among them; and which concession each
      venting event falls in.
    cuidado:
      - >-
        The partners are inside a text («YPF S.A.: 50 %»). Rastro splits them once, with their percentage, and keeps the
        original text as evidence.
      - >-
        The map may carry a previous owner: half of La Amarga Chica is under Petronas, which Vista bought in 2025. A
        correction with its source resolves it; an AI assistant reviewed it and a person still has to confirm it.
      - A venting event seen by satellite is a sign (a thermal anomaly), not a confirmation.
    tecnico: >-
      The server's certificate comes without the full chain: it is downloaded without verifying it, since it is
      public, read-only data. Outlines are crossed with points in Python (the database has no PostGIS).
  - id: enargas
    nombre: Transport gas pipelines
    organismo: Argentina's gas regulator (ENARGAS), published in the Energy Secretariat's map service
    que_es: The country's transport gas pipelines, with their name, the licensed company and their route.
    que_usa: >-
      The nearest pipeline to each concession and how far it is (0 km if it crosses it), to find concessions that vent
      gas far from a pipeline.
    cuidado:
      - These are the transport pipelines; distribution networks and pipes inside the fields are not included.
      - Distances are approximate, on the map, and good enough at this scale.
  - id: ign
    nombre: Towns and protected areas
    organismo: Argentina's National Geographic Institute (IGN), listed in IDERA
    que_es: The country's towns and protected areas, with their location and outline.
    que_usa: The nearest town to each possible venting event and whether it falls inside a protected area.
    cuidado:
      - >-
        Each town is a point: the distance is to that point, not to the edge of the town.
  - id: gleif
    nombre: Company identifier (LEI)
    organismo: Global Legal Entity Identifier Foundation (GLEIF)
    que_es: >-
      The worldwide register of the LEI, the identifier companies use to operate in financial markets, with their
      legal name and status.
    que_usa: The LEI of the companies that produce the most, to link the same company across sources and with outside data.
    cuidado:
      - >-
        Rastro searches each company by its name: a candidate is accepted only with a rule and its evidence, and
        doubtful ones are not used.
      - Not every operator has an LEI.
  - id: ambiental
    nombre: Environmental studies
    organismo: Argentina's Energy Secretariat, open data portal
    que_es: >-
      The list of environmental studies and reports companies file for each concession, with their date and type;
      among them, the gas venting forms.
    que_usa: Whether a concession with venting filed its venting forms, to flag concessions to review.
    cuidado:
      - >-
        The concession comes as text, written as whoever filed the study wrote it, without its code. Rastro links it
        by name, with its rule and its evidence.
  - id: fractura
    nombre: Well fracturing data
    organismo: Argentina's Energy Secretariat (Annex IV)
    que_es: >-
      The data of each reported hydraulic fracturing: the length of the horizontal section, the stages, the sand, the
      water and the maximum pressure, by well.
    que_usa: Only Rastro Lab, as inputs to the model that predicts the gas of new wells.
    cuidado:
      - >-
        Many fracturings are reported late. Rastro Lab uses only what was reported up to the month the well started,
        and flags what arrived later.
      - Some values are not possible; a quality rule finds them, and the prediction that uses them says so.
  - id: trayectorias
    nombre: Well trajectories
    organismo: Argentina's Energy Secretariat, open data portal
    que_es: >-
      The trajectory of Vaca Muerta wells: vertical depth, section length and the end of drilling.
    que_usa: Only Rastro Lab, as inputs to the model that predicts the gas of new wells.
    cuidado:
      - One trajectory per well. Some values are not possible; a quality rule finds them.
  - id: wikidata
    nombre: Wikidata
    organismo: Wikidata, the Wikimedia Foundation's open knowledge base
    que_es: >-
      What is known about each company: its headquarters, the stock exchange it is listed on, its owner or parent
      company and its website.
    que_usa: >-
      To complete the companies that have an LEI with what no official source says. It is queried live or saved with
      its date.
    cuidado:
      - >-
        It is collaborative: it may be incomplete or out of date. Rastro keeps what it said and when.
      - Only companies with the same LEI are used; the same name is not enough.

columnas:
  company: Company
  share: Oil that belongs to it (million m³)
  gasShare: Gas that belongs to it (million m³)
  operated: Oil it declares as operator (million m³)
  rule: Rule
  type: Well type
  wells: Wells
  disagree: The registry names another company
  concession: Concession
  operator: Operator
  detected: Possible venting (satellite)
  declared: Declared venting points
  unconventionalOil: Unconventional oil (million m³)
  shaleGas: Shale gas (million m³)
  shaleOil: Shale oil (million m³)
  distanceKm: Nearest pipeline (km)
  pipeline: Pipeline
  place: Where
  why: Why review it
  since: Since
  previous: Previous operator
  new: New operator
  oilBefore: Oil per month before (million m³)
  oilAfter: Oil per month after (million m³)
  gasBefore: Gas per month before (million m³)
  gasAfter: Gas per month after (million m³)

preguntas:
  - id: e01
    porque:
      titulo: "The share of {valor}, concession by concession"
      explica: "Its share is the sum, in each concession, of production times its percentage. Each percentage comes from the partners text on the map, with its source."
      detalle: "{porcentaje} % · {parte} million m³ of oil"
      flecha: partner in
      columnas: {concesion: Concession, porcentaje: "Percentage", parte: "Its share of oil (million m³)", gas: "Its share of gas (million m³)", texto: "Evidence: the map text", fuente: Source}
      recorrido:
        title: Why this number?
        company: Company to check
        concession: See a concession
        definition: 'The operator declares the production of the wells. This answer calculates how much belongs to each partner according to its registered share.'
        total: '**{company}: its shares in {count} concessions are added up.**'
        comparison_title: Compare operated production and share
        operated_label: Oil declared as operator
        share_label: Oil according to its share
        comparison_note: >-
          These are different 2025 measures: the operator declares the production of its wells, including its partners' part.
          The share is calculated with the percentages registered in each concession.
          This comparison does not measure the accuracy of SQL against Rastro.
        unavailable: No data
        breakdown_title: See all the concessions of this company
        breakdown_note: The total in the answer adds up these shares. The volumes in each row are shown rounded.
        calculation_title: How it was obtained
        calculation: 'In {concesion}, {company} is entitled to {production} million m³ of oil × {percent} % = {share} million m³.'
        rounding: Volumes are shown in million m³, rounded; the calculation uses the original precision.
        connections_title: What Rastro connected
        sources:
          - title: Production declarations
            text: 'Production of the wells in {concesion}: {production} million m³.'
          - title: Concession map
            text: 'Registered share of {map_name} in the map text: {percent} %.'
        connection: '{concesion} → Share → {company}'
        connection_detail: Production and partners are connected through the same concession.
        pending_link: >-
          On the map, the partner appears as «{map_name}». Rastro links it to {company} through a correction reviewed by an
          AI assistant, which is still awaiting a person's confirmation: this part of the number depends on that link.
        contribution: >-
          The mappings translate the sources into Well, Concession, Company and Share.
          The links gather a company's names under a single identifier, with their rule and evidence.
          Those definitions are reused across questions; they can also be queried with SQL over the same links.
        records_title: See the original records
        original_text: '**Original map text:** {text}'
        records_note: >-
          The row shows the calculated share and the original partners text that supports it.
          It is a current query over the loaded sources, not a historical copy of the portal.
        production_columns: {pozo: Well, mes: Month of 2025, petroleo: Declared oil (m³)}
        production_note: Up to 12 declarations with the most oil in the concession, from the 2025 Capítulo IV. The sum uses all its declarations.
        linking_title: See how the names were connected
        linking_note: >-
          Each name in a source points to the same company. The rule and its evidence explain the link;
          «Status» says what backs it: an automatic rule, a correction reviewed by AI that a person still has
          to confirm, or one a person confirmed with a document.
        identity: '**A shared identifier for this company:**'
        linking_columns: {nombre: Name in the source, fuente: Source, regla: Rule, evidencia: Evidence and review}
        technical_title: Identifiers and query for this walkthrough
        missing: No evidence is available for this selection.
    explicacion: |
      - **What it looks for:** the 2025 oil production of each well, the concession it is in and the partners of that concession with their percentage.
      - **What it calculates:** for each company, production multiplied by its percentage, added up over all its concessions; next to it, what it operates (the production it declares).
      - **What SQL would have to do by hand:** split the partners text on the map («YPF S.A.: 50 %») and match company names across sources. Here they are already concepts: «Share» and «Company».
      - **The SQL below:** Rastro translates each concept into Rastro's link tables and joins everything in a single query.
    simple: How much 2025 oil belongs to each company, according to its share?
    tecnica: How much 2025 oil belongs to each company, multiplying the production of each concession by its percentage?
    ventaja: "The partners are in a text on the concession map; Rastro splits them once, with their percentage, and matches each company's names across sources. Chevron takes part under two legal names; a reviewed correction groups them."
    terminos:
      Participación: {term: "Share", text: "the percentage of a concession that belongs to each partner (share). The operator runs the wells, but the oil is divided among the partners."}
      m³: {term: "m³", text: "cubic metres of oil. One cubic metre is about 6.3 barrels."}
    antes_despues:
      sin: {valor: "YPF: {ypf_sin} M m³", detalle: "Adding up production by the company that declares it, YPF is assigned everything it operates, and half of La Amarga Chica, which is in the name of Petronas E&P Argentina (Vista's since 2025), does not appear."}
      con: {valor: "YPF: {ypf_con} M m³", detalle: "Its share in each concession, according to the partners on the map. Vista: {vista} M m³, with half of La Amarga Chica ({vista_lac}), which it bought from Petronas E&P Argentina in 2025; Chevron: {chevron} M m³, with its two legal names. Those two joins are 🟠 reviewed by AI, a person must confirm; YPF's {ypf_con} does not depend on them."}
      impacto: >-
        Without integration, YPF is assigned {exceso} million m³ too much ({barriles} million barrels): about
        US$ {dolares} million, at an assumed price of US$ {precio} per barrel. It is its partners' production.
    evidencia:
      texto: "The partners of each concession, as the map reports them (some examples):"

  - id: e02
    porque:
      titulo: "YPF's «{valor}» wells: who operates them and why"
      explica: "For each well, Rastro keeps what each source says and which rule decided who operates it. Some examples:"
      detalle: "{regla}"
      nodo: "Well {pozo}"
      flecha: operates it
      columnas: {pozo: Well, regla: Rule, texto: "Evidence: what each source says"}
    explicacion: |
      - **What it looks for:** the «operator of a well» links that name YPF, grouped by well type (oil, gas, injection…).
      - **What it returns:** how many wells of each type YPF operates and in how many the sworn production declaration prevails because the registry names another company. These are all the wells YPF declares in 2025, whether they produce or not.
      - **What SQL would have to do by hand:** decide in each query which source prevails (registry or declarations). Here the rule is written once, and each well keeps its evidence.
    simple: How many wells does YPF operate today, and of what type?
    tecnica: How many wells with a sworn production declaration in 2025 does YPF operate today, by well type (energia:wellType), and in how many do the sources disagree?
    ventaja: "The well registry and the sworn production declarations do not always name the same operator. Rastro applies a rule written once (whoever declares the production of the last month prevails) and keeps in view what the registry says for each well."
    terminos:
      Declaración jurada: {term: "Sworn production declaration", text: "what each company reports every month to the Secretaría de Energía about the production of each well."}
      Padrón de pozos: {term: "Well registry", text: "the register of all wells, with their location and their company."}
    antes_despues:
      sin: {valor: "{padron} or {declaraciones}", detalle: "Two answers: the well registry says {padron} and the sworn production declarations, {declaraciones}. In {otra} wells the registry names another company (Pecom, Velitec, Copesa)."}
      con: {valor: "{pozos} wells", detalle: "One written rule: whoever declares the production of the last month prevails. What the registry says stays in view for each well. They are wells of every type: {petroliferos} oil, {gasiferos} gas, {inyeccion} injection and {otro} of other types; {produjeron} produced oil or gas in 2025."}
    evidencia:
      texto: "Wells where the sources disagree (some examples):"
      formato: "**Well {pozo}**: {evidencia}"

  - id: e03
    porque:
      titulo: "The possible venting events in {valor}, and why they fall there"
      explica: "Each satellite point has coordinates; Rastro placed it inside the outline of the concession and kept the evidence."
      flecha: possible venting
      columnas: {fecha: Date, satelite: Satellite, texto: "Evidence: where the point falls", fuente: Source}
    explicacion: |
      - **What it looks for:** the possible venting events seen by satellite and the concession each one falls in, with its operator on the map and its declared venting points.
      - **What it returns:** the 10 concessions with the most detections.
      - **What SQL would have to do by hand:** place each point inside the outline of each concession (point in polygon). Rastro calculated it once; the query only says «in the concession».
    simple: In which concessions did the satellite see the most possible gas venting since 2024, and who operates them?
    tecnica: Which concessions have the most thermal anomalies detected by satellite since 2024, with their operator and their declared venting points?
    ventaja: "The satellite layer only gives date and province. Rastro places each point inside the outline of its concession, once, and so reaches the operator and the declared venting."
    terminos:
      Venteo: {term: "Venting", text: "releasing or flaring gas at the field instead of using it."}
      Posible venteo: {term: "Possible venting", text: "a thermal anomaly seen by a satellite. It is a sign to review, not a confirmation."}
    antes_despues:
      sin: {valor: "Neuquén: {neuquen}", detalle: "The satellite layer only gives date and province: it does not say which concession or which company. It also spells Tierra del Fuego in two ways."}
      con: {valor: "La Calera: {la_calera}", detalle: "{ubicados} possible venting events placed in their concession, with their operator. La Calera (Pluspetrol): {la_calera}, with no declared venting point on the map."}
    evidencia:
      texto: "Why each detection is in La Calera (some examples):"

  - id: e04
    porque:
      titulo: "The unconventional oil of {valor}, by formation"
      explica: "No table says «unconventional»: Rastro infers it from the resource type (shale or tight) of each sworn production declaration."
      flecha: declares in
      detalle: "{petroleo} million m³"
      columnas: {formacion: Formation, petroleo: "Unconventional oil 2025 (million m³)"}
    explicacion: |
      - **What it looks for:** the production of each well that is «unconventional» and the company that declares it.
      - **What it returns:** the 10 companies with the most unconventional oil.
      - **What is special:** «unconventional» is not a column. The dictionary says that shale and tight are types of unconventional, and Rastro infers it. If another type is added tomorrow, one line of the dictionary changes, not every query.
    simple: Who produces the most unconventional oil (shale and tight)?
    tecnica: Which companies declare the most unconventional oil in 2025 (the inferred class, with no mapping of its own)?
    ventaja: "«Unconventional» is defined once, in the business dictionary: shale or tight. No mapping assigns it; it holds for every question."
    terminos:
      No convencional: {term: "Unconventional", text: "oil from low-permeability rock (shale, such as Vaca Muerta, or tight), extracted with hydraulic fracturing."}

  - id: e05
    porque:
      titulo: "The pipeline nearest to {valor}"
      explica: "Rastro measured once the distance from the outline of each concession to each ENARGAS pipeline section and kept the nearest one, with its evidence."
      detalle: "{distancia} km away"
      flecha: nearest pipeline
      columnas: {gasoducto: Pipeline, distancia: "Distance (km)", texto: Evidence, fuente: Sources}
    explicacion: |
      - **What it looks for:** the concessions with possible venting and, for each one, the nearest ENARGAS transmission pipeline and how many km away it is.
      - **What it filters:** only those whose pipeline is 10 km or more away.
      - **What SQL would have to do by hand:** measure distances between outlines and pipes from two different agencies. Rastro calculated them once and keeps them with their evidence.
    simple: Which concessions with possible venting have no transmission pipeline nearby?
    tecnica: Which concessions with possible venting detected by satellite have the nearest ENARGAS transmission pipeline 10 km or more away?
    ventaja: "The pipelines belong to another agency (ENARGAS). Rastro calculates once the distance from each concession to the nearest pipeline and joins it with the venting: a clue to where the gas has no outlet."
    terminos:
      Gasoducto de transporte: {term: "Transmission pipeline", text: "the trunk pipes that carry gas to consumption centres. It does not include the internal pipes of each field."}
    evidencia:
      texto: "Why Rastro gives the distance (some examples):"

  - id: e06
    porque:
      titulo: "The possible venting events in {valor} in a protected area or near a town"
      explica: "For each satellite point, Rastro kept the nearest town, the distance and whether it falls in an IGN protected area."
      flecha: possible venting
      columnas: {fecha: Date, lugar: Where, texto: Evidence}
    explicacion: |
      - **What it looks for:** the possible venting events with their surroundings according to the IGN: the nearest town and the protected area, if it falls in one.
      - **What it filters:** those in a protected area or less than 3 km from a town, and counts them by concession and operator.
      - **What is special:** the surroundings come from another source (IGN) and were joined once by location; the query uses them like any other data.
    simple: Which possible venting events are inside a protected area or near a town?
    tecnica: Which possible venting events detected by satellite fall inside a protected area or less than 3 km from a town, according to the IGN?
    ventaja: "The towns and protected areas come from the Instituto Geográfico Nacional. Rastro places each possible venting event relative to them once, with the evidence, and reaches the concession and its operator."
    terminos:
      Área protegida: {term: "Protected area", text: "a reserve or park with legal protection, national or provincial."}
    evidencia:
      texto: "The surroundings of some possible venting events:"

  - id: e07
    porque:
      titulo: "The LEI of {valor}"
      explica: "Rastro looked up the company in GLEIF and kept the LEI only if the legal name is the company's, with the evidence."
      flecha: global identifier
      columnas: {lei: LEI, texto: Evidence, fuente: Sources}
    explicacion: |
      - **What it looks for:** the companies that have an LEI (the global identifier from GLEIF) and the production they declare.
      - **What it returns:** each company with its LEI and what it operates, from highest to lowest.
      - **What is special:** the LEI was accepted only if the legal name matches; the discarded candidates remain in the evidence.
    simple: Which companies have a global identifier (LEI)?
    tecnica: Which companies producing in Argentina have an LEI in GLEIF, and how much oil do they operate?
    ventaja: "The LEI links each company to the global GLEIF register, the same one banks and regulators use. Rastro accepts it only if the legal name matches, and keeps in view what it discarded."
    terminos:
      LEI: {term: "LEI", text: "the global company identifier (GLEIF), the same all over the world."}
    evidencia:
      texto: "How each LEI was chosen (some examples):"

  - id: e08
    porque:
      titulo: "Why {valor} should be reviewed"
      explica: "«To review» is not in any table: Rastro infers it from two rules in the dictionary. Below, each reason and the evidence it relies on."
      flecha: reviewed because of
      columnas: {que: What, texto: Evidence, fuente: Where from}
    explicacion: |
      - **What it looks for:** the «concessions to review», with their operator and the reason.
      - **What is special:** «concession to review» is not a column and has no mapping. The dictionary says these are the ones with possible venting that also have no pipeline nearby, or have not filed gas venting reports. Rastro infers it from those two rules.
      - **What SQL would have to do by hand:** repeat both rules, with the distances and the studies, in every query that uses them. Here they are written once and hold for all of them.
    simple: Which concessions should be reviewed for venting, and why?
    tecnica: Which concessions are «to review» (inferred class, with no mapping of its own), with their operator and their reason?
    ventaja: "The rule is written once in the business dictionary: possible venting and, in addition, no transmission pipeline nearby or no venting report filed. Rastro infers it; it holds for this question, for the map and for any other that uses it."
    terminos:
      Concesión para revisar: {term: "Concession to review", text: "a concession worth looking at because of its possible venting. It is a sign, not a conclusion."}

  - id: e09
    porque:
      titulo: "The change of operator in {valor}"
      explica: "Rastro decides month by month who declares most of the production of each concession and marks a change when another company does so for 3 months in a row. It keeps the evidence."
      detalle: "since {desde}, previously {anterior}"
      flecha: takes over operating it
      columnas: {desde: Since, anterior: "Previous operator", nueva: "New operator", texto: Evidence}
    explicacion: |
      - **What it looks for:** the «changes of operator»: each concession where another company began to declare most of the production, with the month, the previous operator and the new one.
      - **What it returns:** what the concession produced per month, on average, with the previous operator and with the new one; from most to least oil.
      - **What SQL would have to do by hand:** join three years of sworn production declarations (three files), match company names across years, decide month by month who declares most of it and discard isolated months. Rastro does it once and each change keeps its evidence.
    simple: Which areas changed operator between 2023 and 2025, and how much did they produce before and after?
    tecnica: In which concessions did another company begin to declare most of the production between 2023 and 2025 (at least 3 months in a row), and how much oil and gas did they produce per month with each operator?
    ventaja: "The sworn production declarations are one file per year. Rastro joins them, decides month by month who declares most of each concession and marks each change with its evidence: this shows the mature areas YPF sold (Pecom, Petróleos Sudamericanos, Bentia, Quintana) and how much they produced."
    terminos:
      Cambio de operadora: {term: "Change of operator", text: "from that month on, another company declares most of the production of the concession, for at least 3 months in a row."}
      Áreas maduras: {term: "Mature fields", text: "conventional fields with many years of production, which often pass to smaller companies."}
    evidencia:
      texto: "Why Rastro says the operator changed (some examples):"

  - id: e10
    porque:
      titulo: "The shale gas of {valor}, by concession"
      explica: "«Shale» comes from the resource type of each sworn production declaration; the concession, from each well's link to the map."
      detalle: "{gas} million m³"
      flecha: declares in
      columnas: {concesion: Concession, gas: "Shale gas 2025 (million m³)"}
    explicacion: |
      - **What it looks for:** the production of each well that is shale and the company that declares it.
      - **What it returns:** the 10 companies with the most shale gas in 2025, with their shale oil next to it.
      - **What is special:** it is the same inferred class as unconventional (shale is one type), seen through gas. Gas and oil come from the same sworn production declarations, well by well.
    simple: Who produces the most shale gas (Vaca Muerta)?
    tecnica: Which companies declare the most shale gas in 2025 (energia:ShaleProduction, with its gas in thousand m³)?
    ventaja: "Gas and oil are in the same dictionary and come from the same sworn production declarations: asking about gas means changing one word in the query."
    terminos:
      Gas de shale: {term: "Shale gas", text: "gas from low-permeability rock (such as Vaca Muerta), extracted with hydraulic fracturing. The sources declare it in thousands of m³; Rastro shows it in millions of m³."}

afirmaciones:
  titulo: Check a claim
  intro: >-
    A sentence from a report or the press, checked against the data. Rastro says whether it **holds**, whether it **does not
    hold** (with the correct value) or whether it **does not have the data**, without making it up. When the sentence can be read in two
    ways, it shows both.
  ejemplos:
    - texto: Total Austral was the largest gas producer in Argentina in 2025.
      nota: Both readings are correct and the sentence does not say which one it uses. Published rankings use the first.
      lecturas:
        - nombre: If «producing» is the gas each company operates
          unidad: billion m³
        - nombre: If «producing» is the gas that belongs to it by its share
          unidad: billion m³
    - texto: Tecpetrol declared about 6,900 million m³ of gas in 2025.
      lecturas:
        - nombre: The gas Tecpetrol declared in 2025
          unidad: million m³
    - texto: YPF had proven gas reserves of 150 billion m³ at the end of 2024.
      lecturas:
        - nombre: YPF's proven reserves
          falta: Rastro has no reserves. It has the declared production, the concessions with their partners, the venting and the environmental studies.

externo:
  titulo: Enrich with outside data (Wikidata)
  grafo:
    rastro: "Rastro\\ncompany · LEI · oil 2025"
    fuente: "Wikidata (internet)\\nheadquarters · stock exchange · owner · website"
    consulta: "one query\\n(GraphDB)"
    clave: "  the same LEI  "
  columnas_guardado: {empresa: Company, bolsa: Listed on, sede: Headquarters, consultado: Queried on, wikidata: Wikidata}
  fecha_guardado: Oct 20, 2026
  intro: >-
    **Enriching** means adding to your own data what another source knows, without losing where each value came from.
    A single query joins, live, **Rastro** and **Wikidata**: the companies with a global identifier (LEI)
    and the 2025 oil that belongs to them according to their partners (the same number as in step 1), with what Wikidata knows about each one (headquarters, the stock exchange it is listed on,
    owner or parent and website). Nothing is loaded: Rastro and Wikidata use the same LEI.
  conclusion: >-
    That YPF and Pampa Energía are listed on the New York Stock Exchange is not in any of Rastro's six
    sources: it comes from Wikidata in the same query. Only 3 of the 12 companies with an LEI have it recorded in
    Wikidata; others appear by name, but that match would need review and the LEI does not.
  columnas:
    empresa: Company
    su_parte_m3: Its share of 2025 oil (m³)
    declara_m3: Declares as operator (m³)
    sede_segun_wikidata: Headquarters (Wikidata)
    cotiza_en: Listed on (Wikidata)
    duenio_o_matriz: Owner or parent (Wikidata)
    sitio: Website (Wikidata)

tarjetas:
  - titulo: Correct answers
    valor: "{c_correct} of {n_questions}"
    compara: "Without Rastro: {b_correct} of {n_questions}"
  - titulo: The same question, the same answer
    valor: "{c_consistent} of {n_consistency}"
    compara: "Without Rastro: {b_consistent} of {n_consistency}"
  - titulo: If a source changes, it is fixed with
    valor: 1 line
    compara: "Without Rastro: rewrite {b_broken} queries"
  - titulo: Every answer can be audited
    compara: "of the {n_enlaces} links between sources keep their source, their rule and their text; and {cols_ok} of {cols} answer columns say which source they come from."

cambios:
  - titulo: The way a value is written changes
    que: The Secretaría de Energía publishes a new version of Capítulo IV and oil is now in barrels.
    donde: "in the mapping (mappings/energia.r2rml.ttl)"
    valor:
      texto: "how much of 2025's oil belongs to YPF?"
      unidad: million m³
  - titulo: The name of a column changes
    que: The Secretaría de Energía publishes a new version of Capítulo IV and the oil column is renamed.
    donde: "in the mapping (mappings/energia.r2rml.ttl)"

fuera:
  intro: >-
    Industry questions that Rastro's data cannot answer (prices, reserves, investments, 2026, employment) and one
    control question that it can. With the same rule for everyone («if the data is not enough, say what is missing»), none made anything up: all
    of them said what was missing. The difference is in the control question: without the data it cannot be answered; with the data it can,
    and with its source.
calidad:
  intro: >-
    Rules over the integrated data, written once in the words of the dictionary and checked after every
    load, like the quality checks of a database. They look at all the sources together and also at the evidence.
    They fix nothing: they show what is not met, where, and which Rastro Lab predictions use that value (the ones that inherit
    the error). The first time they found 5 well trajectories without evidence; it was fixed in one place, the rule that
    builds the evidence. The rules on impossible values flag source data for review, without changing it.
  tecnico: >-
    The quality rules are written in SHACL, the W3C standard for validating a graph. Rastro fetches with CONSTRUCT only what
    they look at and validates it with pySHACL. Each rule has a target (`sh:targetClass`, `sh:targetSubjectsOf`), its
    conditions (`sh:minCount`, `sh:maxInclusive`, `sh:pattern`, `sh:lessThanOrEquals`) and, if needed, a SPARQL
    query (`sh:sparql`). The same rules work in other knowledge-graph platforms or tools.

faq:
  - pregunta: Where does the data come from?
    respuesta: >-
      From six public sources of four agencies. From the Secretaría de Energía: the monthly sworn production declarations
      of each well in 2025 and the well registry (Capítulo IV, datos.energia.gob.ar), the
      map service (WFS) with the concessions, their partners and gas venting, and the list of environmental
      studies filed for each concession. From the same service,
      the ENARGAS transmission pipelines. From the Instituto Geográfico Nacional (listed in IDERA), the
      towns and protected areas. And from GLEIF, the global identifier of the companies. 2025 is used
      because the 2026 file does not yet include all operators. The 2023 and 2024 files are used only
      to see who operated each concession over time (the changes of operator).
  - pregunta: Why are the groups (Chevron, Pluspetrol, CGC) reviewed corrections rather than coming from a register?
    respuesta: >-
      Because no public register has them: GLEIF does not record the parent of any of these Argentine
      companies, and Chevron's companies have no LEI; Wikidata does not record those relationships either.
      That is why they are reviewed corrections, with their reason in view, and the LEI is used as the identifier of
      each company.
  - pregunta: Is a possible venting event detected by satellite a breach?
    respuesta: >-
      No. It is a thermal anomaly seen by a satellite: a sign to review. Moreover, the layer of declared venting
      points may be out of date. Rastro shows which concession each point falls in and who operates it,
      not that there is a violation.
  - pregunta: Why is the operator rule «the sworn production declaration prevails»?
    respuesta: >-
      Because it is what the company reports every month. It is a business decision, written once and in
      view: if another one is preferred, it is changed in a single place and holds for every question. In each
      well where the sources disagree, the evidence shows what the registry says.
  - pregunta: Who reviewed the name corrections?
    respuesta: >-
      An AI assistant drafted them (for example, that YPF's partner in Loma Campana is Chevron's
      company); a person still has to confirm them. They are in linking/energia/correcciones.csv, with their reason.
  - pregunta: Can it be joined with data from other organizations, such as Wikidata?
    respuesta: >-
      Yes, through the LEI, which Rastro and Wikidata use in the same way. A single query in GraphDB joins, live and without
      loading anything, Rastro's companies with what Wikidata knows about them: headquarters, the stock exchange they are listed on
      and website. This shows that YPF and Pampa Energía are listed on the New York Stock Exchange, a fact that is not
      in any of the six sources. Only 3 of the 12 companies with an LEI have it recorded in
      Wikidata (YPF, Pan American Energy and Pampa Energía). Details in layer/energia/externo/.
  - pregunta: What does Rastro Lab's linear regression do?
    respuesta: >-
      It learns a coefficient for each characteristic of the well. The prediction can be written as the average gas
      plus what each characteristic adds or subtracts. The ridge variant limits the coefficients to reduce
      overfitting. Its contributions explain the model's arithmetic; they do not prove physical causes.
  - pregunta: What is Random Forest?
    respuesta: >-
      It is a forest of decision trees. Each tree asks questions about the well's data and reaches an
      estimate; the forest averages the estimates. Each tree uses a random sample of the wells and
      considers different variables at each decision, to reduce reliance on a single tree. The drawing in the app follows a real tree
      of the forest for the selected well.
  - pregunta: What is XGBoost?
    respuesta: >-
      It builds trees one after another: each new tree helps correct the errors of the previous ones.
      It combines those corrections to estimate the gas and limits complexity to reduce overfitting.
      It can learn relationships between variables that a linear sum does not represent directly.
  - pregunta: What is LightGBM?
    respuesta: >-
      It also builds trees that correct the previous errors. It chooses which leaf to split by how much it can
      reduce the error, aiming for efficient training. In Rastro Lab the depth and the size
      of the leaves are limited. Using this algorithm does not guarantee better predictions: it is checked on the same wells.
  - pregunta: How was the alternative model chosen?
    respuesta: >-
      Random Forest, XGBoost and LightGBM were compared, trained on the gas directly and on its logarithm.
      The combination with the lowest mean error on the 2023 and 2024 wells was chosen; the 2025 wells are shown
      separately as the evaluation. All of them predict the gas of months 2 to 7 with the same variables. The Rastro Lab
      table keeps the results of every option and of the regression. It is an experimental evaluation.
  - pregunta: Does the drawn tree explain the whole prediction?
    respuesta: >-
      The drawing shows the well's real path through the first tree. In Random Forest many trees are averaged;
      in XGBoost and LightGBM the corrections of many trees are combined. A single tree shows part of the calculation.
      Rastro lets you open the values used and their sources. The model's decisions do not prove physical causes.
  - pregunta: References
    respuesta: |-
      A published study joins these same public sources (production per well, registry, fracturing data and
      trajectories) to predict the first-year gas of 642 shale gas wells in Vaca Muerta. Rastro Lab uses it
      to validate that its model gives reasonable numbers with the same data: with that study's design, the
      median by area gives practically the same result (R² 0.45 against 0.47). Rastro Lab makes the same prediction with
      another goal: that each prediction is explained in business concepts, with the source of each value.

      - Fernández Gazzaniga, A. (2025). «Predicción de productividad inicial en pozos de shale gas de Vaca Muerta
        mediante machine learning». [Master's thesis. Universidad Torcuato Di Tella]. Repositorio Digital
        Universidad Torcuato Di Tella. https://repositorio.utdt.edu/handle/20.500.13098/14415

      The references on knowledge graphs are in «References», in the questions for all the cases.
  - pregunta: Where is each piece?
    respuesta: >-
      Data in Postgres, one schema per source (`capitulo4`, `sig_energia`, `enargas`, `ign`, `gleif_energia`);
      companies, partners, operators, located venting, nearby pipelines and surroundings in the `energia` schema
      (`linking/energia/`); a third Ontop on port 8082 with its
      ontology (`ontology/energia/`) and its mappings (`mappings/energia.r2rml.ttl`). Each link is exposed with PROV-O.

technical:
  pieces:
    enlaces:
    - - Step 1 · The partners of each concession, split from the map text
    - - Step 1 · The same company, written differently in each source
    - - Step 2 · Who operates each well (wells where the registry says something else)
    - - Step 3 · Which concession each possible venting event falls in (La Calera)
    mapas:
    - - Step 1 · Share, company names and production
    - - Step 2 · The operator of each well
    - - Step 3 · The venting event and its concession
  map:
    tooltip: <b>{nombre}</b><br>{operadora}<br>{venteos} possible venting events<br>{revisar}
    caption: 'Red dots: possible venting seen by satellite since 2024. Amber
      lines: transmission pipelines (ENARGAS). Concessions in red: to review,
      according to the dictionary rule; in blue, with possible venting. Everything comes from
      Rastro, with geometries in the OGC standard (GeoSPARQL).'

ejemplo_integracion:
  titulo: Step by step
  encabezado: How Rastro joins the data, with a real well and a real company
  para_que: >-
    Show with a real case how Rastro turns tables that do not talk to each other into an answer that can be audited:
    the same well in two tables, the same company with two names, and an answer that leads back to its records.
    This is what SQL would have to solve by hand in every query.
  aviso: >-
    Real data, queried now: well 164166 of Compañía General de Combustibles (CGC), in Cañadón Seco,
    Santa Cruz. Each number comes from the query shown in the step.
  selector: Choose a step
  pasos:
    - titulo: 1 · One well, two tables
      parte: >-
        Dictionary and mappings: each source is translated into the same business concepts (Well, Company, Production),
        without changing the original data.
      contenido: |
        The sworn production declarations and the well registry describe the same well with different columns
        and name the company differently. Rastro joins them by the **official well identifier** (`idpozo`),
        the one the Secretaría de Energía uses in both tables: not by similarity of names.
      consultas:
        - titulo: What the well registry says (as it comes)
        - titulo: What the sworn production declarations say (the first two months of 2025, as they come)
        - titulo: What Rastro knows about that well (a single Well, with its operator)
    - titulo: 2 · One company, two names
      parte: >-
        Links with evidence: each link states its rule, its evidence and which source it comes from (PROV-O). Those reviewed by
        an AI assistant are awaiting a person's confirmation, and the app says so.
      contenido: |
        The declarations name the company **CGC ENERGIA SAU**; the registry and the concession map,
        **COMPAÑÍA GENERAL DE COMBUSTIBLES S.A.** No common code joins them. A **reviewed correction** says they are
        the same company and why. It was reviewed by an AI assistant and is awaiting a person's confirmation.
      consultas:
        - titulo: Each name, in each source, with its rule and its evidence
    - titulo: 3 · The answer and its origin
      parte: >-
        The answer: a query over the dictionary. From each number you go back to its records and to the links
        that support it (what «Why trust it» measures).
      contenido: |
        **How much gas did Compañía General de Combustibles declare in 2025?**

        In the sworn production declarations, the company appears under **both names**. An SQL query that looks for only one
        finds part of it. With Rastro, the production under both names belongs to a single company, and the reason is the
        link from step 2.
      consultas:
        - titulo: "Without Rastro: what each name finds in the declarations"
        - titulo: "With Rastro: a single company"

