# What belongs to the oil and gas domain in the app (drawn by app/dominio/).
# Rutas dentro del contenedor de la app.

domain: energia                # el de layer/dominios.yaml: endpoint, diccionario y notas para el LLM
resumen: >-
  Datos públicos de Argentina: la producción de 2025 pozo por pozo (Capítulo IV, con 2023 y 2024
  para ver quién operó cada concesión) y los mapas de
  concesiones, socios y venteos de gas y los estudios ambientales de la Secretaría de Energía, los gasoductos de ENARGAS, las
  localidades y áreas protegidas del IGN, y el identificador global de empresas (GLEIF).
portada:                       # the start page (app/inicio.py): the problem in three measured numbers
  pregunta: e01                # its contrast card gives {e01[...]}; {cambio[b_broken]} and {correccion[lugares]} come
                               # from the change and correction tests (layer/energia/cambio/)
  cifras:
    - valor: "US$ {e01[dolares]} M"
      etiqueta: de petróleo asignado de más
      texto: "A YPF en 2025, sumando por quien declara la producción: {e01[exceso]} millones de m³ de sus socios, a US$ {e01[precio]} el barril (un supuesto)."
    - valor: "{cambio[b_broken]}"
      etiqueta: consultas rotas
      texto: "cuando la fuente le cambia el nombre a una columna. Con Rastro, se arregla en una línea."
    - valor: "{correccion[lugares]}"
      etiqueta: lugares para un mismo dato
      texto: "donde vive el mismo dato sin Rastro. Con Rastro se corrige en uno, y llega a todas las respuestas y al modelo."
ejemplo_libre: "Por ejemplo: ¿quién produjo más gas en 2025? Y después: ¿y cuánto le corresponde por su participación?"
evaluacion: /layer/energia/resultados.json
cambio: /layer/energia/cambio/resultado.json
correccion: /layer/energia/cambio/correccion.json
avisos_cambio:                 # the change test records its check in Spanish; the English file writes it again
  - patron: 'suma ([\d.,]+) millones de m³, y la producción nacional ronda los ([\d.,]+)'
    texto: "el petróleo de 2025 suma {0} millones de m³, y la producción nacional ronda los {1}: ¿cambió la unidad?"   # shown as recorded in Spanish; the English file translates it
evidencia: /layer/energia/evidencia.json   # cobertura de la evidencia (layer/evidencia.py)
ontologia: /ontology/energia/energia.ttl
texto: /layer/energia/textos/venteos.json   # la pregunta sobre textos (GraphRAG anclado)
diagrama: {archivo: ontologia-energia, titulo: diccionario de petróleo y gas}   # app/ontologia-energia.svg, lo dibuja docs/diagramas/build.py

# The demo in two acts: Rastro Layer (a number you can trust), then Rastro Lab (a prediction you can defend)
demo_porque: >-
  Dos actos. En Rastro Layer, un número en el que se puede confiar: responde con evidencia, se arregla en un lugar
  cuando una base cambia, y una corrección hecha una vez llega a todas las respuestas. En Rastro Lab, una predicción
  que se puede defender: el modelo hereda todo lo anterior, y la misma corrección (Aguada Pichana Este) ya llegó a su
  entrada y a su explicación. Todo corre en vivo sobre datos públicos de petróleo y gas,. Las demás preguntas (quién opera cada pozo, venteos en el mapa) están en «Preguntar».
demo:
  - paso: Preguntar
    acto: Rastro Layer
    titulo: "¿Cuánto petróleo le corresponde a cada empresa?"
    pregunta: e01
    muestra: >-
      La respuesta primero. Con «¿Por qué este número?», elegir una empresa y una concesión para seguir
      el cálculo, las conexiones entre fuentes y los registros originales. Producción operada y participación son medidas distintas.
  - paso: La base cambia
    acto: Rastro Layer
    titulo: "La fuente publica una versión nueva"
    tipo: cambio
    escenario: valores
    muestra: >-
      Sin Rastro, el número cambia y nadie se entera. Con Rastro, una regla avisa y se arregla en un lugar.
  - paso: Una corrección
    acto: Rastro Layer
    titulo: "Se corrige un dato una vez, y cambian todas las respuestas"
    tipo: correccion
    parte: layer
    muestra: >-
      Un documento dice que en Aguada Pichana Este Total tiene el 55 %, no el 27,27 % del mapa. Se corrige una
      vez en Rastro, con el documento, y cambian solas todas las respuestas que dependen de esa participación.
  - paso: Predecir
    acto: Rastro Lab
    titulo: "¿Cuánto gas va a dar un pozo nuevo?"
    tipo: lab
    correccion: true
    puente: >-
      Todo lo que Rastro sabe (cada unión, cada regla, cada corrección) también lo hereda un modelo.
    muestra: >-
      Un pozo nuevo de Vaca Muerta. El mismo modelo con y sin Rastro: predicen igual de bien, pero con
      Rastro la predicción dice en qué se apoya, de dónde sale cada dato y cuáles conviene revisar.

# Fuentes: nombre corto para los encabezados del modo técnico
fuentes:
  capitulo4: Capítulo IV
  sig_energia: Mapas (WFS)
  enargas: ENARGAS
  ign: IGN
  gleif: GLEIF
  rastro: enlace Rastro
nota_rastro: >-
  Las empresas con sus nombres en cada fuente, los socios de cada concesión, quién opera cada pozo
  y en qué concesión cae cada venteo, y quién operó cada concesión mes a mes, que Rastro resuelve una
  vez y guarda con su evidencia

# «Las fuentes de datos»: what each source is, what Rastro takes from it and what to watch out for. The name, the
# license, the link, the version, the rows and the load date are read from Rastro's load records, never typed here.
fuentes_detalle:
  - id: capitulo4
    nombre: "Capítulo IV: producción y padrón de pozos"
    organismo: Secretaría de Energía de la Nación, portal de datos abiertos
    que_es: >-
      Las declaraciones juradas que cada empresa presenta todos los meses con la producción de petróleo, gas y agua
      de cada pozo, y el padrón con todos los pozos del país, su empresa registrada y su ubicación.
    que_usa: >-
      La producción de 2025, pozo por pozo y mes por mes, para saber cuánto produce cada concesión y cada empresa;
      la de 2023 y 2024, para ver quién operó cada concesión en el tiempo. Del padrón, la ubicación y el tipo de cada
      pozo. Rastro Lab suma de 2018 a 2022, en un espacio aparte que no cambia ninguna respuesta.
    cuidado:
      - >-
        La empresa que declara es la operadora, y declara toda la producción de la concesión, también la de sus
        socios. Por eso «lo que opera» y «lo que le corresponde» son números distintos.
      - El petróleo viene en m³ y el gas en miles de m³; Rastro los muestra en millones.
      - Se usa 2025 porque el archivo de 2026 todavía no trae a todas las operadoras.
      - El padrón y la declaración pueden nombrar empresas distintas para el mismo pozo; Rastro muestra las dos.
  - id: sig_energia
    nombre: Mapas de concesiones, socios y venteos
    organismo: Secretaría de Energía de la Nación, servicio de mapas
    que_es: >-
      Las concesiones de explotación con su contorno, su operadora y sus socios; los puntos de venteo y quema que
      declaran las empresas; y los posibles venteos que detecta un satélite.
    que_usa: >-
      Los socios de cada concesión y su porcentaje, para repartir la producción entre ellos; y en qué concesión cae
      cada venteo.
    cuidado:
      - >-
        Los socios están dentro de un texto («YPF S.A.: 50 %»). Rastro los separa una vez, con su porcentaje, y
        guarda el texto original como evidencia.
      - >-
        El mapa puede traer un dueño anterior: la mitad de La Amarga Chica figura a nombre de Petronas, que Vista
        compró en 2025. Una corrección con su fuente lo resuelve; la revisó un asistente de IA y falta que una
        persona la confirme.
      - Un venteo visto por satélite es un indicio (una anomalía térmica), no una confirmación.
    tecnico: >-
      El certificado del servidor llega sin la cadena completa: se descarga sin verificarlo, porque son datos públicos
      de solo lectura. Los contornos se cruzan con los puntos en Python (la base no tiene PostGIS).
  - id: enargas
    nombre: Gasoductos de transporte
    organismo: Ente Nacional Regulador del Gas (ENARGAS), publicado en el servicio de mapas de la Secretaría de Energía
    que_es: Los gasoductos de transporte del país, con su nombre, la empresa licenciataria y su recorrido.
    que_usa: >-
      El gasoducto más cercano a cada concesión y a qué distancia está (0 km si la cruza), para encontrar
      concesiones que ventean gas lejos de un gasoducto.
    cuidado:
      - Son los gasoductos de transporte; no están las redes de distribución ni las cañerías dentro de los yacimientos.
      - Las distancias son aproximadas, sobre el mapa, y alcanzan para esta escala.
  - id: ign
    nombre: Localidades y áreas protegidas
    organismo: Instituto Geográfico Nacional (IGN), listado en IDERA
    que_es: Las localidades del país y las áreas protegidas, con su ubicación y su contorno.
    que_usa: La localidad más cercana a cada posible venteo y si el venteo cae dentro de un área protegida.
    cuidado:
      - >-
        Cada localidad es un punto: la distancia es a ese punto, no al borde del pueblo.
  - id: gleif
    nombre: Identificador de empresas (LEI)
    esquemas: [gleif_energia]   # GLEIF is shared with another domain: count only this domain's tables
    organismo: Global Legal Entity Identifier Foundation (GLEIF)
    que_es: >-
      El registro mundial del LEI, el identificador que usan las empresas para operar en los mercados financieros,
      con su nombre legal y su estado.
    que_usa: El LEI de las empresas que más producen, para unir la misma empresa entre fuentes y con datos de afuera.
    cuidado:
      - >-
        Rastro busca cada empresa por su nombre: un candidato se acepta solo con una regla y su evidencia, y los
        dudosos no se usan.
      - No todas las operadoras tienen LEI.
  - id: ambiental
    nombre: Estudios ambientales
    organismo: Secretaría de Energía de la Nación, portal de datos abiertos
    que_es: >-
      El listado de estudios e informes ambientales que las empresas presentan por cada concesión, con su fecha y su
      tipo; entre ellos, las planillas de venteo de gas.
    que_usa: Si una concesión con venteos presentó sus planillas de venteo, para marcar las concesiones para revisar.
    cuidado:
      - >-
        La concesión viene escrita como texto, como la escribió quien presentó el estudio, sin su código. Rastro la
        une por el nombre, con su regla y su evidencia.
  - id: fractura
    nombre: Datos de fractura de pozos
    organismo: Secretaría de Energía de la Nación (Adjunto IV)
    que_es: >-
      Los datos de cada fractura hidráulica informada: el largo de la rama horizontal, las etapas, la arena, el agua y
      la presión máxima, por pozo.
    que_usa: Solo Rastro Lab, como datos del modelo que predice el gas de los pozos nuevos.
    cuidado:
      - >-
        Muchas fracturas se informan tarde. Rastro Lab usa solo lo informado hasta el mes en que empezó el pozo y
        marca lo que llegó después.
      - Algunos valores no son posibles; una regla de calidad los encuentra, y la predicción que los usa lo dice.
  - id: trayectorias
    nombre: Trayectorias de pozos
    organismo: Secretaría de Energía de la Nación, portal de datos abiertos
    que_es: >-
      La trayectoria de los pozos de Vaca Muerta: profundidad vertical, largo de la rama y fin de la perforación.
    que_usa: Solo Rastro Lab, como datos del modelo que predice el gas de los pozos nuevos.
    cuidado:
      - Una trayectoria por pozo. Algunos valores no son posibles; una regla de calidad los encuentra.
  - id: wikidata
    nombre: Wikidata
    esquemas: [wikidata_energia]
    organismo: Wikidata, la base de conocimiento abierta de la Fundación Wikimedia
    que_es: >-
      Lo que se sabe de cada empresa: su sede, la bolsa en la que cotiza, su dueño o empresa matriz y su sitio web.
    que_usa: >-
      Completar las empresas que tienen LEI con lo que ninguna fuente oficial dice. Se consulta en vivo o se guarda
      con su fecha.
    cuidado:
      - >-
        Es colaborativa: puede estar incompleta o desactualizada. Rastro guarda qué dijo y cuándo.
      - Solo se usan las empresas con el mismo LEI; el mismo nombre no alcanza.

# Cómo se muestran las columnas de las respuestas
columnas:
  company: Empresa
  share: Petróleo que le corresponde (millones de m³)
  gasShare: Gas que le corresponde (millones de m³)
  operated: Petróleo que declara como operadora (millones de m³)
  rule: Regla
  type: Tipo de pozo
  wells: Pozos
  disagree: El padrón dice otra empresa
  concession: Concesión
  operator: Operadora
  detected: Posibles venteos (satélite)
  declared: Puntos de venteo declarados
  unconventionalOil: Petróleo no convencional (millones de m³)
  shaleGas: Gas de shale (millones de m³)
  shaleOil: Petróleo de shale (millones de m³)
  distanceKm: Gasoducto más cercano (km)
  pipeline: Gasoducto
  place: Dónde
  lei: LEI
  why: Por qué revisarla
  since: Desde
  previous: Operadora anterior
  new: Operadora nueva
  oilBefore: Petróleo por mes antes (millones de m³)
  oilAfter: Petróleo por mes después (millones de m³)
  gasBefore: Gas por mes antes (millones de m³)
  gasAfter: Gas por mes después (millones de m³)
unidades:                      # the units the screen scales: values in m³ or in thousands of m³, shown in millions of m³
  m3: {escala: 1000000}
  miles_m3: {escala: 1000}
formatos:                      # each volume column's unit (unidades); dinero, numero and porcentaje are built in
  share: m3
  gasShare: miles_m3
  shaleGas: miles_m3
  shaleOil: m3
  operated: m3
  unconventionalOil: m3
  oilBefore: m3
  oilAfter: m3
  gasBefore: miles_m3
  gasAfter: miles_m3

# Las preguntas de ejemplo: la consulta de ontology/energia/queries/, la pregunta en palabras
# simples (modo negocio) y la evidencia de «¿De dónde sale la respuesta?»
preguntas:
  - id: e01
    query: /ontology/energia/queries/cq1.rq
    columnas_respuesta: [company, share, gasShare]
    porque:     # «¿Por qué este número?»: la evidencia detrás de una fila de la respuesta
      columna: company
      titulo: "La parte de {valor}, concesión por concesión"
      explica: "Su parte es la suma, en cada concesión, de la producción por su porcentaje. Cada porcentaje sale del texto de socios del mapa, con su fuente."
      query: |
        SELECT ?concesion ?porcentaje ?produccion ?parte ?gas ?texto ?fuente ?empresa ?concesionIri ?participacion ?origen ?actividad ?regla WHERE {
          { SELECT ?c (SUM(?oil) AS ?prod) (SUM(?g) AS ?prodgas) WHERE {
              ?p a energia:WellProduction ; energia:inConcession ?c ; energia:oil ?oil ; energia:gas ?g .
              FILTER EXISTS { ?s0 a energia:Stake ; energia:inConcession ?c ; energia:partner/energia:name "{valor}" }
            } GROUP BY ?c }
          ?s a energia:Stake ; energia:inConcession ?c ; energia:partner ?empresa ; energia:percent ?porcentaje ;
             energia:sourceText ?texto ; energia:rule ?regla ; prov:wasDerivedFrom ?origen ; prov:wasGeneratedBy ?actividad .
          ?empresa energia:name "{valor}" .
          ?origen energia:name ?fuente .
          ?c energia:name ?concesion .
          BIND (?c AS ?concesionIri)
          BIND (?s AS ?participacion)
          BIND (?prod AS ?produccion)
          BIND (ROUND(?prod * ?porcentaje / 100) AS ?parte)
          BIND (ROUND(?prodgas * ?porcentaje / 100) AS ?gas)
        } ORDER BY DESC(?parte)
      numeros: {parte: m3, gas: miles_m3}
      nodo: "{concesion}"
      detalle: "{porcentaje} % · {parte} millones de m³ de petróleo"
      flecha: socia en
      columnas: {concesion: Concesión, porcentaje: "Porcentaje", parte: "Su parte de petróleo (millones de m³)", gas: "Su parte de gas (millones de m³)", texto: "Evidencia: el texto del mapa", fuente: Fuente}
      recorrido:
        title: ¿Por qué este número?
        company: Empresa que quiere comprobar
        concession: Ver una concesión
        example: YPF S.A.
        example_concession: LOMA CAMPANA
        definition: 'La operadora declara la producción de los pozos. Esta respuesta calcula cuánto le corresponde a cada socio según su participación registrada.'
        total: '**{company}: se suman sus partes en {count} concesiones.**'
        comparison_title: Comparar producción operada y participación
        operated_label: Petróleo declarado como operadora
        share_label: Petróleo según su participación
        comparison_note: >-
          Son medidas distintas de 2025: la operadora declara la producción de sus pozos, incluida la parte de sus socios.
          La participación se calcula con los porcentajes registrados en cada concesión.
          Esta comparación no mide la exactitud de SQL frente a Rastro.
        unavailable: Sin dato
        breakdown_title: Ver todas las concesiones de esta empresa
        breakdown_note: El total de la respuesta suma estas partes. Los volúmenes de cada fila se muestran redondeados.
        calculation_title: Cómo se obtuvo
        calculation: 'En {concesion}, a {company} le corresponden {production} millones de m³ de petróleo × {percent} % = {share} millones de m³.'
        rounding: Los volúmenes se muestran en millones de m³, redondeados; el cálculo usa la precisión original.
        connections_title: Qué conectó Rastro
        sources:
          - title: Declaraciones de producción
            text: 'Producción de los pozos de {concesion}: {production} millones de m³.'
          - title: Mapa de concesiones
            text: 'Participación registrada de {map_name} en el texto del mapa: {percent} %.'
        connection: '{concesion} → Participación → {company}'
        connection_detail: La producción y los socios se conectan por la misma concesión.
        pending_link: >-
          En el mapa, el socio figura como «{map_name}». Rastro lo une a {company} por una corrección revisada por un
          asistente de IA, que todavía espera la confirmación de una persona: esta parte del número depende de esa unión.
        contribution: >-
          Los mapeos traducen las fuentes a Pozo, Concesión, Empresa y Participación.
          Los enlaces reúnen los nombres de una empresa bajo un mismo identificador, con su regla y evidencia.
          Esas definiciones se reutilizan en las preguntas; también pueden consultarse con SQL sobre los mismos enlaces.
        records_title: Ver los registros originales
        original_text: '**Texto original del mapa:** {text}'
        records_note: >-
          La fila muestra la parte calculada y el texto original de socios que la respalda.
          Es una consulta actual a las fuentes cargadas, no una copia histórica del portal.
        production_query: |
          SELECT ?registro ?pozo ?mes ?petroleo ?fuente WHERE {
            ?concesion energia:name "{concesion}" .
            ?registro a energia:WellProduction ; energia:inConcession ?concesion ;
              energia:well/energia:wellId ?pozo ; energia:oil ?petroleo ;
              energia:fromSource/energia:name ?fuente .
            BIND (STRAFTER(STR(?registro), "/production/") AS ?clave)
            BIND (STRBEFORE(STRAFTER(?clave, "/"), "/") AS ?mes)
          } ORDER BY DESC(?petroleo) ?registro LIMIT 12
        production_columns: {pozo: Pozo, mes: Mes de 2025, petroleo: Petróleo declarado (m³)}
        production_note: Hasta 12 declaraciones con mayor petróleo de la concesión, del Capítulo IV de 2025. La suma usa todas sus declaraciones.
        linking_title: Ver cómo se conectaron los nombres
        linking_note: >-
          Cada nombre de origen apunta a la misma empresa. La regla y su evidencia explican la unión;
          «Estado» dice quién la sostiene: una regla automática, una corrección revisada por IA que una persona
          todavía tiene que confirmar, o una confirmada por una persona con un documento.
        identity: '**Un identificador compartido para esta empresa:**'
        linking_query: |
          SELECT ?nombre ?fuente ?regla ?evidencia ?empresa WHERE {
            ?empresa energia:name "{valor}" .
            ?enlace a energia:CompanyName ; energia:company ?empresa ; energia:nameInSource ?nombre ;
              energia:rule ?regla ; energia:sourceText ?evidencia ; prov:wasDerivedFrom/energia:name ?fuente .
          } ORDER BY ?fuente ?nombre
        linking_columns: {nombre: Nombre en la fuente, fuente: Fuente, regla: Regla, evidencia: Evidencia y revisión}
        technical_title: Identificadores y consulta de este recorrido
        missing: No hay evidencia disponible para esta selección.
    explicacion: |
      - **Qué busca:** la producción de petróleo de 2025 de cada pozo, la concesión donde está y los socios de esa concesión con su porcentaje.
      - **Qué calcula:** por cada empresa, la producción multiplicada por su porcentaje, sumada en todas sus concesiones; al lado, lo que opera (la producción que declara).
      - **Lo que en SQL habría que hacer a mano:** separar el texto de socios del mapa («YPF S.A.: 50 %») y unir los nombres de empresa entre fuentes. Acá ya son conceptos: «Participación» y «Empresa».
      - **El SQL de abajo:** Rastro traduce cada concepto a las tablas de enlaces de Rastro y une todo en una sola consulta.
    simple: ¿Cuánto petróleo de 2025 le corresponde a cada empresa, según su participación?
    tecnica: ¿Cuánto petróleo de 2025 le corresponde a cada empresa, multiplicando la producción de cada concesión por su porcentaje?
    ventaja: "Los socios están en un texto del mapa de concesiones; Rastro los separa una vez, con su porcentaje, y une los nombres de cada empresa entre fuentes. Chevron participa con dos razones sociales; una corrección revisada las agrupa."
    terminos:
      Participación: el porcentaje de una concesión que pertenece a cada socio. La operadora maneja los pozos, pero el petróleo se reparte entre los socios.
      m³: metros cúbicos de petróleo. Un metro cúbico son unos 6,3 barriles.
    antes_despues:              # read live (dominio.before_after): «sin» is layer/energia/sin-rastro.sql, query 1
      valores:
        - sql: >-
            SELECT sum(prod_pet) / 1e6 AS ypf_sin FROM capitulo4.produccion WHERE empresa ILIKE 'YPF%'
        - sparql: |
            SELECT (SUM(IF(?empresa = "YPF S.A.", ?parte, 0)) / 1000000 AS ?ypf_con)
                   (SUM(IF(?empresa = "VISTA ENERGY ARGENTINA SAU", ?parte, 0)) / 1000000 AS ?vista)
                   (SUM(IF(?empresa = "VISTA ENERGY ARGENTINA SAU" && ?concesion = "LA AMARGA CHICA", ?parte, 0)) / 1000000 AS ?vista_lac)
                   (SUM(IF(?empresa = "CHEVRON", ?parte, 0)) / 1000000 AS ?chevron)
            WHERE {
              ?p a energia:WellProduction ; energia:inConcession ?c ; energia:oil ?petroleo .
              ?s a energia:Stake ; energia:inConcession ?c ; energia:partner/energia:name ?empresa ; energia:percent ?porcentaje .
              ?c energia:name ?concesion .
              FILTER (?empresa IN ("YPF S.A.", "VISTA ENERGY ARGENTINA SAU", "CHEVRON"))
              BIND (?petroleo * ?porcentaje / 100 AS ?parte)
            }
      calculos: {exceso: ypf_sin - ypf_con, barriles: exceso * 6.2898, precio: "65", dolares: "round(barriles * precio, -2)"}
      decimales: {barriles: 0}
      fuentes: [capitulo4, sig_energia]
      sin: {valor: "YPF: {ypf_sin} M m³", detalle: "Sumando la producción por la empresa que la declara, a YPF se le asigna todo lo que opera, y la mitad de La Amarga Chica, que figura a nombre de Petronas E&P Argentina (de Vista desde 2025), no aparece."}
      con: {valor: "YPF: {ypf_con} M m³", detalle: "Su parte en cada concesión, según los socios del mapa. Vista: {vista} M m³, con la mitad de La Amarga Chica ({vista_lac}), que compró con Petronas E&P Argentina en 2025; Chevron: {chevron} M m³, con sus dos razones sociales. Esas dos uniones son 🟠 revisadas por IA, falta una persona; el {ypf_con} de YPF no depende de ellas."}
      impacto: >-
        Sin integrar, a YPF se le asignan {exceso} millones de m³ de más ({barriles} millones de barriles): unos
        US$ {dolares} millones, con un precio supuesto de US$ {precio} por barril. Es producción de sus socios.
    evidencia:
      texto: "Los socios de cada concesión, tal como los informa el mapa (algunos ejemplos):"
      formato: "**{concesion}**: {texto}"
      query: |
        SELECT ?concesion ?texto ?fuente WHERE {
          ?s a energia:Stake ; energia:inConcession/energia:name ?concesion ; energia:sourceText ?texto ;
             prov:wasDerivedFrom/energia:name ?fuente .
          FILTER (?concesion IN ("LOMA CAMPANA", "LA AMARGA CHICA"))
        } ORDER BY ?concesion ?texto

  - id: e02
    query: /ontology/energia/queries/cq2.rq
    porque:
      columna: type
      titulo: "Pozos «{valor}» de YPF: quién los opera y por qué"
      explica: "Para cada pozo, Rastro guarda qué dice cada fuente y qué regla decidió quién lo opera. Algunos ejemplos:"
      query: |
        SELECT ?pozo ?regla ?texto WHERE {
          ?l a energia:OperatorLink ; energia:aboutWell ?w ; energia:company/energia:name "YPF S.A." ;
             energia:rule ?regla ; energia:sourceText ?texto .
          ?w energia:wellId ?pozo ; energia:wellType "{valor}" .
        } ORDER BY DESC(?regla) ?pozo LIMIT 12
      nodo: "Pozo {pozo}"
      detalle: "{regla}"
      flecha: lo opera
      columnas: {pozo: Pozo, regla: Regla, texto: "Evidencia: qué dice cada fuente"}
    explicacion: |
      - **Qué busca:** los enlaces «operadora de un pozo» que nombran a YPF, agrupados por tipo de pozo (petrolífero, gasífero, de inyección…).
      - **Qué devuelve:** cuántos pozos de cada tipo opera YPF y en cuántos rige la declaración jurada porque el padrón dice otra empresa. Son todos los pozos que YPF declara en 2025, produzcan o no.
      - **Lo que en SQL habría que hacer a mano:** decidir en cada consulta qué fuente manda (padrón o declaraciones). Acá la regla está escrita una vez, y cada pozo guarda su evidencia.
    simple: ¿Cuántos pozos opera hoy YPF, y de qué tipo?
    tecnica: ¿Cuántos pozos con declaración jurada en 2025 opera hoy YPF, por tipo de pozo (energia:wellType), y en cuántos no coinciden las fuentes?
    ventaja: "El padrón de pozos y las declaraciones juradas no siempre nombran a la misma operadora. Rastro aplica una regla escrita una vez (rige quien declara la producción del último mes) y deja a la vista lo que dice el padrón en cada pozo."
    terminos:
      Declaración jurada: lo que cada empresa informa todos los meses a la Secretaría de Energía sobre la producción de cada pozo.
      Padrón de pozos: el registro de todos los pozos, con su ubicación y su empresa.
    antes_despues:              # read live: «sin» is layer/energia/sin-rastro.sql, query 2
      valores:
        - sql: >-
            SELECT count(*) FILTER (WHERE p.empresa ILIKE 'YPF%') AS padron,
                   count(*) FILTER (WHERE u.empresa ILIKE 'YPF%') AS declaraciones,
                   count(*) FILTER (WHERE u.empresa ILIKE 'YPF%' AND p.empresa NOT ILIKE 'YPF%') AS otra
            FROM (SELECT DISTINCT ON (idpozo) idpozo, empresa FROM capitulo4.produccion ORDER BY idpozo, mes DESC) u
            LEFT JOIN capitulo4.pozo p USING (idpozo)
        - sparql: |
            SELECT (COUNT(?w) AS ?pozos) (SUM(IF(?t = "Petrolífero", 1, 0)) AS ?petroliferos)
                   (SUM(IF(?t = "Gasífero", 1, 0)) AS ?gasiferos) (SUM(IF(?t = "Inyección de Agua", 1, 0)) AS ?inyeccion)
                   (SUM(IF(?t = "Otro tipo", 1, 0)) AS ?otro) (SUM(IF(BOUND(?produjo), 1, 0)) AS ?produjeron)
            WHERE {
              ?l a energia:OperatorLink ; energia:aboutWell ?w ; energia:company/energia:name "YPF S.A." .
              OPTIONAL { ?w energia:wellType ?t }
              OPTIONAL { SELECT ?w (1 AS ?produjo) WHERE {
                ?p a energia:WellProduction ; energia:well ?w ; energia:oil ?o ; energia:gas ?g . FILTER (?o > 0 || ?g > 0)
              } GROUP BY ?w }
            }
        - sparql: |                # all wells where the registry and the declarations disagree (the slide's notes)
            SELECT (COUNT(?l) AS ?distintos_pais) WHERE { ?l a energia:OperatorLink ; energia:rule "rige la declaración jurada" }
      fuentes: [capitulo4]
      sin: {valor: "{padron} o {declaraciones}", detalle: "Dos respuestas: el padrón de pozos dice {padron} y las declaraciones juradas, {declaraciones}. En {otra} pozos el padrón nombra a otra empresa (Pecom, Velitec, Copesa)."}
      con: {valor: "{pozos} pozos", detalle: "Una regla escrita: rige quien declara la producción del último mes. Lo que dice el padrón queda a la vista en cada pozo. Son pozos de todo tipo: {petroliferos} petrolíferos, {gasiferos} gasíferos, {inyeccion} de inyección y {otro} de otro tipo; {produjeron} produjeron petróleo o gas en 2025."}
    evidencia:
      texto: "Pozos donde las fuentes no coinciden (algunos ejemplos):"
      formato: "**Pozo {pozo}**: {evidencia}"
      query: |
        SELECT ?pozo ?evidencia ?fuente WHERE {
          ?l a energia:OperatorLink ; energia:aboutWell/energia:wellId ?pozo ; energia:company/energia:name "YPF S.A." ;
             energia:rule "rige la declaración jurada" ; energia:sourceText ?evidencia ; prov:wasDerivedFrom/energia:name ?fuente .
        } ORDER BY ?pozo LIMIT 5

  - id: e03
    query: /ontology/energia/queries/cq3.rq
    porque:
      columna: concession
      titulo: "Los posibles venteos de {valor}, y por qué caen ahí"
      explica: "Cada punto del satélite tiene coordenadas; Rastro lo ubicó dentro del contorno de la concesión y guardó la evidencia."
      query: |
        SELECT ?fecha ?satelite ?texto ?fuente WHERE {
          ?l a energia:LocationLink ; energia:aboutVenting ?d ; energia:inConcession/energia:name "{valor}" ;
             energia:sourceText ?texto ; prov:wasDerivedFrom/energia:name ?fuente .
          ?d energia:date ?fecha . OPTIONAL { ?d energia:satellite ?satelite }
        } ORDER BY DESC(?fecha) LIMIT 12
      nodo: "{fecha}"
      detalle: "{satelite}"
      flecha: posible venteo
      columnas: {fecha: Fecha, satelite: Satélite, texto: "Evidencia: dónde cae el punto", fuente: Fuente}
    mapa: true
    explicacion: |
      - **Qué busca:** los posibles venteos vistos por satélite y la concesión en la que cae cada uno, con su operadora en el mapa y sus puntos de venteo declarados.
      - **Qué devuelve:** las 10 concesiones con más detecciones.
      - **Lo que en SQL habría que hacer a mano:** ubicar cada punto dentro del contorno de cada concesión (punto dentro de polígono). Rastro lo calculó una vez; la consulta solo dice «en la concesión».
    simple: ¿En qué concesiones vio el satélite más posibles venteos de gas desde 2024, y quién las opera?
    tecnica: ¿En qué concesiones hay más anomalías térmicas detectadas por satélite desde 2024, con su operadora y sus puntos de venteo declarados?
    ventaja: "La capa del satélite solo dice fecha y provincia. Rastro ubica cada punto dentro del contorno de su concesión, una vez, y así llega a la operadora y a los venteos declarados."
    terminos:
      Venteo: liberar o quemar gas en el yacimiento en lugar de aprovecharlo.
      Posible venteo: una anomalía térmica que vio un satélite. Es un indicio para revisar, no una confirmación.
    antes_despues:              # read live: «sin» is layer/energia/sin-rastro.sql, query 3
      valores:
        - sql: >-
            SELECT count(*) AS neuquen FROM sig_energia.venteo_detectado WHERE fecha >= '2024-01-01' AND provincia = 'NEUQUEN'
        - sparql: |
            SELECT (COUNT(DISTINCT ?d) AS ?ubicados) (SUM(IF(?concesion = "LA CALERA", 1, 0)) AS ?la_calera) WHERE {
              ?d a energia:DetectedVenting ; energia:inConcession/energia:name ?concesion .
            }
      fuentes: [sig_energia]
      sin: {valor: "Neuquén: {neuquen}", detalle: "La capa del satélite solo dice fecha y provincia: no se sabe en qué concesión ni de qué empresa. Además escribe Tierra del Fuego de dos formas."}
      con: {valor: "La Calera: {la_calera}", detalle: "{ubicados} posibles venteos ubicados en su concesión, con su operadora. La Calera (Pluspetrol): {la_calera}, sin ningún punto de venteo declarado en el mapa."}
    evidencia:
      texto: "Por qué cada detección está en La Calera (algunos ejemplos):"
      formato: "**{fecha}**: {evidencia}"
      query: |
        SELECT ?fecha ?evidencia ?fuente WHERE {
          ?d a energia:DetectedVenting ; energia:date ?fecha .
          ?l a energia:LocationLink ; energia:aboutVenting ?d ; energia:inConcession/energia:name "LA CALERA" ; energia:sourceText ?evidencia ;
             prov:wasDerivedFrom/energia:name ?fuente .
        } ORDER BY DESC(?fecha) LIMIT 4

  - id: e04
    query: /ontology/energia/queries/cq4.rq
    porque:
      columna: company
      titulo: "El petróleo no convencional de {valor}, por formación"
      explica: "Ninguna tabla dice «no convencional»: Rastro lo deduce del tipo de recurso (shale o tight) de cada declaración jurada."
      query: |
        SELECT ?formacion (ROUND(SUM(?o)) AS ?petroleo) WHERE {
          ?p a energia:UnconventionalProduction ; energia:declaredBy/energia:name "{valor}" ; energia:formation ?formacion ; energia:oil ?o .
        } GROUP BY ?formacion ORDER BY DESC(?petroleo)
      numeros: {petroleo: m3}
      nodo: "{formacion}"
      detalle: "{petroleo} millones de m³"
      flecha: declara en
      columnas: {formacion: Formación, petroleo: "Petróleo no convencional 2025 (millones de m³)"}
    explicacion: |
      - **Qué busca:** la producción de cada pozo que es «no convencional» y la empresa que la declara.
      - **Qué devuelve:** las 10 empresas con más petróleo no convencional.
      - **Lo particular:** «no convencional» no es una columna. El diccionario dice que shale y tight son tipos de no convencional, y Rastro lo deduce. Si mañana se suma otro tipo, se cambia una línea del diccionario, no cada consulta.
    simple: ¿Quiénes producen más petróleo no convencional (shale y tight)?
    tecnica: ¿Qué empresas declaran más petróleo no convencional en 2025 (la clase deducida, sin mapeo propio)?
    ventaja: "«No convencional» se define una vez, en el diccionario de negocio: shale o tight. Ningún mapeo la asigna; vale para todas las preguntas."
    terminos:
      No convencional: petróleo de rocas poco permeables (shale, como Vaca Muerta, o tight), que se extrae con fractura hidráulica.
    definicion: |
      energia:UnconventionalProduction rdfs:label "Producción no convencional"@es .
      energia:ShaleProduction rdfs:subClassOf energia:UnconventionalProduction .
      energia:TightProduction rdfs:subClassOf energia:UnconventionalProduction .

  - id: e05
    query: /ontology/energia/queries/cq5.rq
    porque:
      columna: concession
      titulo: "El gasoducto más cercano a {valor}"
      explica: "Rastro midió una vez la distancia del contorno de cada concesión a cada tramo de gasoducto de ENARGAS y guardó el más cercano, con su evidencia."
      query: |
        SELECT ?gasoducto ?distancia ?texto (GROUP_CONCAT(DISTINCT ?f; separator=", ") AS ?fuente) WHERE {
          ?c energia:name "{valor}" .
          ?g a energia:PipelineLink ; energia:aboutConcession ?c ; energia:pipeline ?gasoducto ; energia:distanceKm ?distancia ;
             energia:sourceText ?texto ; prov:wasDerivedFrom/energia:name ?f .
        } GROUP BY ?gasoducto ?distancia ?texto
      nodo: "{gasoducto}"
      detalle: "a {distancia} km"
      flecha: gasoducto más cercano
      columnas: {gasoducto: Gasoducto, distancia: "Distancia (km)", texto: Evidencia, fuente: Fuentes}
    explicacion: |
      - **Qué busca:** las concesiones con posibles venteos y, para cada una, el gasoducto de transporte de ENARGAS más cercano y a cuántos km está.
      - **Qué filtra:** solo las que tienen ese gasoducto a 10 km o más.
      - **Lo que en SQL habría que hacer a mano:** medir distancias entre contornos y caños de dos organismos distintos. Rastro las calculó una vez y las guarda con su evidencia.
    simple: ¿Qué concesiones con posibles venteos no tienen un gasoducto de transporte cerca?
    tecnica: ¿Qué concesiones con posibles venteos detectados por satélite tienen el gasoducto de transporte de ENARGAS más cercano a 10 km o más?
    ventaja: "Los gasoductos son de otro organismo (ENARGAS). Rastro calcula una vez la distancia de cada concesión al gasoducto más cercano y la une con los venteos: una pista de dónde el gas no tiene salida."
    terminos:
      Gasoducto de transporte: los caños troncales que llevan el gas a los centros de consumo. No incluye los ductos internos de cada yacimiento.
    evidencia:
      texto: "Por qué Rastro dice la distancia (algunos ejemplos):"
      formato: "{evidencia}"
      query: |
        SELECT ?evidencia (GROUP_CONCAT(DISTINCT ?f; separator=" + ") AS ?fuentes) WHERE {
          ?g a energia:PipelineLink ; energia:aboutConcession/energia:name ?c ; energia:sourceText ?evidencia ; prov:wasDerivedFrom/energia:name ?f .
          FILTER (?c IN ("CHIHUIDO DE LA SIERRA NEGRA", "EL TRAPIAL - CURAMCHED", "LOMA CAMPANA"))
        } GROUP BY ?evidencia

  - id: e06
    query: /ontology/energia/queries/cq6.rq
    porque:
      columna: concession
      titulo: "Los posibles venteos de {valor} en un área protegida o cerca de una localidad"
      explica: "Para cada punto del satélite, Rastro guardó la localidad más cercana, la distancia y si cae en un área protegida del IGN."
      query: |
        SELECT ?fecha ?lugar ?texto WHERE {
          ?s a energia:SurroundingsLink ; energia:aboutVenting ?d ; energia:nearestTown ?town ; energia:distanceKm ?km ; energia:sourceText ?texto .
          ?d energia:inConcession/energia:name "{valor}" ; energia:date ?fecha .
          OPTIONAL { ?s energia:protectedArea ?area }
          FILTER (BOUND(?area) || ?km < 3)
          BIND (IF(BOUND(?area), CONCAT("área protegida: ", ?area), CONCAT("cerca de ", ?town)) AS ?lugar)
        } ORDER BY DESC(?fecha) LIMIT 12
      nodo: "{fecha}"
      detalle: "{lugar}"
      flecha: posible venteo
      columnas: {fecha: Fecha, lugar: Dónde, texto: Evidencia}
    explicacion: |
      - **Qué busca:** los posibles venteos con su entorno según el IGN: la localidad más cercana y el área protegida, si cae en una.
      - **Qué filtra:** los que están en un área protegida o a menos de 3 km de una localidad, y los cuenta por concesión y operadora.
      - **Lo particular:** el entorno viene de otra fuente (IGN) y se unió una vez por ubicación; la consulta lo usa como cualquier otro dato.
    simple: ¿Qué posibles venteos están dentro de un área protegida o cerca de una localidad?
    tecnica: ¿Qué posibles venteos detectados por satélite caen dentro de un área protegida o a menos de 3 km de una localidad, según el IGN?
    ventaja: "Las localidades y las áreas protegidas son del Instituto Geográfico Nacional. Rastro ubica cada posible venteo respecto de ellas una vez, con la evidencia, y llega a la concesión y a su operadora."
    terminos:
      Área protegida: una reserva o parque con protección legal (nacional o provincial).
    evidencia:
      texto: "El entorno de algunos posibles venteos:"
      formato: "{evidencia}"
      query: |
        SELECT DISTINCT ?evidencia (GROUP_CONCAT(DISTINCT ?f; separator=" + ") AS ?fuentes) WHERE {
          ?s a energia:SurroundingsLink ; energia:protectedArea ?a ; energia:sourceText ?evidencia ; prov:wasDerivedFrom/energia:name ?f .
        } GROUP BY ?evidencia ORDER BY ?evidencia LIMIT 4

  - id: e07
    query: /ontology/energia/queries/cq7.rq
    porque:
      columna: company
      titulo: "El LEI de {valor}"
      explica: "Rastro buscó la empresa en GLEIF y guardó el LEI solo si el nombre legal es el de la empresa, con la evidencia."
      query: |
        SELECT ?lei ?texto (GROUP_CONCAT(DISTINCT ?f; separator=", ") AS ?fuente) WHERE {
          ?e energia:name "{valor}" ; energia:lei ?lei .
          ?l a energia:LeiLink ; energia:company ?e ; energia:sourceText ?texto ; prov:wasDerivedFrom/energia:name ?f .
        } GROUP BY ?lei ?texto
      nodo: "LEI {lei}"
      detalle: ""
      flecha: identificador global
      columnas: {lei: LEI, texto: Evidencia, fuente: Fuentes}
    explicacion: |
      - **Qué busca:** las empresas que tienen LEI (el identificador global de GLEIF) y la producción que declaran.
      - **Qué devuelve:** cada empresa con su LEI y lo que opera, de mayor a menor.
      - **Lo particular:** el LEI se aceptó solo si coincide el nombre legal; los candidatos descartados quedan en la evidencia.
    simple: ¿Qué empresas tienen identificador global (LEI)?
    tecnica: ¿Qué empresas que producen en Argentina tienen LEI en GLEIF, y cuánto petróleo operan?
    ventaja: "El LEI une cada empresa con el registro global de GLEIF, el mismo que usan bancos y reguladores. Rastro lo acepta solo si coincide el nombre legal, y deja a la vista lo que descartó."
    terminos:
      LEI: el identificador global de empresas (GLEIF), el mismo en todo el mundo.
    evidencia:
      texto: "Cómo se eligió cada LEI (algunos ejemplos):"
      formato: "{evidencia}"
      query: |
        SELECT ?evidencia ?fuente WHERE {
          ?l a energia:LeiLink ; energia:company/energia:name ?e ; energia:sourceText ?evidencia ; prov:wasDerivedFrom/energia:name ?fuente .
          FILTER (?e IN ("YPF S.A.", "SHELL ARGENTINA S.A.", "PAN AMERICAN ENERGY SL"))
        }

  - id: e08
    query: /ontology/energia/queries/cq8.rq
    porque:
      columna: concession
      titulo: "Por qué hay que revisar {valor}"
      explica: "«Para revisar» no está en ninguna tabla: Rastro lo deduce de dos reglas del diccionario. Abajo, cada motivo y la evidencia en que se apoya."
      query: |
        SELECT ?que ?texto ?fuente WHERE {
          { ?c energia:name "{valor}" ; energia:reviewReason ?texto . BIND ("motivo para revisar" AS ?que) BIND ("regla del diccionario" AS ?fuente) }
          UNION
          { ?c energia:name "{valor}" . ?g a energia:PipelineLink ; energia:aboutConcession ?c ; energia:sourceText ?texto .
            BIND ("gasoducto más cercano" AS ?que) BIND ("ENARGAS y mapas" AS ?fuente) }
        }
      nodo: "{que}"
      detalle: "{fuente}"
      flecha: se revisa por
      columnas: {que: Qué, texto: Evidencia, fuente: De dónde}
    explicacion: |
      - **Qué busca:** las «concesiones para revisar», con su operadora y el motivo.
      - **Lo particular:** «concesión para revisar» no es una columna ni tiene mapeo. El diccionario dice que lo son las que tienen posibles venteos y además no tienen un gasoducto cerca, o no presentaron planillas de venteo de gas. Rastro la deduce de esas dos reglas.
      - **Lo que en SQL habría que hacer a mano:** repetir las dos reglas, con las distancias y los estudios, en cada consulta que las use. Acá se escriben una vez y valen para todas.
    mapa: true
    simple: ¿Qué concesiones hay que revisar por venteos, y por qué?
    tecnica: ¿Qué concesiones son «para revisar» (clase deducida, sin mapeo propio), con su operadora y su motivo?
    ventaja: "La regla se escribe una vez en el diccionario de negocio: posibles venteos y, además, ningún gasoducto de transporte cerca o ninguna planilla de venteo presentada. Rastro la deduce; vale para esta pregunta, para el mapa y para cualquier otra que la use."
    terminos:
      Concesión para revisar: una concesión que conviene mirar por sus posibles venteos. Es un indicio, no una conclusión.
    definicion: |
      energia:ConcessionToReview rdfs:label "Concesión para revisar"@es .
      energia:VentingFarFromPipeline rdfs:subClassOf energia:ConcessionToReview .   # venteos y gasoducto a 10 km o más
      energia:VentingWithoutReports  rdfs:subClassOf energia:ConcessionToReview .   # 20+ venteos y sin planillas desde 2022

  - id: e09
    query: /ontology/energia/queries/cq9.rq
    porque:
      columna: concession
      titulo: "El cambio de operadora en {valor}"
      explica: "Rastro decide mes a mes quién declara la mayor parte de la producción de cada concesión y marca un cambio cuando otra empresa lo hace 3 meses seguidos. Guarda la evidencia."
      query: |
        SELECT ?desde ?anterior ?nueva ?texto WHERE {
          ?x a energia:OperatorChange ; energia:inConcession ?c ; energia:month ?mes ; energia:sourceText ?texto ;
             energia:previousCompany/energia:name ?anterior ; energia:newCompany/energia:name ?nueva .
          OPTIONAL { ?c energia:name ?n }
          FILTER (COALESCE(?n, STRAFTER(STR(?c), "/concession/")) = "{valor}")
          BIND (CONCAT(SUBSTR(STR(?mes), 6, 2), "/", SUBSTR(STR(?mes), 1, 4)) AS ?desde)
        } ORDER BY ?mes
      nodo: "{nueva}"
      detalle: "desde {desde}, antes {anterior}"
      flecha: pasa a operarla
      columnas: {desde: Desde, anterior: "Operadora anterior", nueva: "Operadora nueva", texto: Evidencia}
    explicacion: |
      - **Qué busca:** los «cambios de operadora»: cada concesión donde otra empresa pasó a declarar la mayor parte de la producción, con el mes, la operadora anterior y la nueva.
      - **Qué devuelve:** lo que producía la concesión por mes, en promedio, con la operadora anterior y con la nueva; de mayor a menor petróleo.
      - **Lo que en SQL habría que hacer a mano:** unir tres años de declaraciones juradas (tres archivos), unir los nombres de empresa entre años, decidir mes a mes quién declara la mayor parte y descartar los meses sueltos. Rastro lo hace una vez y cada cambio guarda su evidencia.
    simple: ¿Qué áreas cambiaron de operadora entre 2023 y 2025, y cuánto producían antes y después?
    tecnica: ¿En qué concesiones pasó otra empresa a declarar la mayor parte de la producción entre 2023 y 2025 (al menos 3 meses seguidos), y cuánto petróleo y gas producían por mes con cada operadora?
    ventaja: "Las declaraciones juradas son un archivo por año. Rastro las une, decide mes a mes quién declara la mayor parte de cada concesión y marca cada cambio con su evidencia: así se ven las áreas maduras que YPF vendió (Pecom, Petróleos Sudamericanos, Bentia, Quintana) y cuánto producían."
    terminos:
      Cambio de operadora: desde ese mes, otra empresa declara la mayor parte de la producción de la concesión, al menos 3 meses seguidos.
      Áreas maduras: yacimientos convencionales con muchos años de producción, que suelen pasar a empresas más chicas.
    evidencia:
      texto: "Por qué Rastro dice que cambió la operadora (algunos ejemplos):"
      formato: "{evidencia}"
      query: |
        SELECT ?evidencia ?fuente WHERE {
          ?x a energia:OperatorChange ; energia:inConcession/energia:name ?c ; energia:sourceText ?evidencia ; prov:wasDerivedFrom/energia:name ?fuente .
          FILTER (?c IN ("ESCALANTE - EL TREBOL", "BARRANCAS", "BAJO DEL CHOIQUE - LA INVERNADA"))
        } ORDER BY ?c

  - id: e10
    query: /ontology/energia/queries/cq10.rq
    porque:
      columna: company
      titulo: "El gas de shale de {valor}, por concesión"
      explica: "«Shale» sale del tipo de recurso de cada declaración jurada; la concesión, del enlace de cada pozo con el mapa."
      query: |
        SELECT ?concesion (ROUND(SUM(?g)) AS ?gas) WHERE {
          ?p a energia:ShaleProduction ; energia:declaredBy/energia:name "{valor}" ; energia:inConcession/energia:name ?concesion ; energia:gas ?g .
        } GROUP BY ?concesion ORDER BY DESC(?gas)
      numeros: {gas: miles_m3}
      nodo: "{concesion}"
      detalle: "{gas} millones de m³"
      flecha: declara en
      columnas: {concesion: Concesión, gas: "Gas de shale 2025 (millones de m³)"}
    explicacion: |
      - **Qué busca:** la producción de cada pozo que es de shale y la empresa que la declara.
      - **Qué devuelve:** las 10 empresas con más gas de shale en 2025, con su petróleo de shale al lado.
      - **Lo particular:** es la misma clase deducida que el no convencional (shale es un tipo), mirada por el gas. El gas y el petróleo vienen de las mismas declaraciones juradas, pozo por pozo.
    simple: ¿Quiénes producen más gas de shale (Vaca Muerta)?
    tecnica: ¿Qué empresas declaran más gas de shale en 2025 (energia:ShaleProduction, con su gas en miles de m³)?
    ventaja: "El gas y el petróleo están en el mismo diccionario y salen de las mismas declaraciones juradas: preguntar por gas es cambiar una palabra de la consulta."
    terminos:
      Gas de shale: gas de rocas poco permeables (como Vaca Muerta), que se extrae con fractura hidráulica. Las fuentes lo declaran en miles de m³; Rastro lo muestra en millones de m³.

# Enriquecer con datos de afuera: una consulta une Rastro con Wikidata en vivo, en GraphDB, por el LEI; y lo mismo
# guardado en Rastro (materializado: wikidata-energia-loader), que se consulta con la pregunta 15
afirmaciones:                  # «Comprobar una afirmación»: Rastro calcula el veredicto en vivo, con cada lectura
  titulo: Comprobar una afirmación
  intro: >-
    Una frase de un informe o de la prensa, comprobada contra los datos. Rastro dice si **se sostiene**, si **no se
    sostiene** (con el valor correcto) o si **no tiene el dato**, sin inventarlo. Cuando la frase se puede leer de dos
    formas, muestra las dos.
  ejemplos:
    - texto: Total Austral fue la mayor productora de gas de Argentina en 2025.
      nota: Las dos lecturas son correctas y la frase no dice cuál usa. Los rankings publicados usan la primera.
      lecturas:
        - nombre: Si «producir» es el gas que opera cada empresa
          tipo: primero
          empresa: TOTAL AUSTRAL
          divisor: 1000000
          unidad: miles de millones de m³
          consulta: |
            SELECT ?empresa (SUM(?gas) AS ?gas2025) WHERE {
              ?p a energia:WellProduction ; energia:declaredBy ?e ; energia:gas ?gas .
              ?e energia:name ?empresa .
            } GROUP BY ?empresa ORDER BY DESC(?gas2025) LIMIT 5
        - nombre: Si «producir» es el gas que le corresponde por su participación
          tipo: primero
          empresa: TOTAL AUSTRAL
          divisor: 1000000
          unidad: miles de millones de m³
          consulta: |
            SELECT ?empresa (SUM(?gas * ?porcentaje / 100) AS ?gas2025) WHERE {
              ?p a energia:WellProduction ; energia:inConcession ?c ; energia:gas ?gas .
              ?s a energia:Stake ; energia:inConcession ?c ; energia:partner ?e ; energia:percent ?porcentaje .
              ?e energia:name ?empresa .
            } GROUP BY ?empresa ORDER BY DESC(?gas2025) LIMIT 5
    - texto: Tecpetrol declaró unos 6.900 millones de m³ de gas en 2025.
      lecturas:
        - nombre: El gas que declaró Tecpetrol en 2025
          tipo: numero
          valor: 6900
          divisor: 1000
          unidad: millones de m³
          consulta: |
            SELECT (SUM(?gas) AS ?gas2025) WHERE {
              ?p a energia:WellProduction ; energia:declaredBy ?e ; energia:gas ?gas .
              ?e energia:name ?nombre . FILTER(CONTAINS(UCASE(?nombre), "TECPETROL"))
            }
    - texto: YPF tenía reservas probadas de gas por 150 mil millones de m³ a fin de 2024.
      lecturas:
        - nombre: Las reservas probadas de YPF
          tipo: sin_datos
          falta: Rastro no tiene reservas. Tiene la producción declarada, las concesiones con sus socios, los venteos y los estudios ambientales.

externo:
  titulo: Enriquecer con datos de afuera (Wikidata)
  materializado: /ontology/energia/queries/cq15.rq
  consulta: /layer/energia/externo/wikidata.rq
  guardado: /layer/energia/externo/resultado-2026-10-20.csv
  numeros: {nombre: empresa, valor: su_parte_m3, unidad: m3}   # the saved file's columns the slides read
  tecnicas: [lei, wikidata]    # columns only the technical view shows
  grafo:                       # the diagram: Rastro, the outside source, the query that joins them and the shared key
    rastro: "Rastro\\nempresa · LEI · petróleo 2025"
    fuente: "Wikidata (internet)\\nsede · bolsa · dueño · sitio web"
    consulta: "una consulta\\n(GraphDB)"
    clave: "  el mismo LEI  "
  columnas_guardado: {empresa: Empresa, bolsa: Cotiza en, sede: Sede, consultado: Consultado el, wikidata: Wikidata}
  numericas: [su_parte_m3, declara_m3]
  fecha_guardado: 20 oct 2026
  intro: >-
    **Enriquecer** es sumarle a los datos propios lo que sabe otra fuente, sin perder de dónde vino cada dato.
    Una sola consulta une, en vivo, **Rastro** y **Wikidata**: las empresas con identificador global (LEI)
    y el petróleo de 2025 que les corresponde según sus socios (el mismo número del paso 1), con lo que Wikidata sabe de cada una (sede, en qué bolsa cotiza,
    dueño o matriz y sitio web). No se carga nada: Rastro y Wikidata usan el mismo LEI.
  conclusion: >-
    Que YPF y Pampa Energía cotizan en la Bolsa de Nueva York no está en ninguna de las seis fuentes de
    Rastro: llega de Wikidata en la misma consulta. Solo 3 de las 12 empresas con LEI lo tienen cargado en
    Wikidata; por nombre aparecen otras, pero ese cruce necesitaría revisión y el LEI no.
  columnas:
    empresa: Empresa
    su_parte_m3: Su parte del petróleo 2025 (m³)
    declara_m3: Declara como operadora (m³)
    sede_segun_wikidata: Sede (Wikidata)
    cotiza_en: Cotiza en (Wikidata)
    duenio_o_matriz: Dueño o matriz (Wikidata)
    sitio: Sitio web (Wikidata)
    lei: LEI
    wikidata: Wikidata

