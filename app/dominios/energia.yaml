# Rastro Lab: the same gas model with and without Rastro (lab/gas/modelo.py)
numeros_demo:                  # numbers only the slides show (app/contraste.py): one-row queries and arithmetic
  valores:
    - sparql: >-
        SELECT (SUM(?gas) AS ?gas_total) WHERE { ?p a energia:WellProduction ; energia:inConcession ?c ; energia:gas ?gas . }
    - sparql: >-
        SELECT (SUM(?gas) AS ?gas_con_participacion) WHERE { ?p a energia:WellProduction ; energia:inConcession ?c ;
        energia:gas ?gas . FILTER EXISTS { ?s a energia:Stake ; energia:inConcession ?c } }
    - sparql: >-
        SELECT (MAX(?w) AS ?agua_afectada) (MAX(?p) AS ?psi_afectada) WHERE { VALUES ?f { {fallas} }
        OPTIONAL { ?f energia:waterM3 ?w } OPTIONAL { ?f energia:maxPressurePsi ?p } }
    - sparql: >-
        SELECT (MAX(?d) AS ?profundidad_max) WHERE { ?t energia:verticalDepthM ?d }
  calculos:
    pct_participaciones: 100 * gas_con_participacion / gas_total
  decimales: {pct_participaciones: 1, agua_afectada: 0, psi_afectada: 0, profundidad_max: 0}
  mostrar: [pct_participaciones, agua_afectada, psi_afectada, profundidad_max]
extension: energia.OilAndGas   # app/extensions/energia/: Rastro Lab, the answer walkthrough and the correction view
fuera:                         # ¿dice cuándo no tiene el dato? lo mide layer/fuera.py
  archivo: /layer/energia/fuera/resultados.json
  intro: >-
    Preguntas del sector que los datos de Rastro no responden (precios, reservas, inversiones, 2026, empleo) y una de
    control que sí. Con la misma regla para todos («si los datos no alcanzan, decí qué falta»), ninguno inventó: todos
    dijeron qué faltaba. La diferencia está en la de control: sin datos no se puede responder; con datos, sí,
    y con su fuente.
calidad:                       # reglas de calidad (SHACL): ontology/energia/calidad/reglas.ttl, las comprueba `docker compose run --rm calidad`
  archivo: /layer/energia/calidad.json
  intro: >-
    Reglas sobre los datos integrados, escritas una vez con las palabras del diccionario y comprobadas después de cada
    carga, como los controles de calidad de una base de datos. Miran todas las fuentes juntas y también la evidencia.
    No arreglan nada: muestran qué no se cumple, dónde y qué predicciones de Rastro Lab usan ese dato (las que heredan
    el error). La primera vez encontraron 5 trayectorias de pozo sin evidencia; se arregló en un lugar, la regla que
    arma la evidencia. Las de valores imposibles marcan datos de la fuente para revisar, sin cambiarlos.
  tecnico: >-
    Las reglas de calidad están en SHACL, el estándar del W3C para validar un grafo. Rastro trae con CONSTRUCT solo lo
    que miran y las valida con pySHACL. Cada regla tiene un blanco (`sh:targetClass`, `sh:targetSubjectsOf`), sus
    condiciones (`sh:minCount`, `sh:maxInclusive`, `sh:pattern`, `sh:lessThanOrEquals`) y, si hace falta, una consulta
    SPARQL (`sh:sparql`). Las mismas reglas sirven en otras plataformas o herramientas de grafos de conocimiento.

faq:
  - pregunta: ¿De dónde salen los datos?
    respuesta: >-
      De seis fuentes públicas de cuatro organismos. De la Secretaría de Energía: las declaraciones juradas mensuales de
      producción de cada pozo en 2025 y el padrón de pozos (Capítulo IV, datos.energia.gob.ar), el
      servicio de mapas (WFS) con las concesiones, sus socios y los venteos de gas, y el listado de estudios
      ambientales presentados en cada concesión. Del mismo servicio,
      los gasoductos de transporte de ENARGAS. Del Instituto Geográfico Nacional (listado en IDERA), las
      localidades y las áreas protegidas. Y de GLEIF, el identificador global de las empresas. Se usa 2025
      porque el archivo de 2026 todavía no trae a todas las operadoras. Las de 2023 y 2024 se usan solo
      para ver quién operó cada concesión en el tiempo (los cambios de operadora).
  - pregunta: ¿Por qué los grupos (Chevron, Pluspetrol, CGC) son correcciones revisadas y no salen de un registro?
    respuesta: >-
      Porque ningún registro público los tiene: GLEIF no registra la matriz de ninguna de estas empresas
      argentinas, y las sociedades de Chevron no tienen LEI; Wikidata tampoco registra esas relaciones.
      Por eso son correcciones revisadas, con su motivo a la vista, y el LEI se usa como identificador de
      cada empresa.
  - pregunta: ¿Un posible venteo detectado por satélite es un incumplimiento?
    respuesta: >-
      No. Es una anomalía térmica que vio un satélite: un indicio para revisar. Además, la capa de puntos
      de venteo declarados puede estar desactualizada. Rastro sirve para saber en qué concesión cae cada
      punto y quién la opera, no para concluir que hay una falta.
  - pregunta: ¿Por qué la regla de la operadora es «rige la declaración jurada»?
    respuesta: >-
      Porque es lo que la empresa informa todos los meses. Es una decisión de negocio, escrita una vez y a
      la vista: si se prefiere otra, se cambia en un solo lugar y vale para todas las preguntas. En cada
      pozo donde las fuentes no coinciden, la evidencia muestra lo que dice el padrón.
  - pregunta: ¿Quién revisó las correcciones de nombres?
    respuesta: >-
      Las armó un asistente de IA (por ejemplo, que la socia de YPF en Loma Campana es la empresa de
      Chevron); falta que una persona las confirme. Están en linking/energia/correcciones.csv, con su motivo.
  - pregunta: ¿Se puede unir con datos de otras organizaciones, como Wikidata?
    respuesta: >-
      Sí, por el LEI, que Rastro y Wikidata usan igual. Una sola consulta en GraphDB une, en vivo y sin
      cargar nada, las empresas de Rastro con lo que Wikidata sabe de ellas: sede, bolsa en la que cotizan
      y sitio web. Así aparece que YPF y Pampa Energía cotizan en la Bolsa de Nueva York, un dato que no
      está en ninguna de las seis fuentes. Solo 3 de las 12 empresas con LEI lo tienen cargado en
      Wikidata (YPF, Pan American Energy y Pampa Energía). Detalle en layer/energia/externo/.
  - pregunta: ¿Qué hace la regresión lineal de Rastro Lab?
    respuesta: >-
      Aprende un coeficiente para cada característica del pozo. La predicción se puede escribir como el gas promedio
      más lo que suma o resta cada característica. La variante ridge limita los coeficientes para reducir ajustes
      excesivos. Sus aportes explican la cuenta del modelo; no demuestran causas físicas.
  - pregunta: ¿Qué es Random Forest?
    respuesta: >-
      Es un bosque de árboles de decisión. Cada árbol hace preguntas sobre los datos del pozo y llega a una
      estimación; el bosque promedia las estimaciones. Cada árbol usa una muestra aleatoria de los pozos y
      considera distintas variables al tomar cada decisión, para reducir la dependencia de un solo árbol. En el dibujo de la app se sigue un árbol real
      del bosque para el pozo seleccionado.
  - pregunta: ¿Qué es XGBoost?
    respuesta: >-
      Construye árboles sucesivamente: cada nuevo árbol ayuda a corregir los errores de los anteriores.
      Combina esas correcciones para estimar el gas y limita la complejidad para reducir el sobreajuste.
      Puede aprender relaciones entre variables que una suma lineal no representa directamente.
  - pregunta: ¿Qué es LightGBM?
    respuesta: >-
      También construye árboles que corrigen los errores anteriores. Elige qué hoja dividir según cuánto puede
      reducir el error, buscando un entrenamiento eficiente. En Rastro Lab se limitan la profundidad y el tamaño
      de las hojas. Usar este algoritmo no garantiza mejores predicciones: se comprueba con los mismos pozos.
  - pregunta: ¿Cómo se eligió el modelo alternativo?
    respuesta: >-
      Se compararon Random Forest, XGBoost y LightGBM, entrenando sobre el gas directo y sobre su logaritmo.
      Se eligió la combinación con menor error medio en los pozos de 2023 y 2024; los de 2025 se muestran por
      separado como evaluación. Todos predicen el gas de los meses 2 a 7 con las mismas variables. La tabla de
      Rastro Lab conserva los resultados de todas las opciones y de la regresión. Es una evaluación experimental.
  - pregunta: ¿El árbol dibujado explica toda la predicción?
    respuesta: >-
      El dibujo muestra la ruta real del pozo por el primer árbol. En Random Forest se promedian muchos árboles;
      en XGBoost y LightGBM se combinan correcciones de muchos árboles. Un solo árbol muestra una parte del cálculo.
      Rastro permite abrir los valores usados y sus fuentes. Las decisiones del modelo no prueban causas físicas.
  - pregunta: Referencias
    respuesta: |-
      Un trabajo publicado une estas mismas fuentes públicas (producción por pozo, padrón, datos de fractura y
      trayectorias) para predecir el gas del primer año de 642 pozos de shale gas de Vaca Muerta. Rastro Lab lo usa
      para validar que su modelo da números razonables con los mismos datos: con el diseño de ese trabajo, la
      mediana por área da prácticamente lo mismo (R² 0,45 contra 0,47). Rastro Lab hace la misma predicción con
      otro objetivo: que cada predicción se explique en conceptos de negocio, con la fuente de cada dato.

      - Fernández Gazzaniga, A. (2025). «Predicción de productividad inicial en pozos de shale gas de Vaca Muerta
        mediante machine learning». [Tesis de maestría. Universidad Torcuato Di Tella]. Repositorio Digital
        Universidad Torcuato Di Tella. https://repositorio.utdt.edu/handle/20.500.13098/14415

      Las referencias sobre grafos de conocimiento están en «Referencias», en las preguntas para todos los casos.
  - pregunta: ¿Dónde está cada pieza?
    tecnico: true
    respuesta: >-
      Datos en Postgres, un esquema por fuente (`capitulo4`, `sig_energia`, `enargas`, `ign`, `gleif_energia`);
      empresas, socios, operadoras, venteos ubicados, gasoductos cercanos y entorno en el esquema `energia`
      (`linking/energia/`); un tercer Ontop en el puerto 8082 con su
      ontología (`ontology/energia/`) y sus mapeos (`mappings/energia.r2rml.ttl`). Cada enlace se expone con PROV-O.

# Configuración de la vista técnica; sin listas por dominio en Python.
technical:
  instances:
    'Una concesión: Loma Campana': https://w3id.org/rastro/energia/concession/LCAM
    'Una empresa: YPF': https://w3id.org/rastro/energia/company/YPF
    'Una participación (enlace con evidencia): Chevron en Loma Campana': https://w3id.org/rastro/energia/stake/LCAM/CHEVRON
    'La operadora de un pozo (enlace con evidencia): pozo 107709': https://w3id.org/rastro/energia/operatorlink/107709
    La producción de un pozo en diciembre de 2025: https://w3id.org/rastro/energia/production/107709/12/BEH/YPF
    Un posible venteo visto por satélite: https://w3id.org/rastro/energia/venting/sensoresremotos_venteos_detectados.61105
    Dónde cae ese venteo (enlace con evidencia): https://w3id.org/rastro/energia/locationlink/sensoresremotos_venteos_detectados.61105
  pieces:
    mapeos: /mappings/energia.r2rml.ttl
    enlaces:
    - - Paso 1 · Los socios de cada concesión, separados del texto del mapa
      - "SELECT c.nombre AS concesion, e.nombre AS socia, p.porcentaje, p.texto AS\
        \ evidencia\n                FROM energia.participacion p JOIN energia.concesion\
        \ c USING (id_concesion) JOIN energia.empresa e USING (empresa_id)\n     \
        \           WHERE c.nombre IN ('LOMA CAMPANA', 'LA AMARGA CHICA', 'BANDURRIA\
        \ SUR') ORDER BY 1, 3 DESC"
    - - Paso 1 · La misma empresa, escrita distinto en cada fuente
      - "SELECT n.fuente, n.nombre AS nombre_en_la_fuente, e.nombre AS empresa, n.regla\n\
        \                FROM energia.empresa_nombre n JOIN energia.empresa e USING\
        \ (empresa_id)\n                WHERE e.nombre IN ('COMPAÑIA GENERAL DE COMBUSTIBLES',\
        \ 'CHEVRON', 'PLUSPETROL') ORDER BY 3, 1, 2"
    - - Paso 2 · Quién opera cada pozo (pozos donde el padrón dice otra cosa)
      - "SELECT o.idpozo AS pozo, e.nombre AS operadora, o.empresa_padron AS segun_el_padron,\
        \ o.regla, o.evidencia\n                FROM energia.operador_pozo o JOIN\
        \ energia.empresa e USING (empresa_id)\n                WHERE o.empresa_padron\
        \ IS NOT NULL AND upper(o.empresa_padron) NOT LIKE upper(left(e.nombre, 6))\
        \ || '%'\n                ORDER BY o.idpozo LIMIT 6"
    - - Paso 3 · En qué concesión cae cada posible venteo (La Calera)
      - "SELECT v.id AS venteo, v.fecha, v.satelite, c.nombre AS concesion, v.evidencia\n\
        \                FROM energia.venteo v JOIN energia.concesion c USING (id_concesion)\n\
        \                WHERE v.tipo = 'detectado' AND c.nombre = 'LA CALERA' ORDER\
        \ BY v.fecha DESC LIMIT 6"
    mapas:
    - - Paso 1 · Participación, nombres de empresa y producción
      - - Stake
        - CompanyName
        - WellProductionAmounts
    - - Paso 2 · La operadora de cada pozo
      - - OperatorLink
    - - Paso 3 · El venteo y su concesión
      - - DetectedVenting
        - LocationLink
  map:
    queries:
      concessions: "PREFIX geo: <http://www.opengis.net/ont/geosparql#>\nSELECT ?name\
        \ ?operator ?wkt (COUNT(DISTINCT ?d) AS ?n) (SAMPLE(?why) AS ?reason) WHERE\
        \ {\n        ?c a energia:Concession ; energia:name ?name ; geo:asWKT ?wkt\
        \ .\n        OPTIONAL { ?c energia:operatorOnMap/energia:name ?operator }\n\
        \        OPTIONAL { ?d a energia:DetectedVenting ; energia:inConcession ?c\
        \ }\n        OPTIONAL { ?c a energia:ConcessionToReview ; energia:reviewReason\
        \ ?why }\n    } GROUP BY ?name ?operator ?wkt"
      points: 'PREFIX geo: <http://www.opengis.net/ont/geosparql#>

        SELECT ?wkt WHERE { ?d a energia:DetectedVenting ; geo:asWKT ?wkt }'
      pipes: 'PREFIX geo: <http://www.opengis.net/ont/geosparql#>

        SELECT ?name ?wkt WHERE { ?p a energia:Pipeline ; energia:name ?name ; geo:asWKT
        ?wkt }'
    view_state:
      latitude: -38.4
      longitude: -68.9
      zoom: 6.4
    tooltip: <b>{nombre}</b><br>{operadora}<br>{venteos} posibles venteos<br>{revisar}
    caption: 'Puntos rojos: posibles venteos vistos por satélite desde 2024. Líneas
      ámbar: gasoductos de transporte (ENARGAS). Concesiones en rojo: para revisar,
      según la regla del diccionario; en azul, con posibles venteos. Todo sale de
      Rastro, con geometrías en el estándar de OGC (GeoSPARQL).'


# Two walkthroughs on real data, read live. Each says what it is for and which part of Rastro each step shows.
ejemplo_integracion:
  titulo: Paso a paso
  encabezado: Cómo Rastro une los datos, con un pozo y una empresa reales
  para_que: >-
    Mostrar con un caso real cómo Rastro hace de tablas que no se hablan una respuesta que se puede auditar:
    el mismo pozo en dos tablas, la misma empresa con dos nombres, y una respuesta que vuelve a sus registros.
    Es lo que en SQL habría que resolver a mano en cada consulta.
  aviso: >-
    Datos reales, consultados ahora: el pozo 164166 de la Compañía General de Combustibles (CGC), en Cañadón Seco,
    Santa Cruz. Cada número sale de la consulta que se muestra en el paso.
  selector: Elegí un paso
  pasos:
    - titulo: 1 · Un pozo, dos tablas
      parte: >-
        Diccionario y mapeos: cada fuente se traduce a los mismos conceptos de negocio (Pozo, Empresa, Producción),
        sin cambiar los datos originales.
      contenido: |
        Las declaraciones juradas de producción y el padrón de pozos describen el mismo pozo con columnas distintas
        y nombran a la empresa de otra forma. Rastro los une por el **identificador oficial del pozo** (`idpozo`),
        el que la Secretaría de Energía usa en las dos tablas: no por parecido del nombre.
      consultas:
        - titulo: Lo que dice el padrón de pozos (tal como viene)
          sql: >-
            SELECT idpozo, sigla, empresa, area, provincia FROM capitulo4.pozo WHERE idpozo = '164166'
        - titulo: Lo que dicen las declaraciones juradas (los dos primeros meses de 2025, tal como vienen)
          sql: >-
            SELECT idpozo, mes, empresa, areapermisoconcesion AS concesion, prod_gas AS gas_miles_m3
            FROM capitulo4.produccion WHERE idpozo = '164166' ORDER BY mes LIMIT 2
        - titulo: Lo que sabe Rastro de ese pozo (un solo Pozo, con su operadora)
          sparql: >-
            SELECT ?pozo ?operadora (COUNT(?declaracion) AS ?declaraciones) WHERE {
              <https://w3id.org/rastro/energia/well/164166> energia:wellId ?pozo ;
                  energia:operator/energia:name ?operadora .
              ?declaracion energia:well <https://w3id.org/rastro/energia/well/164166> .
            } GROUP BY ?pozo ?operadora
    - titulo: 2 · Una empresa, dos nombres
      parte: >-
        Enlaces con evidencia: cada unión dice su regla, su evidencia y de qué fuente sale (PROV-O). Las revisadas por
        un asistente de IA esperan la confirmación de una persona, y la app lo dice.
      contenido: |
        Las declaraciones nombran a la empresa **CGC ENERGIA SAU**; el padrón y el mapa de concesiones,
        **COMPAÑÍA GENERAL DE COMBUSTIBLES S.A.** Ningún código común las une. Una **corrección revisada** dice que son
        la misma empresa y por qué. Está revisada por un asistente de IA y espera que una persona la confirme.
      consultas:
        - titulo: Cada nombre, en cada fuente, con su regla y su evidencia
          sparql: >-
            SELECT ?nombre ?fuente ?regla ?evidencia WHERE {
              ?n a energia:CompanyName ; energia:company ?c ; energia:nameInSource ?nombre ; energia:rule ?regla ;
                 energia:sourceText ?evidencia ; prov:wasDerivedFrom ?f .
              ?c energia:name "COMPAÑIA GENERAL DE COMBUSTIBLES" .
              BIND (STRAFTER(STR(?f), "/source/") AS ?fuente)
            } ORDER BY ?nombre ?fuente
    - titulo: 3 · La respuesta y su origen
      parte: >-
        La respuesta: una consulta sobre el diccionario. De cada número se vuelve a sus registros y a los enlaces
        que lo sostienen (lo que mide «Por qué confiar»).
      contenido: |
        **¿Cuánto gas declaró en 2025 la Compañía General de Combustibles?**

        En las declaraciones juradas, la empresa aparece con **los dos nombres**. Una consulta SQL que busca uno solo
        encuentra una parte. Con Rastro, la producción de los dos nombres es de una sola empresa, y el porqué es el
        enlace del paso 2.
      consultas:
        - titulo: "Sin Rastro: lo que encuentra cada nombre en las declaraciones"
          sql: >-
            SELECT empresa, count(*) AS declaraciones, round(sum(prod_gas)::numeric, 1) AS gas_miles_m3
            FROM capitulo4.produccion
            WHERE empresa ILIKE '%general de combustibles%' OR empresa ILIKE 'cgc%' GROUP BY empresa ORDER BY empresa
        - titulo: "Con Rastro: una sola empresa"
          sparql: >-
            SELECT (COUNT(?p) AS ?declaraciones) (ROUND(SUM(?g) * 10) / 10 AS ?gas_miles_m3) WHERE {
              ?p a energia:WellProduction ; energia:declaredBy ?c ; energia:gas ?g .
              ?c energia:name "COMPAÑIA GENERAL DE COMBUSTIBLES" .
            }

