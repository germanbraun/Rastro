# Lo propio del dominio de petróleo y gas en la app (lo dibuja app/dominio.py).
# Rutas dentro del contenedor de la app.

domain: energia                # el de layer/dominios.yaml: endpoint, diccionario y notas para el LLM
resumen: >-
  Datos públicos de Argentina: la producción de 2025 pozo por pozo (Capítulo IV, con 2023 y 2024
  para ver quién operó cada concesión) y los mapas de
  concesiones, socios y venteos de gas y los estudios ambientales de la Secretaría de Energía, los gasoductos de ENARGAS, las
  localidades y áreas protegidas del IGN, y el identificador global de empresas (GLEIF).
ejemplo_libre: "Por ejemplo: ¿qué empresas producen más gas en la cuenca Neuquina?"
evaluacion: /layer/energia/resultados.json
cambio: /layer/energia/cambio/resultado.json
correccion: /layer/energia/cambio/correccion.json
evidencia: /layer/energia/evidencia.json   # cobertura de la evidencia (layer/evidencia.py)
ontologia: /ontology/energia/energia.ttl
texto: /layer/energia/textos/venteos.json   # la pregunta sobre textos (GraphRAG anclado)
diagrama: {archivo: ontologia-energia, titulo: diccionario de petróleo y gas}   # app/ontologia-energia.svg, lo dibuja docs/diagramas/build.py

# La demo en cuatro momentos
demo_porque: >-
  Cuatro momentos, lo que hace Rastro en una frase cada uno: responde con evidencia, se arregla en un lugar
  cuando una base cambia, explica las predicciones de un modelo con esa misma evidencia, y una corrección hecha
  una vez llega a todos los resultados. Todo corre en vivo sobre datos públicos de petróleo y gas. Las demás
  preguntas (quién opera cada pozo, venteos en el mapa) están en «Preguntar».
demo:
  - paso: Preguntar
    titulo: "¿Cuánto petróleo le corresponde a cada empresa?"
    pregunta: e01
    muestra: >-
      Integrar cambia el número: sumando por quien declara, YPF tiene 21,4 millones de m³; repartiendo entre
      los socios, su parte es 12,6. Con «¿Por qué este número?» se ve de dónde sale.
  - paso: La base cambia
    titulo: "La fuente publica una versión nueva"
    tipo: cambio
    escenario: renombrar
    muestra: >-
      Sin Rastro, las consultas se rompen de a una y hay que encontrarlas. Con Rastro, se arregla en un lugar.
  - paso: Predecir
    titulo: "¿Cuánto gas va a dar un pozo nuevo?"
    tipo: lab
    muestra: >-
      El mismo modelo con y sin Rastro: predicen igual de bien, pero con Rastro la predicción dice en qué se
      apoya, de dónde sale cada dato y cuáles están corregidos.
  - paso: Una corrección
    titulo: "Se corrige un dato una vez, y cambia todo"
    tipo: correccion
    muestra: >-
      Un documento dice que en Aguada Pichana Este Total tiene el 55 %, no el 27,27 % del mapa. Se corrige una
      vez en Rastro, y cambian solos la respuesta, lo que entra al modelo y su explicación.

# Fuentes: nombre corto para los encabezados del modo técnico
fuentes:
  capitulo4: Capítulo IV
  sig_energia: Mapas (WFS)
  enargas: ENARGAS
  ign: IGN
  gleif: GLEIF
  rastro: enlace Rastro
nota_rastro: >-
  Las empresas con sus nombres en cada fuente, los socios de cada concesión, quién opera cada pozo
  y en qué concesión cae cada venteo, y quién operó cada concesión mes a mes, que Rastro resuelve una
  vez y guarda con su evidencia

# Cómo se muestran las columnas de las respuestas
columnas:
  company: Empresa
  share: Petróleo que le corresponde (m³)
  gasShare: Gas que le corresponde (miles de m³)
  operated: Petróleo que declara como operadora (m³)
  rule: Regla
  type: Tipo de pozo
  wells: Pozos
  disagree: El padrón dice otra empresa
  concession: Concesión
  operator: Operadora
  detected: Posibles venteos (satélite)
  declared: Puntos de venteo declarados
  unconventionalOil: Petróleo no convencional (m³)
  shaleGas: Gas de shale (miles de m³)
  shaleOil: Petróleo de shale (m³)
  distanceKm: Gasoducto más cercano (km)
  pipeline: Gasoducto
  place: Dónde
  lei: LEI
  why: Por qué revisarla
  since: Desde
  previous: Operadora anterior
  new: Operadora nueva
  oilBefore: Petróleo por mes antes (m³)
  oilAfter: Petróleo por mes después (m³)
  gasBefore: Gas por mes antes (miles de m³)
  gasAfter: Gas por mes después (miles de m³)
formatos:
  share: numero
  gasShare: numero
  shaleGas: numero
  shaleOil: numero
  operated: numero
  unconventionalOil: numero
  oilBefore: numero
  oilAfter: numero
  gasBefore: numero
  gasAfter: numero

# Las preguntas de ejemplo: la consulta de ontology/energia/queries/, la pregunta en palabras
# simples (modo negocio) y la evidencia de «¿De dónde sale la respuesta?»
preguntas:
  - id: e01
    query: /ontology/energia/queries/cq1.rq
    porque:     # «¿Por qué este número?»: la evidencia detrás de una fila de la respuesta
      columna: company
      titulo: "La parte de {valor}, concesión por concesión"
      explica: "Su parte es la suma, en cada concesión, de la producción por su porcentaje. Cada porcentaje sale del texto de socios del mapa, con su fuente."
      query: |
        SELECT ?concesion ?porcentaje ?parte ?gas ?texto ?fuente WHERE {
          { SELECT ?c (SUM(?oil) AS ?prod) (SUM(?g) AS ?prodgas) WHERE {
              ?s0 a energia:Stake ; energia:inConcession ?c ; energia:partner/energia:name "{valor}" .
              ?p a energia:WellProduction ; energia:inConcession ?c ; energia:oil ?oil ; energia:gas ?g } GROUP BY ?c }
          ?s a energia:Stake ; energia:inConcession ?c ; energia:partner/energia:name "{valor}" ; energia:percent ?porcentaje ;
             energia:sourceText ?texto ; prov:wasDerivedFrom/energia:name ?fuente .
          ?c energia:name ?concesion .
          BIND (ROUND(?prod * ?porcentaje / 100) AS ?parte)
          BIND (ROUND(?prodgas * ?porcentaje / 100) AS ?gas)
        } ORDER BY DESC(?parte)
      numeros: [parte, gas]
      nodo: "{concesion}"
      detalle: "{porcentaje} % · {parte} m³ de petróleo"
      flecha: socia en
      columnas: {concesion: Concesión, porcentaje: "Porcentaje", parte: "Su parte de petróleo (m³)", gas: "Su parte de gas (miles de m³)", texto: "Evidencia: el texto del mapa", fuente: Fuente}
    explicacion: |
      - **Qué busca:** la producción de petróleo de 2025 de cada pozo, la concesión donde está y los socios de esa concesión con su porcentaje.
      - **Qué calcula:** por cada empresa, la producción multiplicada por su porcentaje, sumada en todas sus concesiones; al lado, lo que opera (la producción que declara).
      - **Lo que en SQL habría que hacer a mano:** separar el texto de socios del mapa («YPF S.A.: 50 %») y unir los nombres de empresa entre fuentes. Acá ya son conceptos: «Participación» y «Empresa».
      - **El SQL de abajo:** Rastro traduce cada concepto a las tablas de enlaces de Rastro y une todo en una sola consulta.
    simple: ¿Cuánto petróleo de 2025 le corresponde a cada empresa, según su participación?
    tecnica: ¿Cuánto petróleo de 2025 le corresponde a cada empresa, multiplicando la producción de cada concesión por su porcentaje?
    ventaja: "Los socios están en un texto del mapa de concesiones; Rastro los separa una vez, con su porcentaje, y une los nombres de cada empresa entre fuentes. Chevron participa con dos razones sociales; una corrección revisada las agrupa."
    terminos:
      Participación: el porcentaje de una concesión que pertenece a cada socio. La operadora maneja los pozos, pero el petróleo se reparte entre los socios.
      m³: metros cúbicos de petróleo. Un metro cúbico son unos 6,3 barriles.
    antes_despues:              # layer/energia/sin-rastro.sql, consulta 1
      sin: {valor: "YPF: 21,4 M m³", detalle: "Sumando la producción por la empresa que la declara, a YPF se le asigna todo lo que opera, y la mitad de La Amarga Chica, que figura a nombre de Petronas E&P Argentina (de Vista desde 2025), no aparece."}
      con: {valor: "YPF: 12,6 M m³", detalle: "Su parte en cada concesión, según los socios del mapa. Vista: 7,0 M m³, con la mitad de La Amarga Chica (2,1), que compró con Petronas E&P Argentina en 2025; Chevron, con sus dos razones sociales: 3,5 M m³."}
      impacto: >-
        Sin integrar, a YPF se le asignan 8,8 millones de m³ de más (55 millones de barriles): unos US$ 3.600
        millones, con un precio supuesto de US$ 65 por barril. Es producción de sus socios.
    evidencia:
      texto: "Los socios de cada concesión, tal como los informa el mapa (algunos ejemplos):"
      formato: "**{concesion}**: {texto}"
      query: |
        SELECT ?concesion ?texto ?fuente WHERE {
          ?s a energia:Stake ; energia:inConcession/energia:name ?concesion ; energia:sourceText ?texto ;
             prov:wasDerivedFrom/energia:name ?fuente .
          FILTER (?concesion IN ("LOMA CAMPANA", "LA AMARGA CHICA"))
        } ORDER BY ?concesion ?texto

  - id: e02
    query: /ontology/energia/queries/cq2.rq
    porque:
      columna: type
      titulo: "Pozos «{valor}» de YPF: quién los opera y por qué"
      explica: "Para cada pozo, Rastro guarda qué dice cada fuente y qué regla decidió quién lo opera. Algunos ejemplos:"
      query: |
        SELECT ?pozo ?regla ?texto WHERE {
          ?l a energia:OperatorLink ; energia:aboutWell ?w ; energia:company/energia:name "YPF S.A." ;
             energia:rule ?regla ; energia:sourceText ?texto .
          ?w energia:wellId ?pozo ; energia:wellType "{valor}" .
        } ORDER BY DESC(?regla) ?pozo LIMIT 12
      nodo: "Pozo {pozo}"
      detalle: "{regla}"
      flecha: lo opera
      columnas: {pozo: Pozo, regla: Regla, texto: "Evidencia: qué dice cada fuente"}
    explicacion: |
      - **Qué busca:** los enlaces «operadora de un pozo» que nombran a YPF, agrupados por tipo de pozo (petrolífero, gasífero, de inyección…).
      - **Qué devuelve:** cuántos pozos de cada tipo opera YPF y en cuántos rige la declaración jurada porque el padrón dice otra empresa. Son todos los pozos que YPF declara en 2025, produzcan o no.
      - **Lo que en SQL habría que hacer a mano:** decidir en cada consulta qué fuente manda (padrón o declaraciones). Acá la regla está escrita una vez, y cada pozo guarda su evidencia.
    simple: ¿Cuántos pozos opera hoy YPF, y de qué tipo?
    tecnica: ¿Cuántos pozos con declaración jurada en 2025 opera hoy YPF, por tipo de pozo (energia:wellType), y en cuántos no coinciden las fuentes?
    ventaja: "El padrón de pozos y las declaraciones juradas no siempre nombran a la misma operadora. Rastro aplica una regla escrita una vez (rige quien declara la producción del último mes) y deja a la vista lo que dice el padrón en cada pozo."
    terminos:
      Declaración jurada: lo que cada empresa informa todos los meses a la Secretaría de Energía sobre la producción de cada pozo.
      Padrón de pozos: el registro de todos los pozos, con su ubicación y su empresa.
    antes_despues:              # layer/energia/sin-rastro.sql, consulta 2
      sin: {valor: "12.006 o 15.809", detalle: "Dos respuestas: el padrón de pozos dice 12.006 y las declaraciones juradas, 15.809. En 3.796 pozos el padrón nombra a otra empresa (Pecom, Velitec, Copesa)."}
      con: {valor: "15.809 pozos", detalle: "Una regla escrita: rige quien declara la producción del último mes. Lo que dice el padrón queda a la vista en cada pozo. Son pozos de todo tipo: 5.391 petrolíferos, 1.394 gasíferos, 1.318 de inyección y 7.579 de otro tipo; 5.689 produjeron petróleo o gas en 2025."}
    evidencia:
      texto: "Pozos donde las fuentes no coinciden (algunos ejemplos):"
      formato: "**Pozo {pozo}**: {evidencia}"
      query: |
        SELECT ?pozo ?evidencia ?fuente WHERE {
          ?l a energia:OperatorLink ; energia:aboutWell/energia:wellId ?pozo ; energia:company/energia:name "YPF S.A." ;
             energia:rule "rige la declaración jurada" ; energia:sourceText ?evidencia ; prov:wasDerivedFrom/energia:name ?fuente .
        } ORDER BY ?pozo LIMIT 5

  - id: e03
    query: /ontology/energia/queries/cq3.rq
    porque:
      columna: concession
      titulo: "Los posibles venteos de {valor}, y por qué caen ahí"
      explica: "Cada punto del satélite tiene coordenadas; Rastro lo ubicó dentro del contorno de la concesión y guardó la evidencia."
      query: |
        SELECT ?fecha ?satelite ?texto ?fuente WHERE {
          ?l a energia:LocationLink ; energia:aboutVenting ?d ; energia:inConcession/energia:name "{valor}" ;
             energia:sourceText ?texto ; prov:wasDerivedFrom/energia:name ?fuente .
          ?d energia:date ?fecha . OPTIONAL { ?d energia:satellite ?satelite }
        } ORDER BY DESC(?fecha) LIMIT 12
      nodo: "{fecha}"
      detalle: "{satelite}"
      flecha: posible venteo
      columnas: {fecha: Fecha, satelite: Satélite, texto: "Evidencia: dónde cae el punto", fuente: Fuente}
    mapa: true
    explicacion: |
      - **Qué busca:** los posibles venteos vistos por satélite y la concesión en la que cae cada uno, con su operadora en el mapa y sus puntos de venteo declarados.
      - **Qué devuelve:** las 10 concesiones con más detecciones.
      - **Lo que en SQL habría que hacer a mano:** ubicar cada punto dentro del contorno de cada concesión (punto dentro de polígono). Rastro lo calculó una vez; la consulta solo dice «en la concesión».
    simple: ¿En qué concesiones vio el satélite más posibles venteos de gas desde 2024, y quién las opera?
    tecnica: ¿En qué concesiones hay más anomalías térmicas detectadas por satélite desde 2024, con su operadora y sus puntos de venteo declarados?
    ventaja: "La capa del satélite solo dice fecha y provincia. Rastro ubica cada punto dentro del contorno de su concesión, una vez, y así llega a la operadora y a los venteos declarados."
    terminos:
      Venteo: liberar o quemar gas en el yacimiento en lugar de aprovecharlo.
      Posible venteo: una anomalía térmica que vio un satélite. Es un indicio para revisar, no una confirmación.
    antes_despues:              # layer/energia/sin-rastro.sql, consulta 3
      sin: {valor: "Neuquén: 6.256", detalle: "La capa del satélite solo dice fecha y provincia: no se sabe en qué concesión ni de qué empresa. Además escribe Tierra del Fuego de dos formas."}
      con: {valor: "La Calera: 482", detalle: "6.636 posibles venteos ubicados en su concesión, con su operadora. La Calera (Pluspetrol): 482, sin ningún punto de venteo declarado en el mapa."}
    evidencia:
      texto: "Por qué cada detección está en La Calera (algunos ejemplos):"
      formato: "**{fecha}**: {evidencia}"
      query: |
        SELECT ?fecha ?evidencia ?fuente WHERE {
          ?d a energia:DetectedVenting ; energia:date ?fecha .
          ?l a energia:LocationLink ; energia:aboutVenting ?d ; energia:inConcession/energia:name "LA CALERA" ; energia:sourceText ?evidencia ;
             prov:wasDerivedFrom/energia:name ?fuente .
        } ORDER BY DESC(?fecha) LIMIT 4

  - id: e04
    query: /ontology/energia/queries/cq4.rq
    porque:
      columna: company
      titulo: "El petróleo no convencional de {valor}, por formación"
      explica: "Ninguna tabla dice «no convencional»: Rastro lo deduce del tipo de recurso (shale o tight) de cada declaración jurada."
      query: |
        SELECT ?formacion (ROUND(SUM(?o)) AS ?petroleo) WHERE {
          ?p a energia:UnconventionalProduction ; energia:declaredBy/energia:name "{valor}" ; energia:formation ?formacion ; energia:oil ?o .
        } GROUP BY ?formacion ORDER BY DESC(?petroleo)
      numeros: [petroleo]
      nodo: "{formacion}"
      detalle: "{petroleo} m³"
      flecha: declara en
      columnas: {formacion: Formación, petroleo: "Petróleo no convencional 2025 (m³)"}
    explicacion: |
      - **Qué busca:** la producción de cada pozo que es «no convencional» y la empresa que la declara.
      - **Qué devuelve:** las 10 empresas con más petróleo no convencional.
      - **Lo particular:** «no convencional» no es una columna. El diccionario dice que shale y tight son tipos de no convencional, y Rastro lo deduce. Si mañana se suma otro tipo, se cambia una línea del diccionario, no cada consulta.
    simple: ¿Quiénes producen más petróleo no convencional (shale y tight)?
    tecnica: ¿Qué empresas declaran más petróleo no convencional en 2025 (la clase deducida, sin mapeo propio)?
    ventaja: "«No convencional» se define una vez, en el diccionario de negocio: shale o tight. Ningún mapeo la asigna; vale para todas las preguntas."
    terminos:
      No convencional: petróleo de rocas poco permeables (shale, como Vaca Muerta, o tight), que se extrae con fractura hidráulica.
    definicion: |
      energia:UnconventionalProduction rdfs:label "Producción no convencional"@es .
      energia:ShaleProduction rdfs:subClassOf energia:UnconventionalProduction .
      energia:TightProduction rdfs:subClassOf energia:UnconventionalProduction .

  - id: e05
    query: /ontology/energia/queries/cq5.rq
    porque:
      columna: concession
      titulo: "El gasoducto más cercano a {valor}"
      explica: "Rastro midió una vez la distancia del contorno de cada concesión a cada tramo de gasoducto de ENARGAS y guardó el más cercano, con su evidencia."
      query: |
        SELECT ?gasoducto ?distancia ?texto (GROUP_CONCAT(DISTINCT ?f; separator=", ") AS ?fuente) WHERE {
          ?c energia:name "{valor}" .
          ?g a energia:PipelineLink ; energia:aboutConcession ?c ; energia:pipeline ?gasoducto ; energia:distanceKm ?distancia ;
             energia:sourceText ?texto ; prov:wasDerivedFrom/energia:name ?f .
        } GROUP BY ?gasoducto ?distancia ?texto
      nodo: "{gasoducto}"
      detalle: "a {distancia} km"
      flecha: gasoducto más cercano
      columnas: {gasoducto: Gasoducto, distancia: "Distancia (km)", texto: Evidencia, fuente: Fuentes}
    explicacion: |
      - **Qué busca:** las concesiones con posibles venteos y, para cada una, el gasoducto de transporte de ENARGAS más cercano y a cuántos km está.
      - **Qué filtra:** solo las que tienen ese gasoducto a 10 km o más.
      - **Lo que en SQL habría que hacer a mano:** medir distancias entre contornos y caños de dos organismos distintos. Rastro las calculó una vez y las guarda con su evidencia.
    simple: ¿Qué concesiones con posibles venteos no tienen un gasoducto de transporte cerca?
    tecnica: ¿Qué concesiones con posibles venteos detectados por satélite tienen el gasoducto de transporte de ENARGAS más cercano a 10 km o más?
    ventaja: "Los gasoductos son de otro organismo (ENARGAS). Rastro calcula una vez la distancia de cada concesión al gasoducto más cercano y la une con los venteos: una pista de dónde el gas no tiene salida."
    terminos:
      Gasoducto de transporte: los caños troncales que llevan el gas a los centros de consumo. No incluye los ductos internos de cada yacimiento.
    evidencia:
      texto: "Por qué Rastro dice la distancia (algunos ejemplos):"
      formato: "{evidencia}"
      query: |
        SELECT ?evidencia (GROUP_CONCAT(DISTINCT ?f; separator=" + ") AS ?fuentes) WHERE {
          ?g a energia:PipelineLink ; energia:aboutConcession/energia:name ?c ; energia:sourceText ?evidencia ; prov:wasDerivedFrom/energia:name ?f .
          FILTER (?c IN ("CHIHUIDO DE LA SIERRA NEGRA", "EL TRAPIAL - CURAMCHED", "LOMA CAMPANA"))
        } GROUP BY ?evidencia

  - id: e06
    query: /ontology/energia/queries/cq6.rq
    porque:
      columna: concession
      titulo: "Los posibles venteos de {valor} en un área protegida o cerca de una localidad"
      explica: "Para cada punto del satélite, Rastro guardó la localidad más cercana, la distancia y si cae en un área protegida del IGN."
      query: |
        SELECT ?fecha ?lugar ?texto WHERE {
          ?s a energia:SurroundingsLink ; energia:aboutVenting ?d ; energia:nearestTown ?town ; energia:distanceKm ?km ; energia:sourceText ?texto .
          ?d energia:inConcession/energia:name "{valor}" ; energia:date ?fecha .
          OPTIONAL { ?s energia:protectedArea ?area }
          FILTER (BOUND(?area) || ?km < 3)
          BIND (IF(BOUND(?area), CONCAT("área protegida: ", ?area), CONCAT("cerca de ", ?town)) AS ?lugar)
        } ORDER BY DESC(?fecha) LIMIT 12
      nodo: "{fecha}"
      detalle: "{lugar}"
      flecha: posible venteo
      columnas: {fecha: Fecha, lugar: Dónde, texto: Evidencia}
    explicacion: |
      - **Qué busca:** los posibles venteos con su entorno según el IGN: la localidad más cercana y el área protegida, si cae en una.
      - **Qué filtra:** los que están en un área protegida o a menos de 3 km de una localidad, y los cuenta por concesión y operadora.
      - **Lo particular:** el entorno viene de otra fuente (IGN) y se unió una vez por ubicación; la consulta lo usa como cualquier otro dato.
    simple: ¿Qué posibles venteos están dentro de un área protegida o cerca de una localidad?
    tecnica: ¿Qué posibles venteos detectados por satélite caen dentro de un área protegida o a menos de 3 km de una localidad, según el IGN?
    ventaja: "Las localidades y las áreas protegidas son del Instituto Geográfico Nacional. Rastro ubica cada posible venteo respecto de ellas una vez, con la evidencia, y llega a la concesión y a su operadora."
    terminos:
      Área protegida: una reserva o parque con protección legal (nacional o provincial).
    evidencia:
      texto: "El entorno de algunos posibles venteos:"
      formato: "{evidencia}"
      query: |
        SELECT DISTINCT ?evidencia (GROUP_CONCAT(DISTINCT ?f; separator=" + ") AS ?fuentes) WHERE {
          ?s a energia:SurroundingsLink ; energia:protectedArea ?a ; energia:sourceText ?evidencia ; prov:wasDerivedFrom/energia:name ?f .
        } GROUP BY ?evidencia ORDER BY ?evidencia LIMIT 4

  - id: e07
    query: /ontology/energia/queries/cq7.rq
    porque:
      columna: company
      titulo: "El LEI de {valor}"
      explica: "Rastro buscó la empresa en GLEIF y guardó el LEI solo si el nombre legal es el de la empresa, con la evidencia."
      query: |
        SELECT ?lei ?texto (GROUP_CONCAT(DISTINCT ?f; separator=", ") AS ?fuente) WHERE {
          ?e energia:name "{valor}" ; energia:lei ?lei .
          ?l a energia:LeiLink ; energia:company ?e ; energia:sourceText ?texto ; prov:wasDerivedFrom/energia:name ?f .
        } GROUP BY ?lei ?texto
      nodo: "LEI {lei}"
      detalle: ""
      flecha: identificador global
      columnas: {lei: LEI, texto: Evidencia, fuente: Fuentes}
    explicacion: |
      - **Qué busca:** las empresas que tienen LEI (el identificador global de GLEIF) y la producción que declaran.
      - **Qué devuelve:** cada empresa con su LEI y lo que opera, de mayor a menor.
      - **Lo particular:** el LEI se aceptó solo si coincide el nombre legal; los candidatos descartados quedan en la evidencia.
    simple: ¿Qué empresas tienen identificador global (LEI)?
    tecnica: ¿Qué empresas que producen en Argentina tienen LEI en GLEIF, y cuánto petróleo operan?
    ventaja: "El LEI une cada empresa con el registro global de GLEIF, el mismo que usan bancos y reguladores. Rastro lo acepta solo si coincide el nombre legal, y deja a la vista lo que descartó."
    terminos:
      LEI: el identificador global de empresas (GLEIF), el mismo en todo el mundo.
    evidencia:
      texto: "Cómo se eligió cada LEI (algunos ejemplos):"
      formato: "{evidencia}"
      query: |
        SELECT ?evidencia ?fuente WHERE {
          ?l a energia:LeiLink ; energia:company/energia:name ?e ; energia:sourceText ?evidencia ; prov:wasDerivedFrom/energia:name ?fuente .
          FILTER (?e IN ("YPF S.A.", "SHELL ARGENTINA S.A.", "PAN AMERICAN ENERGY SL"))
        }

  - id: e08
    query: /ontology/energia/queries/cq8.rq
    porque:
      columna: concession
      titulo: "Por qué hay que revisar {valor}"
      explica: "«Para revisar» no está en ninguna tabla: Rastro lo deduce de dos reglas del diccionario. Abajo, cada motivo y la evidencia en que se apoya."
      query: |
        SELECT ?que ?texto ?fuente WHERE {
          { ?c energia:name "{valor}" ; energia:reviewReason ?texto . BIND ("motivo para revisar" AS ?que) BIND ("regla del diccionario" AS ?fuente) }
          UNION
          { ?c energia:name "{valor}" . ?g a energia:PipelineLink ; energia:aboutConcession ?c ; energia:sourceText ?texto .
            BIND ("gasoducto más cercano" AS ?que) BIND ("ENARGAS y mapas" AS ?fuente) }
        }
      nodo: "{que}"
      detalle: "{fuente}"
      flecha: se revisa por
      columnas: {que: Qué, texto: Evidencia, fuente: De dónde}
    explicacion: |
      - **Qué busca:** las «concesiones para revisar», con su operadora y el motivo.
      - **Lo particular:** «concesión para revisar» no es una columna ni tiene mapeo. El diccionario dice que lo son las que tienen posibles venteos y además no tienen un gasoducto cerca, o no presentaron planillas de venteo de gas. Rastro la deduce de esas dos reglas.
      - **Lo que en SQL habría que hacer a mano:** repetir las dos reglas, con las distancias y los estudios, en cada consulta que las use. Acá se escriben una vez y valen para todas.
    mapa: true
    simple: ¿Qué concesiones hay que revisar por venteos, y por qué?
    tecnica: ¿Qué concesiones son «para revisar» (clase deducida, sin mapeo propio), con su operadora y su motivo?
    ventaja: "La regla se escribe una vez en el diccionario de negocio: posibles venteos y, además, ningún gasoducto de transporte cerca o ninguna planilla de venteo presentada. Rastro la deduce; vale para esta pregunta, para el mapa y para cualquier otra que la use."
    terminos:
      Concesión para revisar: una concesión que conviene mirar por sus posibles venteos. Es un indicio, no una conclusión.
    definicion: |
      energia:ConcessionToReview rdfs:label "Concesión para revisar"@es .
      energia:VentingFarFromPipeline rdfs:subClassOf energia:ConcessionToReview .   # venteos y gasoducto a 10 km o más
      energia:VentingWithoutReports  rdfs:subClassOf energia:ConcessionToReview .   # 20+ venteos y sin planillas desde 2022

  - id: e09
    query: /ontology/energia/queries/cq9.rq
    porque:
      columna: concession
      titulo: "El cambio de operadora en {valor}"
      explica: "Rastro decide mes a mes quién declara la mayor parte de la producción de cada concesión y marca un cambio cuando otra empresa lo hace 3 meses seguidos. Guarda la evidencia."
      query: |
        SELECT ?desde ?anterior ?nueva ?texto WHERE {
          ?x a energia:OperatorChange ; energia:inConcession ?c ; energia:month ?mes ; energia:sourceText ?texto ;
             energia:previousCompany/energia:name ?anterior ; energia:newCompany/energia:name ?nueva .
          OPTIONAL { ?c energia:name ?n }
          FILTER (COALESCE(?n, STRAFTER(STR(?c), "/concession/")) = "{valor}")
          BIND (CONCAT(SUBSTR(STR(?mes), 6, 2), "/", SUBSTR(STR(?mes), 1, 4)) AS ?desde)
        } ORDER BY ?mes
      nodo: "{nueva}"
      detalle: "desde {desde}, antes {anterior}"
      flecha: pasa a operarla
      columnas: {desde: Desde, anterior: "Operadora anterior", nueva: "Operadora nueva", texto: Evidencia}
    explicacion: |
      - **Qué busca:** los «cambios de operadora»: cada concesión donde otra empresa pasó a declarar la mayor parte de la producción, con el mes, la operadora anterior y la nueva.
      - **Qué devuelve:** lo que producía la concesión por mes, en promedio, con la operadora anterior y con la nueva; de mayor a menor petróleo.
      - **Lo que en SQL habría que hacer a mano:** unir tres años de declaraciones juradas (tres archivos), unir los nombres de empresa entre años, decidir mes a mes quién declara la mayor parte y descartar los meses sueltos. Rastro lo hace una vez y cada cambio guarda su evidencia.
    simple: ¿Qué áreas cambiaron de operadora entre 2023 y 2025, y cuánto producían antes y después?
    tecnica: ¿En qué concesiones pasó otra empresa a declarar la mayor parte de la producción entre 2023 y 2025 (al menos 3 meses seguidos), y cuánto petróleo y gas producían por mes con cada operadora?
    ventaja: "Las declaraciones juradas son un archivo por año. Rastro las une, decide mes a mes quién declara la mayor parte de cada concesión y marca cada cambio con su evidencia: así se ven las áreas maduras que YPF vendió (Pecom, Petróleos Sudamericanos, Bentia, Quintana) y cuánto producían."
    terminos:
      Cambio de operadora: desde ese mes, otra empresa declara la mayor parte de la producción de la concesión, al menos 3 meses seguidos.
      Áreas maduras: yacimientos convencionales con muchos años de producción, que suelen pasar a empresas más chicas.
    evidencia:
      texto: "Por qué Rastro dice que cambió la operadora (algunos ejemplos):"
      formato: "{evidencia}"
      query: |
        SELECT ?evidencia ?fuente WHERE {
          ?x a energia:OperatorChange ; energia:inConcession/energia:name ?c ; energia:sourceText ?evidencia ; prov:wasDerivedFrom/energia:name ?fuente .
          FILTER (?c IN ("ESCALANTE - EL TREBOL", "BARRANCAS", "BAJO DEL CHOIQUE - LA INVERNADA"))
        } ORDER BY ?c

  - id: e10
    query: /ontology/energia/queries/cq10.rq
    porque:
      columna: company
      titulo: "El gas de shale de {valor}, por concesión"
      explica: "«Shale» sale del tipo de recurso de cada declaración jurada; la concesión, del enlace de cada pozo con el mapa."
      query: |
        SELECT ?concesion (ROUND(SUM(?g)) AS ?gas) WHERE {
          ?p a energia:ShaleProduction ; energia:declaredBy/energia:name "{valor}" ; energia:inConcession/energia:name ?concesion ; energia:gas ?g .
        } GROUP BY ?concesion ORDER BY DESC(?gas)
      numeros: [gas]
      nodo: "{concesion}"
      detalle: "{gas} miles de m³"
      flecha: declara en
      columnas: {concesion: Concesión, gas: "Gas de shale 2025 (miles de m³)"}
    explicacion: |
      - **Qué busca:** la producción de cada pozo que es de shale y la empresa que la declara.
      - **Qué devuelve:** las 10 empresas con más gas de shale en 2025, con su petróleo de shale al lado.
      - **Lo particular:** es la misma clase deducida que el no convencional (shale es un tipo), mirada por el gas. El gas y el petróleo vienen de las mismas declaraciones juradas, pozo por pozo.
    simple: ¿Quiénes producen más gas de shale (Vaca Muerta)?
    tecnica: ¿Qué empresas declaran más gas de shale en 2025 (energia:ShaleProduction, con su gas en miles de m³)?
    ventaja: "El gas y el petróleo están en el mismo diccionario y salen de las mismas declaraciones juradas: preguntar por gas es cambiar una palabra de la consulta."
    terminos:
      Gas de shale: gas de rocas poco permeables (como Vaca Muerta), que se extrae con fractura hidráulica. Se mide en miles de metros cúbicos.

# Enriquecer con datos de afuera: una consulta une Rastro con Wikidata en vivo, en GraphDB, por el LEI; y lo mismo
# guardado en Rastro (materializado: wikidata-energia-loader), que se consulta con la pregunta 15
afirmaciones:                  # «Comprobar una afirmación»: Rastro calcula el veredicto en vivo, con cada lectura
  titulo: Comprobar una afirmación
  intro: >-
    Una frase de un informe o de la prensa, comprobada contra los datos. Rastro dice si **se sostiene**, si **no se
    sostiene** (con el valor correcto) o si **no tiene el dato**, sin inventarlo. Cuando la frase se puede leer de dos
    formas, muestra las dos.
  ejemplos:
    - texto: Total Austral fue la mayor productora de gas de Argentina en 2025.
      nota: Las dos lecturas son correctas y la frase no dice cuál usa. Los rankings publicados usan la primera.
      lecturas:
        - nombre: Si «producir» es el gas que opera cada empresa
          tipo: primero
          empresa: TOTAL AUSTRAL
          divisor: 1000000
          unidad: miles de millones de m³
          consulta: |
            SELECT ?empresa (SUM(?gas) AS ?gas2025) WHERE {
              ?p a energia:WellProduction ; energia:declaredBy ?e ; energia:gas ?gas .
              ?e energia:name ?empresa .
            } GROUP BY ?empresa ORDER BY DESC(?gas2025) LIMIT 5
        - nombre: Si «producir» es el gas que le corresponde por su participación
          tipo: primero
          empresa: TOTAL AUSTRAL
          divisor: 1000000
          unidad: miles de millones de m³
          consulta: |
            SELECT ?empresa (SUM(?gas * ?porcentaje / 100) AS ?gas2025) WHERE {
              ?p a energia:WellProduction ; energia:inConcession ?c ; energia:gas ?gas .
              ?s a energia:Stake ; energia:inConcession ?c ; energia:partner ?e ; energia:percent ?porcentaje .
              ?e energia:name ?empresa .
            } GROUP BY ?empresa ORDER BY DESC(?gas2025) LIMIT 5
    - texto: Tecpetrol declaró unos 6.900 millones de m³ de gas en 2025.
      lecturas:
        - nombre: El gas que declaró Tecpetrol en 2025
          tipo: numero
          valor: 6900
          divisor: 1000
          unidad: millones de m³
          consulta: |
            SELECT (SUM(?gas) AS ?gas2025) WHERE {
              ?p a energia:WellProduction ; energia:declaredBy ?e ; energia:gas ?gas .
              ?e energia:name ?nombre . FILTER(CONTAINS(UCASE(?nombre), "TECPETROL"))
            }
    - texto: YPF tenía reservas probadas de gas por 150 mil millones de m³ a fin de 2024.
      lecturas:
        - nombre: Las reservas probadas de YPF
          tipo: sin_datos
          falta: Rastro no tiene reservas. Tiene la producción declarada, las concesiones con sus socios, los venteos y los estudios ambientales.

externo:
  titulo: Enriquecer con datos de afuera (Wikidata)
  materializado: /ontology/energia/queries/cq15.rq
  consulta: /layer/energia/externo/wikidata.rq
  guardado: /layer/energia/externo/resultado-2026-10-20.csv
  fecha_guardado: 20 oct 2026
  intro: >-
    **Enriquecer** es sumarle a los datos propios lo que sabe otra fuente, sin perder de dónde vino cada dato.
    Una sola consulta une, en vivo, **Rastro** y **Wikidata**: las empresas con identificador global (LEI)
    y el petróleo de 2025 que les corresponde según sus socios (el mismo número del paso 1), con lo que Wikidata sabe de cada una (sede, en qué bolsa cotiza,
    dueño o matriz y sitio web). No se carga nada: Rastro y Wikidata usan el mismo LEI.
  conclusion: >-
    Que YPF y Pampa Energía cotizan en la Bolsa de Nueva York no está en ninguna de las seis fuentes de
    Rastro: llega de Wikidata en la misma consulta. Solo 3 de las 12 empresas con LEI lo tienen cargado en
    Wikidata; por nombre aparecen otras, pero ese cruce necesitaría revisión y el LEI no.
  columnas:
    empresa: Empresa
    su_parte_m3: Su parte del petróleo 2025 (m³)
    declara_m3: Declara como operadora (m³)
    sede_segun_wikidata: Sede (Wikidata)
    cotiza_en: Cotiza en (Wikidata)
    duenio_o_matriz: Dueño o matriz (Wikidata)
    sitio: Sitio web (Wikidata)
    lei: LEI
    wikidata: Wikidata

# «Por qué confiar»: los números salen de la evaluación (layer/energia/resultados.json) y de la
# prueba de cambio (layer/energia/cambio/resultado.json)
tarjetas:
  - titulo: Respuestas correctas
    valor: "{c_correct} de {n_questions}"
    compara: "Sin Rastro: {b_correct} de {n_questions}"
  - titulo: La misma pregunta, la misma respuesta
    valor: "{c_consistent} de {n_consistency}"
    compara: "Sin Rastro: {b_consistent} de {n_consistency}"
  - titulo: Si una fuente cambia, se arregla con
    valor: 1 línea
    compara: "Sin Rastro: reescribir {b_broken} consultas"
  - titulo: Cada respuesta se puede auditar
    valor: "{pct_evidencia}"
    compara: "de los {n_enlaces} enlaces entre fuentes guardan su fuente, su regla y su texto; y {cols_ok} de {cols} columnas de las respuestas dicen de qué fuente salen."

cambios:
  - titulo: Cambia cómo se escribe un valor
    que: La Secretaría de Energía publica una versión nueva del Capítulo IV y el petróleo pasa a estar en barriles.
    sql: UPDATE capitulo4.produccion SET prod_pet = prod_pet * 6.2898;
    antes: valores
    despues: valores-arreglado
    donde: "del mapeo (mappings/energia.r2rml.ttl)"
    arreglo:
      - "prod_pet AS petroleo_m3, prod_gas AS gas_mm3"
      - "prod_pet / 6.2898 AS petroleo_m3, prod_gas AS gas_mm3"
  - titulo: Cambia el nombre de una columna
    que: La Secretaría de Energía publica una versión nueva del Capítulo IV y la columna del petróleo cambia de nombre.
    sql: ALTER TABLE capitulo4.produccion RENAME COLUMN prod_pet TO petroleo;
    antes: renombrar
    despues: renombrar-arreglado
    donde: "del mapeo (mappings/energia.r2rml.ttl)"
    arreglo:
      - "prod_pet AS petroleo_m3, prod_gas AS gas_mm3"
      - "petroleo AS petroleo_m3, prod_gas AS gas_mm3"

# Rastro Lab: el mismo modelo de gas con y sin Rastro (app/lab.py, lab/gas/modelo.py)
lab: gas
fuera:                         # ¿dice cuándo no tiene el dato? lo mide layer/fuera.py
  archivo: /layer/energia/fuera/resultados.json
  intro: >-
    Preguntas del sector que los datos de Rastro no responden (precios, reservas, inversiones, 2026, empleo) y una de
    control que sí. Con la misma regla para todos («si los datos no alcanzan, decí qué falta»), ninguno inventó: todos
    dijeron qué faltaba. La diferencia está en la de control: sin datos no se puede responder; con datos, sí,
    y con su fuente.
calidad:                       # reglas de calidad (SHACL): ontology/energia/calidad/reglas.ttl, las comprueba `docker compose run --rm calidad`
  archivo: /layer/energia/calidad.json
  intro: >-
    Reglas sobre los datos integrados, escritas una vez con las palabras del diccionario y comprobadas después de cada
    carga, como los controles de calidad de una base de datos. Miran todas las fuentes juntas y también la evidencia.
    No arreglan nada: muestran qué no se cumple, dónde y qué predicciones de Rastro Lab usan ese dato (las que heredan
    el error). La primera vez encontraron 5 trayectorias de pozo sin evidencia; se arregló en un lugar, la regla que
    arma la evidencia. Las de valores imposibles marcan datos de la fuente para revisar, sin cambiarlos.
  tecnico: >-
    Las reglas de calidad están en SHACL, el estándar del W3C para validar un grafo. Rastro trae con CONSTRUCT solo lo
    que miran y las valida con pySHACL. Cada regla tiene un blanco (`sh:targetClass`, `sh:targetSubjectsOf`), sus
    condiciones (`sh:minCount`, `sh:maxInclusive`, `sh:pattern`, `sh:lessThanOrEquals`) y, si hace falta, una consulta
    SPARQL (`sh:sparql`). Las mismas reglas sirven en otras plataformas o herramientas de grafos de conocimiento.

faq:
  - pregunta: ¿De dónde salen los datos?
    respuesta: >-
      De seis fuentes públicas de cuatro organismos. De la Secretaría de Energía: las declaraciones juradas mensuales de
      producción de cada pozo en 2025 y el padrón de pozos (Capítulo IV, datos.energia.gob.ar), el
      servicio de mapas (WFS) con las concesiones, sus socios y los venteos de gas, y el listado de estudios
      ambientales presentados en cada concesión. Del mismo servicio,
      los gasoductos de transporte de ENARGAS. Del Instituto Geográfico Nacional (listado en IDERA), las
      localidades y las áreas protegidas. Y de GLEIF, el identificador global de las empresas. Se usa 2025
      porque el archivo de 2026 todavía no trae a todas las operadoras. Las de 2023 y 2024 se usan solo
      para ver quién operó cada concesión en el tiempo (los cambios de operadora).
  - pregunta: ¿Por qué los grupos (Chevron, Pluspetrol, CGC) son correcciones revisadas y no salen de un registro?
    respuesta: >-
      Porque ningún registro público los tiene: GLEIF no registra la matriz de ninguna de estas empresas
      argentinas, y las sociedades de Chevron no tienen LEI; Wikidata tampoco registra esas relaciones.
      Por eso son correcciones revisadas, con su motivo a la vista, y el LEI se usa como identificador de
      cada empresa.
  - pregunta: ¿Un posible venteo detectado por satélite es un incumplimiento?
    respuesta: >-
      No. Es una anomalía térmica que vio un satélite: un indicio para revisar. Además, la capa de puntos
      de venteo declarados puede estar desactualizada. Rastro sirve para saber en qué concesión cae cada
      punto y quién la opera, no para concluir que hay una falta.
  - pregunta: ¿Por qué la regla de la operadora es «rige la declaración jurada»?
    respuesta: >-
      Porque es lo que la empresa informa todos los meses. Es una decisión de negocio, escrita una vez y a
      la vista: si se prefiere otra, se cambia en un solo lugar y vale para todas las preguntas. En cada
      pozo donde las fuentes no coinciden, la evidencia muestra lo que dice el padrón.
  - pregunta: ¿Quién revisó las correcciones de nombres?
    respuesta: >-
      Las armó un asistente de IA (por ejemplo, que la socia de YPF en Loma Campana es la empresa de
      Chevron); falta que una persona las confirme. Están en linking/energia/correcciones.csv, con su motivo.
  - pregunta: ¿Se puede unir con datos de otras organizaciones, como Wikidata?
    respuesta: >-
      Sí, por el LEI, que Rastro y Wikidata usan igual. Una sola consulta en GraphDB une, en vivo y sin
      cargar nada, las empresas de Rastro con lo que Wikidata sabe de ellas: sede, bolsa en la que cotizan
      y sitio web. Así aparece que YPF y Pampa Energía cotizan en la Bolsa de Nueva York, un dato que no
      está en ninguna de las seis fuentes. Solo 3 de las 12 empresas con LEI lo tienen cargado en
      Wikidata (YPF, Pan American Energy y Pampa Energía). Detalle en layer/energia/externo/.
  - pregunta: Referencias
    respuesta: |-
      Un trabajo publicado une estas mismas fuentes públicas (producción por pozo, padrón, datos de fractura y
      trayectorias) para predecir el gas del primer año de 642 pozos de shale gas de Vaca Muerta. Rastro Lab lo usa
      para validar que su modelo da números razonables con los mismos datos: con el diseño de ese trabajo, la
      mediana por área da prácticamente lo mismo (R² 0,45 contra 0,47). Rastro Lab hace la misma predicción con
      otro objetivo: que cada predicción se explique en conceptos de negocio, con la fuente de cada dato.

      - Fernández Gazzaniga, A. (2025). «Predicción de productividad inicial en pozos de shale gas de Vaca Muerta
        mediante machine learning». [Tesis de maestría. Universidad Torcuato Di Tella]. Repositorio Digital
        Universidad Torcuato Di Tella. https://repositorio.utdt.edu/handle/20.500.13098/14415

      Las referencias sobre grafos de conocimiento están en «Referencias», en las preguntas para todos los casos.
  - pregunta: ¿Dónde está cada pieza?
    tecnico: true
    respuesta: >-
      Datos en Postgres, un esquema por fuente (`capitulo4`, `sig_energia`, `enargas`, `ign`, `gleif_energia`);
      empresas, socios, operadoras, venteos ubicados, gasoductos cercanos y entorno en el esquema `energia`
      (`linking/energia/`); un tercer Ontop en el puerto 8082 con su
      ontología (`ontology/energia/`) y sus mapeos (`mappings/energia.r2rml.ttl`). Cada enlace se expone con PROV-O.

# Configuración de la vista técnica; sin listas por dominio en Python.
technical:
  instances:
    'Una concesión: Loma Campana': https://w3id.org/rastro/energia/concession/LCAM
    'Una empresa: YPF': https://w3id.org/rastro/energia/company/YPF
    'Una participación (enlace con evidencia): Chevron en Loma Campana': https://w3id.org/rastro/energia/stake/LCAM/CHEVRON
    'La operadora de un pozo (enlace con evidencia): pozo 107709': https://w3id.org/rastro/energia/operatorlink/107709
    La producción de un pozo en diciembre de 2025: https://w3id.org/rastro/energia/production/107709/12/BEH/YPF
    Un posible venteo visto por satélite: https://w3id.org/rastro/energia/venting/sensoresremotos_venteos_detectados.61105
    Dónde cae ese venteo (enlace con evidencia): https://w3id.org/rastro/energia/locationlink/sensoresremotos_venteos_detectados.61105
  pieces:
    mapeos: /mappings/energia.r2rml.ttl
    enlaces:
    - - Paso 1 · Los socios de cada concesión, separados del texto del mapa
      - "SELECT c.nombre AS concesion, e.nombre AS socia, p.porcentaje, p.texto AS\
        \ evidencia\n                FROM energia.participacion p JOIN energia.concesion\
        \ c USING (id_concesion) JOIN energia.empresa e USING (empresa_id)\n     \
        \           WHERE c.nombre IN ('LOMA CAMPANA', 'LA AMARGA CHICA', 'BANDURRIA\
        \ SUR') ORDER BY 1, 3 DESC"
    - - Paso 1 · La misma empresa, escrita distinto en cada fuente
      - "SELECT n.fuente, n.nombre AS nombre_en_la_fuente, e.nombre AS empresa, n.regla\n\
        \                FROM energia.empresa_nombre n JOIN energia.empresa e USING\
        \ (empresa_id)\n                WHERE e.nombre IN ('COMPAÑIA GENERAL DE COMBUSTIBLES',\
        \ 'CHEVRON', 'PLUSPETROL') ORDER BY 3, 1, 2"
    - - Paso 2 · Quién opera cada pozo (pozos donde el padrón dice otra cosa)
      - "SELECT o.idpozo AS pozo, e.nombre AS operadora, o.empresa_padron AS segun_el_padron,\
        \ o.regla, o.evidencia\n                FROM energia.operador_pozo o JOIN\
        \ energia.empresa e USING (empresa_id)\n                WHERE o.empresa_padron\
        \ IS NOT NULL AND upper(o.empresa_padron) NOT LIKE upper(left(e.nombre, 6))\
        \ || '%'\n                ORDER BY o.idpozo LIMIT 6"
    - - Paso 3 · En qué concesión cae cada posible venteo (La Calera)
      - "SELECT v.id AS venteo, v.fecha, v.satelite, c.nombre AS concesion, v.evidencia\n\
        \                FROM energia.venteo v JOIN energia.concesion c USING (id_concesion)\n\
        \                WHERE v.tipo = 'detectado' AND c.nombre = 'LA CALERA' ORDER\
        \ BY v.fecha DESC LIMIT 6"
    mapas:
    - - Paso 1 · Participación, nombres de empresa y producción
      - - Stake
        - CompanyName
        - WellProductionAmounts
    - - Paso 2 · La operadora de cada pozo
      - - OperatorLink
    - - Paso 3 · El venteo y su concesión
      - - DetectedVenting
        - LocationLink
  map:
    queries:
      concessions: "PREFIX geo: <http://www.opengis.net/ont/geosparql#>\nSELECT ?name\
        \ ?operator ?wkt (COUNT(DISTINCT ?d) AS ?n) (SAMPLE(?why) AS ?reason) WHERE\
        \ {\n        ?c a energia:Concession ; energia:name ?name ; geo:asWKT ?wkt\
        \ .\n        OPTIONAL { ?c energia:operatorOnMap/energia:name ?operator }\n\
        \        OPTIONAL { ?d a energia:DetectedVenting ; energia:inConcession ?c\
        \ }\n        OPTIONAL { ?c a energia:ConcessionToReview ; energia:reviewReason\
        \ ?why }\n    } GROUP BY ?name ?operator ?wkt"
      points: 'PREFIX geo: <http://www.opengis.net/ont/geosparql#>

        SELECT ?wkt WHERE { ?d a energia:DetectedVenting ; geo:asWKT ?wkt }'
      pipes: 'PREFIX geo: <http://www.opengis.net/ont/geosparql#>

        SELECT ?name ?wkt WHERE { ?p a energia:Pipeline ; energia:name ?name ; geo:asWKT
        ?wkt }'
    view_state:
      latitude: -38.4
      longitude: -68.9
      zoom: 6.4
    tooltip: <b>{nombre}</b><br>{operadora}<br>{venteos} posibles venteos<br>{revisar}
    caption: 'Puntos rojos: posibles venteos vistos por satélite desde 2024. Líneas
      ámbar: gasoductos de transporte (ENARGAS). Concesiones en rojo: para revisar,
      según la regla del diccionario; en azul, con posibles venteos. Todo sale de
      Rastro, con geometrías en el estándar de OGC (GeoSPARQL).'


# Two walkthroughs on real data, read live. Each says what it is for and which part of Rastro each step shows.
ejemplo_integracion:
  titulo: Paso a paso
  encabezado: Cómo Rastro une los datos, con un pozo y una empresa reales
  para_que: >-
    Mostrar con un caso real cómo Rastro hace de tablas que no se hablan una respuesta que se puede auditar:
    el mismo pozo en dos tablas, la misma empresa con dos nombres, y una respuesta que vuelve a sus registros.
    Es lo que en SQL habría que resolver a mano en cada consulta.
  aviso: >-
    Datos reales, consultados ahora: el pozo 164166 de la Compañía General de Combustibles (CGC), en Cañadón Seco,
    Santa Cruz. Cada número sale de la consulta que se muestra en el paso.
  selector: Elegí un paso
  pasos:
    - titulo: 1 · Un pozo, dos tablas
      parte: >-
        Diccionario y mapeos: cada fuente se traduce a los mismos conceptos de negocio (Pozo, Empresa, Producción),
        sin cambiar los datos originales.
      contenido: |
        Las declaraciones juradas de producción y el padrón de pozos describen el mismo pozo con columnas distintas
        y nombran a la empresa de otra forma. Rastro los une por el **identificador oficial del pozo** (`idpozo`),
        el que la Secretaría de Energía usa en las dos tablas: no por parecido del nombre.
      consultas:
        - titulo: Lo que dice el padrón de pozos (tal como viene)
          sql: >-
            SELECT idpozo, sigla, empresa, area, provincia FROM capitulo4.pozo WHERE idpozo = '164166'
        - titulo: Lo que dicen las declaraciones juradas (los dos primeros meses de 2025, tal como vienen)
          sql: >-
            SELECT idpozo, mes, empresa, areapermisoconcesion AS concesion, prod_gas AS gas_miles_m3
            FROM capitulo4.produccion WHERE idpozo = '164166' ORDER BY mes LIMIT 2
        - titulo: Lo que sabe Rastro de ese pozo (un solo Pozo, con su operadora)
          sparql: >-
            SELECT ?pozo ?operadora (COUNT(?declaracion) AS ?declaraciones) WHERE {
              <https://w3id.org/rastro/energia/well/164166> energia:wellId ?pozo ;
                  energia:operator/energia:name ?operadora .
              ?declaracion energia:well <https://w3id.org/rastro/energia/well/164166> .
            } GROUP BY ?pozo ?operadora
    - titulo: 2 · Una empresa, dos nombres
      parte: >-
        Enlaces con evidencia: cada unión dice su regla, su evidencia y de qué fuente sale (PROV-O). Las revisadas por
        un asistente de IA esperan la confirmación de una persona, y la app lo dice.
      contenido: |
        Las declaraciones nombran a la empresa **CGC ENERGIA SAU**; el padrón y el mapa de concesiones,
        **COMPAÑÍA GENERAL DE COMBUSTIBLES S.A.** Ningún código común las une. Una **corrección revisada** dice que son
        la misma empresa y por qué. Está revisada por un asistente de IA y espera que una persona la confirme.
      consultas:
        - titulo: Cada nombre, en cada fuente, con su regla y su evidencia
          sparql: >-
            SELECT ?nombre ?fuente ?regla ?evidencia WHERE {
              ?n a energia:CompanyName ; energia:company ?c ; energia:nameInSource ?nombre ; energia:rule ?regla ;
                 energia:sourceText ?evidencia ; prov:wasDerivedFrom ?f .
              ?c energia:name "COMPAÑIA GENERAL DE COMBUSTIBLES" .
              BIND (STRAFTER(STR(?f), "/source/") AS ?fuente)
            } ORDER BY ?nombre ?fuente
    - titulo: 3 · La respuesta y su origen
      parte: >-
        La respuesta: una consulta sobre el diccionario. De cada número se vuelve a sus registros y a los enlaces
        que lo sostienen (lo que mide «Por qué confiar»).
      contenido: |
        **¿Cuánto gas declaró en 2025 la Compañía General de Combustibles?**

        En las declaraciones juradas, la empresa aparece con **los dos nombres**. Una consulta SQL que busca uno solo
        encuentra una parte. Con Rastro, la producción de los dos nombres es de una sola empresa, y el porqué es el
        enlace del paso 2.
      consultas:
        - titulo: "Sin Rastro: lo que encuentra cada nombre en las declaraciones"
          sql: >-
            SELECT empresa, count(*) AS declaraciones, round(sum(prod_gas)::numeric, 1) AS gas_miles_m3
            FROM capitulo4.produccion
            WHERE empresa ILIKE '%general de combustibles%' OR empresa ILIKE 'cgc%' GROUP BY empresa ORDER BY empresa
        - titulo: "Con Rastro: una sola empresa"
          sparql: >-
            SELECT (COUNT(?p) AS ?declaraciones) (ROUND(SUM(?g) * 10) / 10 AS ?gas_miles_m3) WHERE {
              ?p a energia:WellProduction ; energia:declaredBy ?c ; energia:gas ?g .
              ?c energia:name "COMPAÑIA GENERAL DE COMBUSTIBLES" .
            }

ejemplo_lab:
  titulo: Paso a paso · Del dato a la explicación
  encabezado: Cómo Rastro Lab predice el gas de un pozo y explica el número
  para_que: >-
    Mostrar qué recibe el modelo, cómo calcula y de dónde sale cada parte de la explicación, con el mismo pozo real
    que abre esta pestaña. Responde a la duda más común: el modelo no lee la ontología; recibe una tabla armada con
    los conceptos de Rastro, y cada número de la explicación vuelve a sus registros.
  aviso: >-
    Datos reales: el pozo de ejemplo de esta pestaña y la corrida actual del modelo. El cálculo del paso 3 sale del
    modelo, en vivo.
  selector: Elegí un paso
  pasos:
    - titulo: 1 · Dar significado a las fuentes
      parte: >-
        Diccionario, mapeos y enlaces: las variables del modelo salen de conceptos de Rastro (Inicio del pozo,
        Fractura, Trayectoria, Participación), con la concesión y la empresa ya unidas.
      contenido: |
        Las fuentes se cargan tal como vienen. Los enlaces identifican el pozo, la concesión y las empresas, con su
        regla y su evidencia, y los mapeos exponen esos registros con el diccionario. No se etiqueta a mano cada fila.

        **Tablas de origen → enlaces con evidencia → mapeos al diccionario → consulta → tabla para el modelo.**

        | Dato de origen | Significado en Rastro | Uso en el modelo |
        |---|---|---|
        | Declaración de producción | Inicio del pozo y gas observado | Cohorte, fecha de corte y objetivo |
        | Parte de fractura | Largo de rama, etapas, arena, agua y presión | Variables numéricas |
        | Trayectoria del pozo | Profundidad vertical | Variable numérica |
        | Concesión y socios | Concesión, empresa y participación | Variables de contexto |
      lenguaje: python
      tecnico: |
        # Implemented in lab/gas/modelo.py:
        # SPARQL_B selects WellStart, Fracturing, WellTrajectory and Stake.
        # Ontop translates the query through mappings/energia.r2rml.ttl.
        # preparar(gas, a, b) converts its result into aligned DataFrames.
        # The ridge model consumes columns, not RDF triples or ontology classes.
    - titulo: 2 · Preparar y entrenar
      parte: >-
        Rastro Lab: el mismo modelo, entrenado dos veces (con las tablas tal como vienen y con Rastro), sin usar el
        futuro.
      contenido: |
        Cada fila es un pozo elegible, con su identificador y su fecha de inicio. **Objetivo:** el gas acumulado de los
        meses 2 a 7 desde que empezó, en millones de m³. Ese gas sirve para entrenar y comprobar; no entra como variable.

        Se entrena con los pozos que empezaron antes de 2025 y se prueba con los de 2025. Las categorías pasan a
        columnas numéricas, lo que falta se completa con el promedio del entrenamiento, y se ajusta una regresión lineal
        regularizada. La fractura se toma según el inicio del pozo, y se guarda cuándo se cargó, para marcar lo que
        llegó después.
      lenguaje: python
      tecnico: |
        # Actual training calculation, simplified variable names:
        training = df.inicio < PRUEBA  # PRUEBA = 2025-01-01
        # Numeric missing values: training means only.
        # Categories: one-hot encoding.
        # Coefficients: ridge regression, alpha = 1.0.
        # Observed gas is the target; explanatory columns are VARIABLES["B"].
    - titulo: 3 · Explicar el número
      parte: >-
        La explicación: una base y lo que suma o resta cada concepto del diccionario, calculado por el modelo, no
        escrito por una IA.
      contenido: |
        **¿De dónde sale la fórmula?** Rastro Lab usa una **regresión lineal**, el modelo más simple que se puede
        leer entero. Para un pozo:

        **gas predicho = gas promedio del entrenamiento + Σ coeficiente × (valor del pozo − valor promedio)**

        Los **coeficientes** se aprenden con los pozos que empezaron antes de 2025. Son los números que hacen que esa
        suma se acerque lo más posible al gas que esos pozos dieron de verdad, con una pequeña penalización (*ridge*)
        para que ninguno se dispare. Una vez aprendidos quedan fijos, y se aplican a los pozos de 2025.

        Se lee así: un pozo igual al promedio recibe el promedio, y cada diferencia con el promedio, multiplicada por
        su coeficiente, suma o resta. La concesión y la operadora son categorías, así que el modelo aprende un efecto
        para cada una.

        Abajo, **la cuenta completa del pozo de ejemplo**, variable por variable, y la misma cuenta agrupada como la
        muestra la explicación. Un coeficiente solo puede parecer raro (por ejemplo, uno negativo en el largo de la
        rama): las variables de la fractura cambian juntas y el modelo reparte su efecto entre ellas. Por eso la
        explicación las suma en «cómo se fracturó el pozo». Dice cómo llegó el modelo al número; no prueba causas.
      calculo_pozo: true
      lenguaje: python
      tecnico: |
        # lab/gas/modelo.py: ajustar() fits the ridge model; entrenar() and detalle() use the same fit.
        coef = solve(xc.T @ xc + alpha * I, xc.T @ (gas - media_y))   # xc: training inputs minus their average
        aportes = (x - media_x) * coef
        pred = media_y + aportes.sum(axis=1)
        # The explanation groups the contributions: UBICACION, FRACTURA_B, PROFUNDIDAD_B.
    - titulo: 4 · Abrir la evidencia
      parte: >-
        Trazabilidad (PROV-O): cada predicción publicada guarda la corrida, lo que sumó cada factor y los registros
        que usó, y se consulta como cualquier dato de Rastro.
      contenido: |
        Cuando se publica una corrida del modelo, Rastro guarda cada predicción como un dato más: la corrida que la
        generó, lo que sumó cada factor y **los registros de origen que usó** (`prov:used`). Abajo, la predicción
        publicada del pozo de ejemplo, consultada ahora:

        1. el número y su rango;
        2. sus factores, tal como quedaron guardados (los mismos del paso 3);
        3. cada registro que usó, con la regla que lo eligió, su evidencia y su fuente.

        Así, del gas predicho se llega a las declaraciones de gas del pozo, a la fractura que informó la operadora (y
        cuándo se cargó), a la trayectoria y a la participación en la concesión.
      consultas:
        - titulo: La predicción publicada (corrida vigente, millones de m³)
          sparql: >-
            SELECT ?prediccion ?minimo ?maximo ?corrida WHERE {
              ?p a energia:Prediction ; energia:aboutWell <https://w3id.org/rastro/energia/well/{pozo_ejemplo}> ;
                 prov:wasGeneratedBy ?run ; energia:predictedGas ?prediccion ; energia:predictedLow ?minimo ;
                 energia:predictedHigh ?maximo .
              ?run energia:current true .
              BIND (STRAFTER(STR(?run), "/modelrun/") AS ?corrida)
            }
        - titulo: Lo que sumó cada factor, guardado con la predicción
          sparql: >-
            SELECT ?factor ?aporte WHERE {
              ?p a energia:Prediction ; energia:aboutWell <https://w3id.org/rastro/energia/well/{pozo_ejemplo}> ;
                 prov:wasGeneratedBy ?run .
              ?run energia:current true .
              ?c energia:ofPrediction ?p ; energia:factor ?factor ; energia:amount ?aporte .
            } ORDER BY ?factor
        - titulo: Los registros que usó, con su regla, su evidencia y su fuente
          sparql: >-
            SELECT ?registro ?regla ?evidencia ?fuente ?cargado WHERE {
              ?p a energia:Prediction ; energia:aboutWell <https://w3id.org/rastro/energia/well/{pozo_ejemplo}> ;
                 prov:wasGeneratedBy ?run ; prov:used ?r .
              ?run energia:current true .
              VALUES (?tipo ?registro) { (energia:WellStart "Inicio del pozo") (energia:Fracturing "Fractura informada")
                                         (energia:WellTrajectory "Trayectoria") (energia:Stake "Participación en la concesión") }
              ?r a ?tipo ; energia:rule ?regla ; energia:sourceText ?evidencia ; prov:wasDerivedFrom ?src .
              FILTER (STRSTARTS(STR(?src), "https://w3id.org/rastro/source/"))
              BIND (STRAFTER(STR(?src), "/source/") AS ?fuente)
              OPTIONAL { ?r energia:loadedOn ?cargado }
            } ORDER BY ?registro
      lenguaje: turtle
      tecnico: |
        # How a published prediction is exposed (identifiers from the current run).
        @prefix energia: <https://w3id.org/rastro/energia#> .
        @prefix prov: <http://www.w3.org/ns/prov#> .
        # Prediction --energia:aboutWell--> Well;  --prov:wasGeneratedBy--> ModelRun (energia:current true)
        # Prediction --prov:used--> WellStart, Fracturing, WellTrajectory, Stake (each with rule, sourceText, source)
        # Contribution --energia:ofPrediction--> Prediction (energia:factor, energia:amount)
        # Storage: lab_gas.corrida, entrada, prediccion, aporte.
