<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .lane-title { font-size: 15px; font-weight: 700; fill: #222; }
      .t { font-size: 13px; fill: #222; }
      .b { font-size: 13px; font-weight: 700; fill: #222; }
      .s { font-size: 11.5px; fill: #555; }
      .arrow { stroke: #555; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="600" rx="14" fill="#ffffff"/>

  <!-- encabezados de columna -->
  <text x="85" y="28" text-anchor="middle" class="s">PREGUNTA</text>
  <text x="275" y="28" text-anchor="middle" class="s">QUÉ HACE EL LLM</text>
  <text x="575" y="28" text-anchor="middle" class="s">SOBRE QUÉ RESPONDE</text>
  <text x="885" y="28" text-anchor="middle" class="s">RESPUESTA</text>

  <!-- ================= A. LLM solo ================= -->
  <rect x="10" y="40" width="980" height="120" rx="10" fill="#fbecec"/>
  <text x="24" y="62" class="lane-title">A · LLM solo</text>

  <rect x="24" y="78" width="122" height="62" rx="8" fill="#fff" stroke="#bbb"/>
  <text x="85" y="114" text-anchor="middle" class="t">Pregunta</text>

  <rect x="180" y="78" width="190" height="62" rx="8" fill="#fff" stroke="#c96b6b"/>
  <text x="275" y="104" text-anchor="middle" class="b">Responde de memoria</text>
  <text x="275" y="124" text-anchor="middle" class="s">lo que aprendió al entrenarse</text>

  <rect x="404" y="78" width="342" height="62" rx="8" fill="none" stroke="#c96b6b" stroke-dasharray="5,4"/>
  <text x="575" y="114" text-anchor="middle" class="s">sin acceso a datos</text>

  <rect x="780" y="78" width="200" height="62" rx="8" fill="#fff" stroke="#c96b6b"/>
  <text x="880" y="102" text-anchor="middle" class="b">5 de 20 correctas</text>
  <text x="880" y="122" text-anchor="middle" class="s">números inventados, sin fuente</text>

  <path d="M146,109 L176,109" class="arrow"/>
  <path d="M370,109 C560,62 600,62 776,109" class="arrow"/>

  <!-- ================= B. LLM + SQL crudo ================= -->
  <rect x="10" y="172" width="980" height="150" rx="10" fill="#fdf3e1"/>
  <text x="24" y="194" class="lane-title">B · LLM + SQL crudo</text>

  <rect x="24" y="214" width="122" height="78" rx="8" fill="#fff" stroke="#bbb"/>
  <text x="85" y="258" text-anchor="middle" class="t">Pregunta</text>

  <rect x="180" y="206" width="190" height="94" rx="8" fill="#fff" stroke="#d99a2b"/>
  <text x="275" y="230" text-anchor="middle" class="b">Escribe SQL y resuelve</text>
  <text x="275" y="248" text-anchor="middle" class="b">los cruces sobre la marcha</text>
  <text x="275" y="270" text-anchor="middle" class="s">adivina qué fármaco nombra</text>
  <text x="275" y="286" text-anchor="middle" class="s">cada ensayo, en cada consulta</text>

  <rect x="404" y="214" width="342" height="78" rx="8" fill="#fff" stroke="#d99a2b"/>
  <text x="575" y="242" text-anchor="middle" class="b">Tablas tal como vienen</text>
  <text x="575" y="262" text-anchor="middle" class="t">AACT · ChEMBL · openFDA · MeSH</text>
  <text x="575" y="281" text-anchor="middle" class="s">Postgres, sin enlaces entre ellas</text>

  <rect x="780" y="206" width="200" height="94" rx="8" fill="#fff" stroke="#d99a2b"/>
  <text x="880" y="230" text-anchor="middle" class="b">18 de 20 correctas</text>
  <text x="880" y="252" text-anchor="middle" class="s">el cruce cambia en cada pregunta</text>
  <text x="880" y="268" text-anchor="middle" class="s">(4 formas en 20 preguntas)</text>
  <text x="880" y="284" text-anchor="middle" class="s">errores que no avisan, sin fuente</text>

  <path d="M146,253 L176,253" class="arrow"/>
  <path d="M370,253 L400,253" class="arrow"/>
  <path d="M746,253 L776,253" class="arrow"/>

  <!-- ================= C. LLM + Rastro ================= -->
  <rect x="10" y="334" width="980" height="256" rx="10" fill="#e8f5ec"/>
  <text x="24" y="356" class="lane-title">C · LLM + Rastro</text>

  <rect x="24" y="420" width="122" height="78" rx="8" fill="#fff" stroke="#bbb"/>
  <text x="85" y="464" text-anchor="middle" class="t">Pregunta</text>

  <rect x="180" y="412" width="190" height="94" rx="8" fill="#fff" stroke="#3f9a5c"/>
  <text x="275" y="438" text-anchor="middle" class="b">Escribe una consulta</text>
  <text x="275" y="456" text-anchor="middle" class="b">sobre conceptos</text>
  <text x="275" y="478" text-anchor="middle" class="s">lee la ontología como contexto:</text>
  <text x="275" y="494" text-anchor="middle" class="s">«ensayo prueba fármaco»…</text>

  <!-- capa Rastro -->
  <rect x="404" y="368" width="342" height="210" rx="10" fill="#fff" stroke="#3f9a5c" stroke-width="2"/>
  <text x="575" y="390" text-anchor="middle" class="b">Rastro</text>

  <rect x="420" y="402" width="310" height="44" rx="6" fill="#f2faf4" stroke="#9fd0ad"/>
  <text x="575" y="420" text-anchor="middle" class="b">Ontología: el vocabulario de negocio</text>
  <text x="575" y="437" text-anchor="middle" class="s">ensayo · fármaco · target · sponsor · evento adverso</text>

  <rect x="420" y="454" width="310" height="44" rx="6" fill="#f2faf4" stroke="#9fd0ad"/>
  <text x="575" y="472" text-anchor="middle" class="b">Ontop traduce la consulta a SQL</text>
  <text x="575" y="489" text-anchor="middle" class="s">los mapeos unen columnas que significan lo mismo</text>

  <rect x="420" y="506" width="310" height="60" rx="6" fill="#f2faf4" stroke="#9fd0ad"/>
  <text x="575" y="524" text-anchor="middle" class="b">Enlaces ya resueltos y revisados</text>
  <text x="575" y="541" text-anchor="middle" class="s">entity linking hecho una vez: 98-99 % de precisión</text>
  <text x="575" y="557" text-anchor="middle" class="s">AACT · ChEMBL · openFDA en Postgres · MeSH en una base de grafos</text>

  <path d="M575,446 L575,452" class="arrow"/>
  <path d="M575,498 L575,504" class="arrow"/>

  <rect x="780" y="412" width="200" height="94" rx="8" fill="#fff" stroke="#3f9a5c"/>
  <text x="880" y="436" text-anchor="middle" class="b">20 de 20 correctas</text>
  <text x="880" y="458" text-anchor="middle" class="s">la misma definición siempre</text>
  <text x="880" y="474" text-anchor="middle" class="s">más rápido, sin reintentos</text>
  <text x="880" y="490" text-anchor="middle" class="s">cada columna con su fuente</text>

  <path d="M146,459 L176,459" class="arrow"/>
  <path d="M370,459 L400,459" class="arrow"/>
  <path d="M746,459 L776,459" class="arrow"/>
</svg>
