# Preguntas frecuentes de la demo. Respuestas cortas, en palabras simples.
# Los valores entre llaves ({secs_b}, {reinvented}...) los completa la app con los
# números de la evaluación guardada.

- question: ¿Qué es Rastro?
  answer: |-
    Una **capa semántica**: integra cuatro fuentes públicas de oncología y las describe con conceptos de negocio: ensayo, fármaco, target, sponsor, evento adverso. Un LLM pregunta sobre esos conceptos en lugar de adivinar cómo se cruzan las tablas, y cada respuesta dice de dónde viene.

    Técnicamente es un **Virtual Knowledge Graph** (VKG), también llamado acceso a datos basado en ontologías (OBDA): una **ontología** con el vocabulario del dominio, **mapeos** que la conectan con las fuentes, y un grafo **virtual**, que se consulta sin copiar los datos a otro lado. Usa los estándares del W3C para eso: RDF, OWL, R2RML y SPARQL.

    Es un VKG pragmático: las fuentes se cargan primero en Postgres, y los enlaces y la jerarquía de MeSH quedan precalculados en tablas. Sobre eso, el grafo es virtual.

- question: ¿Qué pasa cuando hago una pregunta?
  answer: |-
    1. El LLM recibe la ontología de Rastro como contexto y traduce la pregunta a una consulta SPARQL sobre esos conceptos.
    2. Rastro la convierte en SQL y la ejecuta en vivo sobre las fuentes, sin copiarlas.
    3. Ves la respuesta, las fuentes que usó y la fuente de cada columna. En «¿Cómo lo supe?» están la consulta y el SQL exactos.

- question: ¿Cómo sabe el LLM qué conceptos usar?
  answer: |-
    Porque recibe la **ontología** como contexto: la lista de conceptos (ensayo, fármaco, target, sponsor, evento adverso), cómo se relacionan y qué significa cada uno. Con eso escribe la consulta SPARQL.

    Es una fuente de confianza: el LLM no inventa cómo se cruzan las tablas ni qué es un «fármaco», usa definiciones ya hechas y revisadas. Y la consulta queda a la vista en «¿Cómo lo supe?»: es corta y en palabras de negocio, así que alguien puede revisarla.

    Lo que no garantiza: el LLM todavía puede elegir mal un concepto o un filtro. Por eso se muestra la consulta.

    En cambio, con el SQL directo el LLM solo ve nombres de tablas y columnas, y tiene que deducir el resto en cada pregunta.

- question: ¿De dónde salen los datos y dónde están guardados?
  answer: |-
    - 🐘 **AACT** (ensayos de ClinicalTrials.gov), **ChEMBL** (fármacos y targets) y **openFDA** (eventos adversos) están en Postgres.
    - 🕸️ **MeSH** (enfermedades y sus subtipos) está completo en GraphDB. Rastro usa una copia de su jerarquía en Postgres.

    Las consultas corren en vivo sobre Postgres: Ontop traduce cada pregunta a SQL.

- question: ¿Necesito un LLM o una API key?
  answer: >-
    Para las 20 preguntas de ejemplo, no: usan consultas ya escritas por el LLM, que se
    ejecutan en vivo. Para preguntas propias hace falta un LLM: la Claude API (de pago
    por uso) u Ollama, gratis en la propia computadora. Ver layer/README.md.

- question: Si el SQL directo acierta 18 de 20 y Rastro 20, ¿cuál es la ventaja?
  answer: |-
    La diferencia no está en cuántas acierta, sino en cuánto podés confiar en cada respuesta:
    - **Definiciones distintas en cada respuesta.** En {reinvented} de 20 preguntas, el SQL directo tuvo que inventar cómo reconocer un fármaco, y lo hizo de {n_methods} formas distintas. Rastro usa siempre el mismo enlace, revisado a mano.
    - **Errores que no avisan.** Sus respuestas incorrectas parecen razonables (488 ensayos en vez de 438).
    - **Más lento y más frágil.** Sus 20 consultas tardan {secs_b} s y {retries_b} necesitaron reintento; las de Rastro, {secs_c} s y {retries_c} reintentos.
    - **Procedencia.** Rastro dice de qué fuente sale cada dato.

- question: ¿Por qué Rastro acierta donde el SQL directo falla?
  answer: |-
    Porque Rastro ya sabe **qué fármaco prueba cada ensayo**, y el SQL directo lo tiene que adivinar en cada consulta.

    ClinicalTrials.gov no dice "este ensayo prueba el fármaco X". Dice, en el texto que escribió cada sponsor, «Pembrolizumab 200 mg», «MK-3475» o «Keytruda». Para responder "¿cuántos ensayos prueban fármacos anti-EGFR?" primero hay que convertir ese texto en un fármaco concreto. El SQL directo lo improvisa en cada consulta, y ahí se equivoca: buscando pedazos de nombres, «humab» coincidió con «rhuMAb HER2» (trastuzumab, que no es anti-EGFR).

- question: ¿Qué problemas de integración resuelve Rastro?
  answer: |-
    Las fuentes son **heterogéneas** de cuatro formas (según la clasificación del tutorial de Virtual Knowledge Graphs de Calvanese, Cogrel y Lanti, Ontobras 2022), y Rastro aborda las cuatro:

    | Heterogeneidad | Ejemplo en Rastro | Cómo la resuelve |
    |---|---|---|
    | **De modelo de datos** | AACT y ChEMBL son tablas, openFDA es JSON y MeSH es RDF | Los cargadores las llevan a Postgres y a GraphDB |
    | **De sistema** | AACT en un Postgres en la nube, ChEMBL y openFDA por API, MeSH como archivo | Un cargador por fuente |
    | **De esquema** | openFDA dice `query_id`, ChEMBL `chembl_id`, y ambos son «Fármaco» | **Ontología y mapeos R2RML** |
    | **De datos** | «Pembrolizumab 200 mg», «MK-3475» y «Keytruda» son el mismo fármaco | **Entity linking**, hecho una vez y revisado |

    El SQL directo tiene que resolver las dos últimas dentro de cada consulta, y de ahí vienen sus errores y su lentitud. Las dos preguntas siguientes explican cada una.

- question: ¿Cómo sabe Rastro qué fármaco prueba cada ensayo?
  answer: |-
    Con **entity linking** (vinculación de entidades), que resuelve la **heterogeneidad de datos**: cada mención de un fármaco en el texto de un ensayo se conecta con una entrada de una base de conocimiento, ChEMBL. Lo hace un programa, una sola vez, para las 130.000 intervenciones.

    **Entrada**, en AACT: `NCT05563467 · «Pembrolizumab 25 MG/ML [Keytruda]»`

    **Salida**, en la tabla de enlaces: `NCT05563467 · CHEMBL3137343 (pembrolizumab)`

    Es el tipo más simple, **por diccionario**: compara el texto con los nombres y sinónimos de ChEMBL, en tres pasos.
    1. **Encontrar la mención:** separar combinaciones y buscar palabras o frases de hasta 4 palabras.
    2. **Buscar candidatos:** compararlas con los nombres de ChEMBL, sin mayúsculas, puntuación ni dosis.
    3. **Desambiguar:** si un nombre apunta a varios fármacos, gana el nombre más largo, el nombre oficial de un fármaco le gana al sinónimo de otro, y las palabras genéricas no cuentan.

    Ejemplos reales de cada regla:

    | Qué dice el ensayo | Regla | Resultado |
    |---|---|---|
    | «Trastuzumab» | nombre exacto | trastuzumab |
    | «MK-3475», «PTK787» | sinónimo de ChEMBL | pembrolizumab, vatalanib |
    | alias en AACT: «Taxotere» | alias | docetaxel |
    | «Carboplatin + Paclitaxel» | combinación | carboplatino y paclitaxel |
    | «FOLFOX» | régimen conocido | fluorouracilo, leucovorina y oxaliplatino |
    | «Pembrolizumab 200 mg» | nombre como palabra entera | pembrolizumab |
    | «albumin-bound paclitaxel» | sin palabras genéricas | paclitaxel, no «albumin» |
    | «rhuMAb HER2» | alias de trastuzumab | trastuzumab, que actúa sobre HER2: no cuenta como anti-EGFR |

    Revisado a mano sobre muestras al azar: **98-99 % de los enlaces son correctos**. Un entity linking más sofisticado usaría el contexto, con un modelo o un LLM. Acá no hizo falta, porque los nombres de fármacos son muy específicos. Las reglas están en linking/drugs.sql y la revisión, en linking/review-2026-10-16.md.

- question: ¿Cómo junta Rastro columnas distintas que significan lo mismo?
  answer: |-
    Es la **heterogeneidad de esquemas**, y la resuelven la ontología y los **mapeos** (R2RML). Cada fuente llama a las cosas a su manera: openFDA identifica un fármaco con `query_id`, ChEMBL con `chembl_id`, y los enlaces con `parent_chembl_id`. Los mapeos dicen que todas esas columnas son **el mismo concepto**, así que en Rastro hay un solo «Fármaco», con sus ensayos, sus targets y sus eventos adversos juntos.

    Esta tabla sale directamente de los mapeos (mappings/rastro.r2rml.ttl):

    {unified_columns}

    Las condiciones usan los mismos identificadores que MeSH (`http://id.nlm.nih.gov/mesh/...`), así que un descriptor en Postgres y el mismo descriptor en GraphDB son la misma entidad.

- question: Si Ontop y los mapeos resuelven los cruces, ¿para qué la tabla de enlaces?
  answer: |-
    Porque los mapeos resuelven la heterogeneidad **de esquema**, no la **de datos**.

    Ontop une dos tablas cuando comparten un **valor igual**: el `query_id` de openFDA y el `chembl_id` de ChEMBL valen los dos «CHEMBL941», así que la unión es automática. Pero entre AACT y ChEMBL no hay un valor en común: AACT dice «Pembrolizumab 200 mg» y ChEMBL dice `CHEMBL3137343`. Ningún mapeo puede inventar esa igualdad.

    El entity linking **crea** la clave que falta (ensayo → `CHEMBL3137343`). Desde ahí, el mapeo y Ontop hacen el resto. Se calcula una vez porque, dentro del mapeo, Ontop tendría que comparar texto contra 130.000 intervenciones en cada pregunta. Más detalle en docs/integracion.md.

- question: ¿Rastro vincula otras cosas, además de los fármacos?
  answer: |-
    Sí, con la misma idea:
    - **Condición del ensayo → MeSH:** el término de AACT se conecta con el descriptor de MeSH de igual nombre. Así "cáncer de pulmón" incluye todos sus subtipos.
    - **Sales y prodrogas → un fármaco:** el mesilato de imatinib es imatinib, y el acetato de abiraterona actúa como la abiraterona. Esto es más bien **resolución de entidades**: decidir que dos registros de la misma base son lo mismo.

- question: ¿Qué otras formas de hacer entity linking hay, y por qué Rastro usa esta?
  answer: |-
    | Forma | Cómo funciona | A favor | En contra |
    |---|---|---|---|
    | **Diccionario y reglas** (Rastro) | Compara el texto con nombres y sinónimos conocidos | Simple, rápido, explicable y repetible | No encuentra lo que no está en el diccionario |
    | **Coincidencia aproximada** (fuzzy) | Tolera diferencias de escritura («pembrolizumb») | Atrapa errores de tipeo | Confunde nombres parecidos (vinblastina y vincristina) |
    | **Servicios terminológicos** | Usa herramientas de vocabularios médicos (UMLS, RxNorm, MetaMap) | Vocabularios curados y muy amplios | Licencias, otra dependencia, y hay que mapear después a ChEMBL |
    | **Modelos de NLP biomédico** | Modelos entrenados que leen el contexto (scispaCy, SapBERT) | Resuelven ambigüedades por contexto | Hay que instalarlos y evaluarlos; son menos explicables |
    | **LLM** | Se le pide al LLM que identifique el fármaco | Muy bueno con casos raros o texto confuso | Costo por consulta, resultados que pueden variar, y hay que validarlo |

    Rastro usa diccionario y reglas porque ya alcanza el **98-99 % de precisión** y es lo más simple de explicar y auditar. Las otras formas sirven como **complemento**, no como reemplazo: por ejemplo, pasarle a un LLM o a un modelo solo las menciones que el diccionario no resolvió y que parecen fármacos. La mayoría de las intervenciones sin enlace no son fármacos («placebo», «chemotherapy»), así que hoy no hace falta.

- question: ¿Por qué conviene resolverlo una vez y no en cada consulta?
  answer: |-
    - **Una sola definición.** "Ensayo que prueba el fármaco X" significa lo mismo en todas las preguntas. El SQL directo lo calculó de {n_methods} formas distintas en 20 preguntas.
    - **Se puede revisar.** Las reglas se leen y su precisión está medida. Lo que improvisa el SQL directo no lo revisa nadie.
    - **Se corrige una vez y mejora todo.** Cuando apareció un error (faltaban los ensayos con bicalutamida), arreglar la regla arregló todas las preguntas que la usan.
    - **Es rápido y repetible.** Corre en segundos, no necesita un LLM y siempre da el mismo resultado.

    No es perfecto: 1 o 2 de cada 100 enlaces están mal, y se pierden algunos fármacos que solo aparecen en los alias. Pero ese error es conocido y está medido; el del SQL directo, no.

- question: ¿Y si al SQL directo le doy las mismas tablas de enlaces?
  answer: >-
    Probablemente acertaría casi todas: la precisión viene de la integración revisada,
    no del lenguaje de consulta. Lo que agrega la capa semántica es exponer esa
    integración como un vocabulario de negocio que se documenta solo, que no cambia si
    cambian las tablas, que es un estándar (lo leen otras herramientas de grafos de
    conocimiento) y que trae la procedencia de cada dato.

- question: ¿Cómo se midió? ¿No favorece a Rastro?
  answer: |-
    - El mismo LLM respondió cada pregunta sin ver la respuesta correcta, con la misma consigna y los mismos reintentos.
    - Un número es correcto si está a menos del 5 % del valor real; una lista, si coincide en al menos un 80 %.
    - Los valores reales salen de Rastro, así que cada diferencia con el SQL directo se revisó con ensayos reales. Esa revisión encontró errores de Rastro, que se corrigieron antes del resultado. Detalle en layer/eval/adjudication.md.

- question: ¿Los eventos adversos son frecuencias reales?
  answer: >-
    No. Son conteos de reportes espontáneos de FAERS (openFDA): no tienen denominador,
    pueden tener duplicados y el fármaco puede no ser el sospechoso del evento. Sirven
    para comparar y detectar señales, no como verdad clínica.
