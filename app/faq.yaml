# Preguntas frecuentes de la demo. Respuestas cortas, en palabras simples.
# Los valores entre llaves ({secs_b}, {reinvented}...) los completa la app con los
# números de la evaluación guardada.

# --- Qué es -----------------------------------------------------------

- question: ¿Qué es Rastro?
  answer: |-
    Una **capa semántica** sobre cuatro fuentes públicas de oncología. Las describe con conceptos de negocio (ensayo, fármaco, target, sponsor, evento adverso), un LLM pregunta sobre esos conceptos, y cada respuesta dice de qué fuente sale.

    Técnicamente es un **Virtual Knowledge Graph**: ontología, mapeos R2RML y SPARQL, estándares del W3C. Es pragmático: las fuentes se cargan en Postgres, y los enlaces y la jerarquía de MeSH quedan precalculados en tablas.

- question: Sé SQL. ¿Qué es cada pieza, en términos de SQL?
  answer: |-
    | Tecnología semántica | En términos de SQL |
    |---|---|
    | **Ontología** | El esquema de negocio documentado: las tablas que te gustaría tener |
    | **Mapeo (R2RML)** | Una definición de vista: «esta columna de esta tabla es este concepto» |
    | **SPARQL** | Un lenguaje de consulta sobre conceptos en lugar de tablas |
    | **Ontop** | Un compilador: traduce la consulta a SQL normal sobre las tablas reales |
    | **Entity linking** | La clave de join que faltaba, calculada una vez |

    Los datos no se mueven: siguen en Postgres, y cada pregunta se ejecuta como SQL.

- question: ¿Qué pasa cuando hago una pregunta?
  answer: |-
    1. El LLM recibe la **ontología** como contexto: los conceptos, cómo se relacionan y qué significa cada uno. Con eso escribe una consulta SPARQL. No ve tablas, así que no tiene que adivinar cómo se cruzan.
    2. Ontop la traduce a SQL y la ejecuta en vivo sobre Postgres.
    3. Ves la respuesta y la fuente de cada columna. En «¿Cómo lo supe?» están la consulta y el SQL exactos, para revisarlos: el LLM todavía puede elegir mal un concepto o un filtro.

- question: ¿Qué tiene cada fuente, y dónde está?
  answer: |-
    - 🐘 **AACT**, en Postgres: el registro público de **ensayos clínicos**. Fase, estado, sponsor y qué se prueba, como texto libre.
    - 🐘 **ChEMBL**, en Postgres: **fármacos**, si están aprobados y sobre qué **proteína** actúan (el target, con el nombre de su gen, como HER2).
    - 🐘 **openFDA**, en Postgres: **reportes de efectos adversos** enviados a la FDA. Son avisos, no porcentajes de riesgo.
    - 🕸️ **MeSH**, en GraphDB, con una copia de su jerarquía en Postgres: el **vocabulario médico** que sabe qué enfermedad es subtipo de cuál.

    Más detalle, ejemplos y un glosario en docs/fuentes.md.

- question: ¿Necesito un LLM o una API key?
  answer: >-
    Para las 20 preguntas de ejemplo, no: usan consultas ya escritas por el LLM, que se
    ejecutan en vivo. Para preguntas propias hace falta un LLM: la Claude API (de pago
    por uso) u Ollama, gratis en la propia computadora. Ver layer/README.md.

# --- Frente a SQL -----------------------------------------------------

- question: Si el SQL directo acierta 18 de 20 y Rastro 20, ¿cuál es la ventaja?
  answer: |-
    No está en cuántas acierta, sino en cuánto podés confiar en cada respuesta:
    - **Una sola definición.** En {reinvented} de 20 preguntas, el SQL directo tuvo que inventar cómo reconocer un fármaco en el texto del ensayo, y lo hizo de {n_methods} formas distintas. Rastro usa siempre el mismo enlace.
    - **Errores que no avisan.** Buscando pedazos de nombres, el SQL directo encontró «humab» dentro de «rhuMAb HER2» y contó 488 ensayos anti-EGFR en vez de 438. Parece razonable.
    - **Más lento y más frágil.** Sus 20 consultas tardan {secs_b} s y {retries_b} necesitaron reintento; las de Rastro, {secs_c} s y {retries_c}.
    - **Procedencia.** Rastro dice de qué fuente sale cada dato.

- question: ¿Da la misma respuesta si pregunto lo mismo de otra forma?
  answer: |-
    Con Rastro, sí. Escribimos 10 de las preguntas de 4 formas distintas, con el mismo significado, y el mismo LLM respondió cada una sin ver las otras:
    - **SQL directo:** la respuesta cambia según cómo se pregunte en 9 de las 10. Los ensayos anti-EGFR dan 488, 488, 409 o 488. Acierta 32 de 40.
    - **Rastro:** la misma respuesta en las 4 versiones de las 10 preguntas. Acierta 40 de 40.

    El SQL directo inventa en cada consulta cómo reconocer un fármaco en el texto del ensayo; Rastro usa siempre el mismo enlace. Detalle en layer/consistencia/.

- question: ¿Por qué no vistas SQL sobre las tablas de enlaces?
  answer: |-
    Con las mismas tablas de enlaces, el SQL directo acertaría casi igual, y unas buenas vistas dan una capa con nombres de negocio y una sola definición de cada cosa. Para un caso chico pueden alcanzar.

    La capa semántica agrega:
    - **Composición:** cualquier combinación de conceptos funciona sin crear una vista para cada pregunta.
    - **Jerarquías:** «cáncer de pulmón» incluye sus subtipos.
    - **Procedencia:** la fuente de cada columna de la respuesta.
    - **Contexto para el LLM:** un vocabulario con definiciones, no nombres de tablas.
    - **Estándares abiertos** (W3C), que otras herramientas entienden, no atados a una base.

- question: ¿Dónde quedó la complejidad del SQL?
  answer: |-
    En la capa. El SPARQL es corto porque solo nombra conceptos: promedia 368 caracteres, contra 726 del SQL que escribió el LLM. En la pregunta de HER2: 435 contra 1.543.

    La complejidad se escribe una vez, en los mapeos y en los enlaces, y Ontop genera el SQL (742 caracteres para HER2): joins simples sobre tablas revisadas, que nadie escribe ni mantiene. En preguntas muy simples el SQL directo puede ser más corto; la ventaja aparece al cruzar fuentes.

- question: ¿Qué pasa si una fuente cambia?
  answer: |-
    Lo probamos con las 20 consultas guardadas, simulando una versión nueva de AACT:
    - **Cambia el nombre de una columna:** 5 consultas del SQL directo fallan y hay que reescribirlas. En Rastro, **una línea del mapeo**.
    - **Cambia cómo se escribe un valor** (`TERMINATED` → `Terminated`): el SQL directo no falla, pero 5 respuestas pasan a 0 sin aviso. Rastro también, hasta que se arregla, pero su control de vocabulario avisa. Y se arregla con una línea.

    Detalle en docs/demo-cambio.md.

# --- Cómo integra -----------------------------------------------------

- question: ¿Qué problemas de integración resuelve?
  answer: |-
    Según el tutorial de Virtual Knowledge Graphs de Calvanese, Cogrel y Lanti (Ontobras 2022), hay cuatro tipos de heterogeneidad. Los dos que importan:

    - **De esquema:** el mismo concepto en columnas distintas. openFDA dice `query_id`, ChEMBL `chembl_id`, y ambos son «Fármaco». Lo resuelven la **ontología y los mapeos**. Esta tabla sale de los mapeos:

    {unified_columns}

    - **De datos:** la misma entidad escrita distinto. «Pembrolizumab 200 mg», «MK-3475» y «Keytruda» son el mismo fármaco. Lo resuelve el **entity linking**.

    Los mapeos solo unen valores iguales. Entre AACT y ChEMBL no hay ninguno: AACT dice «Pembrolizumab 200 mg» y ChEMBL `CHEMBL3137343`. Por eso hace falta el entity linking, que **crea** esa clave. Las otras dos (de modelo de datos y de sistema) las resuelven los cargadores. Más en docs/integracion.md.

- question: ¿Cómo sabe Rastro qué fármaco prueba cada ensayo?
  answer: |-
    Con **entity linking por diccionario**, calculado una vez para las 130.000 intervenciones: compara el texto del ensayo con los nombres y sinónimos de ChEMBL.

    | Qué dice el ensayo | Resultado |
    |---|---|
    | «MK-3475» | pembrolizumab (sinónimo de ChEMBL) |
    | «Carboplatin + Paclitaxel» | carboplatino y paclitaxel (combinación) |
    | «FOLFOX» | fluorouracilo, leucovorina y oxaliplatino (régimen) |
    | «Pembrolizumab 200 mg» | pembrolizumab (nombre como palabra entera) |

    Precisión: 98-99 % en muestras al azar, revisadas por un asistente de IA; falta la confirmación humana (docs/verificacion-humana.md). Hay formas más sofisticadas (coincidencia aproximada, modelos de lenguaje biomédico, un LLM), pero el diccionario ya alcanza, es explicable y siempre da lo mismo. Las otras sirven de complemento para lo que el diccionario no resuelve.

# --- Confianza en los números ----------------------------------------

- question: ¿Cómo se midió? ¿No favorece a Rastro?
  answer: |-
    - El mismo LLM respondió cada pregunta sin ver la respuesta correcta, con la misma consigna y los mismos reintentos.
    - Un número es correcto si está a menos del 5 % del valor real; una lista, si coincide en al menos un 80 %.
    - Los valores reales salen de Rastro, así que cada diferencia con el SQL directo se revisó con ensayos reales. Esa revisión encontró y corrigió errores de Rastro. Detalle en layer/eval/adjudication.md.
    - Las preguntas, las referencias y esa revisión las hizo un asistente de IA (Claude Code), no el LLM evaluado. Falta que una persona las confirme: docs/verificacion-humana.md.

- question: ¿Los eventos adversos son frecuencias reales?
  answer: >-
    No. Son conteos de reportes espontáneos de FAERS (openFDA): no tienen denominador,
    pueden tener duplicados y el fármaco puede no ser el sospechoso del evento. Sirven
    para comparar y detectar señales, no como verdad clínica.
