# Preguntas frecuentes propias de oncología. Respuestas cortas, en palabras simples. Las que valen
# para los tres casos están en app/faq-general.yaml y la app las muestra antes.
# Los valores entre llaves ({secs_b}, {reinvented}...) los completa la app con los
# números de la evaluación guardada.

# Las que tienen «tecnico: true» se ven solo con «Ver detalles técnicos».

# --- Para todos ----------------------------------------------------

- question: ¿De dónde salen los datos?
  answer: |-
    De cuatro bases públicas:
    - **AACT**: el registro de ensayos clínicos, los estudios en personas para probar tratamientos.
    - **ChEMBL**: los fármacos y sobre qué proteína del cuerpo actúan.
    - **openFDA**: los reportes de efectos adversos que llegan a la FDA.
    - **MeSH**: el vocabulario médico que sabe qué enfermedad es un subtipo de cuál.

    Es una foto de octubre de 2026.

- question: Un ejemplo de evidencia en oncología
  answer: |-
    En cada respuesta con fármacos, «¿De dónde sale la respuesta?» muestra cómo reconoció Rastro cada fármaco en los ensayos: lo que escribió quien registró el ensayo, y qué fármaco es. Por ejemplo, «Adjuvant Systemic Therapy» es trastuzumab emtansina porque el sponsor lo declaró así. Se puede abrir cada ensayo y comprobarlo.

- question: ¿Qué textos lee en oncología?
  answer: |-
    Sí, con cuidado. En «Una pregunta sobre textos», Rastro primero elige con una consulta exacta los ensayos que importan (por ejemplo, los de fase 3 de cáncer de pulmón con inhibidores de quinasa que se detuvieron: 26). Después, un asistente de IA lee solo los motivos que escribió cada sponsor y los agrupa: falta de pacientes, decisión de la empresa, el tratamiento no funcionó… Cada grupo cita sus ensayos, y en «¿De dónde sale la respuesta?» están todos los textos que leyó.

    Además, el motivo de cada uno de los 12.611 ensayos detenidos pasó a ser un dato del grafo, clasificado con reglas y con su evidencia. Así, «¿cuántos ensayos se detuvieron por falta de pacientes?» se responde con una consulta exacta. Las reglas aciertan 9 de cada 10 en una muestra revisada.

- question: ¿Los eventos adversos son frecuencias reales?
  answer: >-
    No. Son conteos de reportes espontáneos de FAERS (openFDA): no tienen denominador,
    pueden tener duplicados y el fármaco puede no ser el sospechoso del evento. Sirven
    para comparar y detectar señales, no como verdad clínica.

# --- Para técnicos (se ven con «Ver detalles técnicos») ----------------

- question: ¿Qué tiene cada fuente, y dónde está?
  tecnico: true
  answer: |-
    - 🐘 **AACT**, en Postgres: el registro público de **ensayos clínicos**. Fase, estado, sponsor y qué se prueba, como texto libre.
    - 🐘 **ChEMBL**, en Postgres: **fármacos**, si están aprobados y sobre qué **proteína** actúan (el target, con el nombre de su gen, como HER2).
    - 🐘 **openFDA**, en Postgres: **reportes de efectos adversos** enviados a la FDA. Son avisos, no porcentajes de riesgo.
    - 🕸️ **MeSH**, en GraphDB, con una copia de su jerarquía en Postgres: el **vocabulario médico** que sabe qué enfermedad es subtipo de cuál.

    Más detalle, ejemplos y un glosario en docs/fuentes.md.
# --- Frente a SQL -----------------------------------------------------

- question: En oncología, ¿qué dio la comparación con SQL?
  tecnico: true
  answer: |-
    Lo medimos con tres formas de darle los datos al mismo LLM:

    | | SQL directo | SQL + enlaces de Rastro | Rastro |
    |---|---|---|---|
    | Correctas, de 20 | 18 | 20 | 20 |
    | Misma respuesta, preguntando de 4 formas | 1 de 10 | 10 de 10 | 10 de 10 |
    | Una columna de la fuente cambia de nombre | 5 consultas rotas | 5 consultas rotas | 1 línea del mapeo |
    | El negocio cambia una definición | cada consulta | cada consulta | 1 línea de la ontología |
    | De dónde sale cada dato | no | no | por columna |
    | Une datos de Wikidata en la misma consulta | no | no | sí |

    **La precisión y la consistencia vienen de integrar una vez** (las tablas de enlaces): con ellas, el SQL acierta igual, incluso en preguntas de 3 o 4 cruces (layer/composicion/). **La capa semántica aporta el resto:** el conocimiento de cada fuente queda en los mapeos y no repartido en cada consulta, cada dato trae su fuente, y se puede consultar junto con datos de otras organizaciones, con estándares abiertos.

- question: ¿Da la misma respuesta si pregunto lo mismo de otra forma?
  tecnico: true
  answer: |-
    Con la integración hecha, sí. Escribimos 10 de las preguntas de 4 formas distintas:
    - **SQL directo:** la respuesta cambia según cómo se pregunte en 9 de las 10 (los ensayos anti-EGFR dan 488, 488, 409 o 488). En {reinvented} de las 20 preguntas originales tuvo que inventar cómo reconocer un fármaco, de {n_methods} formas distintas.
    - **SQL + enlaces y Rastro:** la misma respuesta en las 4 versiones de las 10 preguntas.

    Detalle en layer/consistencia/.

- question: ¿Dónde quedó la complejidad del SQL?
  tecnico: true
  answer: |-
    En la integración, hecha una vez. En la pregunta de HER2, el LLM escribió 1.543 caracteres de SQL sin integración, 571 de SQL sobre las tablas de enlaces y 435 de SPARQL sobre Rastro. La gran diferencia la hace integrar; SPARQL la hace un poco más corta y en palabras de negocio, y Rastro genera el SQL.

- question: En oncología, ¿qué pasó cuando cambió una fuente?
  tecnico: true
  answer: |-
    Lo probamos con las 20 consultas guardadas, simulando una versión nueva de AACT:
    - **Cambia el nombre de una columna:** 5 consultas de SQL fallan, con o sin las tablas de enlaces, porque igual leen las columnas de la fuente. En Rastro, **una línea del mapeo**.
    - **Cambia cómo se escribe un valor** (`TERMINATED` → `Terminated`): el SQL no falla, pero 5 respuestas pasan a 0 sin aviso. Rastro también, hasta que se arregla, pero su control de vocabulario avisa. Y se arregla con una línea.

    Una capa de vistas SQL también centralizaría el cambio. Detalle en docs/demo-cambio.md.

- question: ¿Cómo sé por qué Rastro dice que un ensayo prueba un fármaco?
  tecnico: true
  answer: |-
    En cada respuesta con fármacos, una columna dice cómo lo reconoce Rastro (por ejemplo, trastuzumab: 854 ensayos, 81 % por su nombre), y el paso 4 de **«¿De dónde sale la respuesta?»** muestra ejemplos no obvios, que se pueden abrir en ClinicalTrials.gov: «Bevacizumab (drug), Herceptin (drug)» es trastuzumab como parte de una combinación; «Adjuvant Systemic Therapy» es trastuzumab emtansina por un alias que declaró el sponsor.

    Esa evidencia está en el grafo, descrita con **PROV-O**, el estándar del W3C para procedencia: cada enlace ensayo → fármaco guarda el texto que escribió el sponsor, el texto que coincidió, la regla, y de qué fuentes deriva. Cualquier consulta puede pedirla. También muestra lo discutible: «[89Zr]-Df-Trastuzumab» es un trazador de imágenes, no el tratamiento, y cualquiera puede verlo y corregir la regla.

    Con SQL también se puede guardar, pero hay que programarlo en cada consulta y no lo entiende ninguna otra herramienta.

- question: En oncología, ¿qué definición deduce Rastro?
  tecnico: true
  answer: |-
    Que una definición de negocio se escribe una vez, en la ontología, y todas las preguntas la usan. Ejemplo: «terapia dirigida» no está en ninguna tabla ni en ningún mapeo. La ontología dice, en dos líneas, que los inhibidores de quinasa y los anticuerpos monoclonales son terapias dirigidas, y Rastro lo deduce al responder: 156 fármacos.

    Si el negocio decide que la terapia hormonal también cuenta, es una línea más: 188 fármacos, y los ensayos de fase 3 de cáncer de mama con terapia dirigida pasan de 336 a 547, en todas las preguntas a la vez. Con SQL, esa definición vive en cada consulta, o en una vista que hay que mantener.

    Lo probamos: con la definición documentada, el SQL con enlaces también acierta (3 de 3, layer/composicion/). La diferencia no es la precisión, es dónde vive la definición.

- question: ¿Puede consultar datos que no están en Rastro?
  tecnico: true
  answer: |-
    Sí, si comparten identificadores. Una sola consulta en GraphDB combina Rastro, MeSH y **Wikidata**, en vivo y sin cargar nada: por ejemplo, para cada fármaco anti-HER2, qué enfermedades trata según Wikidata. El cruce es el ChEMBL ID, que Rastro y Wikidata usan igual. Así aparece que afatinib (aprobado para cáncer de pulmón) y vandetanib (tiroides) se prueban en cáncer de mama.

    Detalle en layer/externo/.

# --- Cómo integra -----------------------------------------------------

- question: En oncología, ¿qué columnas unifican los mapeos y qué crea el entity linking?
  tecnico: true
  answer: |-
    Según el tutorial de Virtual Knowledge Graphs de Calvanese, Cogrel y Lanti (Ontobras 2022), hay cuatro tipos de heterogeneidad. Los dos que importan:

    - **De esquema:** el mismo concepto en columnas distintas. openFDA dice `query_id`, ChEMBL `chembl_id`, y ambos son «Fármaco». Lo resuelven la **ontología y los mapeos**. Esta tabla sale de los mapeos:

    {unified_columns}

    - **De datos:** la misma entidad escrita distinto. «Pembrolizumab 200 mg», «MK-3475» y «Keytruda» son el mismo fármaco. Lo resuelve el **entity linking**.

    Los mapeos solo unen valores iguales. Entre AACT y ChEMBL no hay ninguno: AACT dice «Pembrolizumab 200 mg» y ChEMBL `CHEMBL3137343`. Por eso hace falta el entity linking, que **crea** esa clave. Las otras dos (de modelo de datos y de sistema) las resuelven los cargadores. Más en docs/integracion.md.

- question: ¿Cómo sabe Rastro qué fármaco prueba cada ensayo?
  tecnico: true
  answer: |-
    Con **entity linking por diccionario**, calculado una vez para las 130.000 intervenciones: compara el texto del ensayo con los nombres y sinónimos de ChEMBL.

    | Qué dice el ensayo | Resultado |
    |---|---|
    | «MK-3475» | pembrolizumab (sinónimo de ChEMBL) |
    | «Carboplatin + Paclitaxel» | carboplatino y paclitaxel (combinación) |
    | «FOLFOX» | fluorouracilo, leucovorina y oxaliplatino (régimen) |
    | «Pembrolizumab 200 mg» | pembrolizumab (nombre como palabra entera) |

    Precisión: 98-99 % en muestras al azar, revisadas por un asistente de IA; falta la confirmación humana (docs/verificacion-humana.md). Hay formas más sofisticadas (coincidencia aproximada, modelos de lenguaje biomédico, un LLM), pero el diccionario ya alcanza, es explicable y siempre da lo mismo. Las otras sirven de complemento para lo que el diccionario no resuelve.

