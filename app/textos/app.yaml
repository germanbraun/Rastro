app.answer.tech_rastro_line:
  es: "- {storage} **Enlace de Rastro**: ensayo → fármaco, resuelto por nombre, alias y sinónimos de ChEMBL (98-99 % de precisión en una muestra) · {note}"
  en: "- {storage} **Rastro link**: trial → drug, resolved by name, alias and ChEMBL synonyms (98-99 % precision in a sample) · {note}"
