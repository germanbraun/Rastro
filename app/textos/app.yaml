  es: "- {storage} **{name}** · licencia: {license} · {note}"
  en: "- {storage} **{name}** · license: {license} · {note}"
app.answer.adverse_tech_note:
  es: "Los eventos adversos son conteos de reportes espontáneos de FAERS: no son frecuencias clínicas y pueden incluir duplicados."
  en: "Adverse events are counts of spontaneous FAERS reports: they are not clinical frequencies and may include duplicates."
app.answer.step_evidence:
  es: "**4. La evidencia de los enlaces ensayo → fármaco.** Cada enlace guarda qué escribió el sponsor, con qué coincidió y con qué regla. Algunos ejemplos no obvios:"
  en: "**4. The evidence of the trial → drug links.** Each link keeps what the sponsor wrote, what it matched and with which rule. Some non-obvious examples:"
app.answer.prov_intro:
  es: "La evidencia está en el grafo, descrita con **PROV-O** (el estándar del W3C para procedencia), así que cualquier consulta puede pedirla. Por ejemplo, esta pide la evidencia del enlace entre {nct} y {name}: de qué deriva (`prov:wasDerivedFrom`) y qué lo generó (`prov:wasGeneratedBy`):"
  en: "The evidence is in the graph, described with **PROV-O** (the W3C standard for provenance), so any query can ask for it. For example, this one asks for the evidence of the link between {nct} and {name}: what it derives from (`prov:wasDerivedFrom`) and what generated it (`prov:wasGeneratedBy`):"
app.answer.prov_caption:
  es: "La consulta de la respuesta no necesita PROV-O: usa `oncologia:testsDrug`. La procedencia se pide aparte, como acá. «?enlace a prov:Entity» no está en ningún mapeo: Rastro lo deduce de la ontología, donde un enlace es un tipo de entidad PROV. Cualquiera puede auditarlo abriendo el ensayo."
  en: "The answer's query does not need PROV-O: it uses `oncologia:testsDrug`. Provenance is asked for separately, as here. «?enlace a prov:Entity» is in no mapping: Rastro infers it from the ontology, where a link is a kind of PROV entity. Anyone can audit it by opening the trial."

