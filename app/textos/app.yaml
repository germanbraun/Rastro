app.change.fails_loud_tech:
  es: "Rastro falla más, y todo junto: la primera consulta con error deja la conexión con la base en error y arrastra a las demás. Falla en voz alta, y se arregla en un lugar."
  en: "Rastro fails more, and all at once: the first query with an error leaves the database connection in error and drags the others along. It fails loudly, and it is fixed in one place."
app.change.fails_loud:
  es: "Con Rastro falla todo junto y en voz alta, y se arregla en un solo lugar."
  en: "With Rastro everything fails at once and loudly, and it is fixed in a single place."
