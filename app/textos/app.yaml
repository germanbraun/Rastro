app.change.fix:
  es: "**El arreglo en Rastro:** una línea, en la traducción de esa base al diccionario de negocio."
  en: "**The fix in Rastro:** one line, in the translation of that database to the business dictionary."
app.change.after: {es: "**Después del arreglo:**", en: "**After the fix:**"}
app.change.rewrite: {es: ". Hay que encontrar y reescribir cada consulta.", en: ". Every query has to be found and rewritten."}
app.change.affected: {es: "Las preguntas afectadas", en: "The affected questions"}
app.change.info_tech:
  es: "Con SQL, cada consulta sabe cómo se llaman las columnas y cómo se escriben los valores, aunque use las tablas de enlaces. En Rastro ese conocimiento está en un solo lugar: el mapeo. Una capa de vistas SQL también lo centralizaría; la capa semántica suma la procedencia y los datos de afuera."
  en: "With SQL, every query knows what the columns are called and how the values are written, even if it uses the link tables. In Rastro that knowledge is in a single place: the mapping. A layer of SQL views would also centralize it; the semantic layer adds provenance and outside data."
app.change.info:
  es: "Sin Rastro, cada consulta sabe cómo se llaman las columnas y cómo se escriben los valores: si la base cambia, hay que encontrar y arreglar cada una. Con Rastro, eso está en un solo lugar."
  en: "Without Rastro, every query knows what the columns are called and how the values are written: if the database changes, each one has to be found and fixed. With Rastro, that is in a single place."
app.change.definition:
  es: "«Terapia dirigida» está definida una sola vez, en el **diccionario de negocio**: los inhibidores de quinasa y los anticuerpos monoclonales lo son. Si el negocio decide que la terapia hormonal también cuenta, es una línea más, y todas las preguntas cambian a la vez:"
  en: "«Targeted therapy» is defined only once, in the **business dictionary**: kinase inhibitors and monoclonal antibodies are targeted therapies. If the business decides that hormone therapy also counts, it is one more line, and every question changes at once:"
app.change.targeted_drugs: {es: "Fármacos que son terapia dirigida", en: "Drugs that are targeted therapy"}
app.change.targeted_trials:
  es: "Ensayos de fase 3 de cáncer de mama con terapia dirigida"
  en: "Phase 3 breast cancer trials with targeted therapy"
app.change.delta: {es: "{delta} (antes, {before})", en: "{delta} (before, {before})"}
app.change.definition_info:
  es: "Sin Rastro, esa definición vive dentro de cada consulta. Con Rastro, en un solo lugar."
  en: "Without Rastro, that definition lives inside every query. With Rastro, in a single place."
app.change.definition_tech:
  es: "«Terapia dirigida» no está en ninguna tabla ni en ningún mapeo. Está definida en la **ontología**, en dos líneas: los inhibidores de quinasa y los anticuerpos monoclonales son terapias dirigidas. Rastro lo deduce al responder."
  en: "«Targeted therapy» is in no table and in no mapping. It is defined in the **ontology**, in two lines: kinase inhibitors and monoclonal antibodies are targeted therapies. Rastro infers it when answering."
app.change.definition_sql:
  es: "El SQL que genera Rastro para «fármacos que son terapia dirigida»: nadie lo escribió."
  en: "The SQL Rastro generates for «drugs that are targeted therapy»: nobody wrote it."
app.change.hormone:
  es: "**Si el negocio decide que la terapia hormonal también cuenta, es una línea más:**"
  en: "**If the business decides that hormone therapy also counts, it is one more line:**"
app.change.definition_tech_info:
  es: "Todas las preguntas que dicen «terapia dirigida» cambian a la vez, sin tocar SQL ni consultas. Con SQL, esa definición vive en cada consulta, o en una vista que hay que mantener. En Rastro vive en el modelo, documentada, y el LLM la lee."
  en: "Every question that says «targeted therapy» changes at once, without touching SQL or queries. With SQL, that definition lives in every query, or in a view that has to be maintained. In Rastro it lives in the model, documented, and the LLM reads it."
app.change.wikidata:
  es: "Una consulta une, en vivo, **Rastro**, **MeSH** y **Wikidata**: para cada fármaco anti-HER2, qué enfermedades trata según Wikidata. No se carga nada: Rastro y Wikidata comparten el identificador del fármaco (ChEMBL ID)."
  en: "One query joins, live, **Rastro**, **MeSH** and **Wikidata**: for each anti-HER2 drug, which diseases it treats according to Wikidata. Nothing is loaded: Rastro and Wikidata share the drug's identifier (ChEMBL ID)."
app.change.wikidata_drug: {es: "Fármaco", en: "Drug"}
app.change.wikidata_trials: {es: "Ensayos de cáncer de mama", en: "Breast cancer trials"}
app.change.wikidata_treats: {es: "Trata, según Wikidata", en: "Treats, according to Wikidata"}
app.change.wikidata_caption:
  es: "Afatinib (pulmón) y vandetanib (tiroides) están aprobados para otros cánceres y se prueban en mama: un dato que ninguna de las cuatro fuentes de Rastro tiene. Resultado guardado el 17 oct 2026; la consulta en vivo tarda unos 10 segundos."
  en: "Afatinib (lung) and vandetanib (thyroid) are approved for other cancers and are tested in breast cancer: a fact that none of Rastro's four sources has. Result saved on 17 Oct 2026; the live query takes about 10 seconds."
app.change.wikidata_query: {es: "La consulta: tres grafos en una", en: "The query: three graphs in one"}
app.change.wikidata_info:
  es: "Con SQL, sumar una fuente de otra organización es cargarla y mantener una copia. Con identificadores compartidos, se consulta en el lugar."
  en: "With SQL, adding a source from another organization means loading it and keeping a copy. With shared identifiers, it is queried where it is."

