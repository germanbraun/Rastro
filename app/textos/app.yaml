app.text.steps:
  es: "**1 · La pregunta → 2 · El grafo elige → 3 · La IA lee solo eso → 4 · El resumen, con citas → 5 · Comprobar → 6 · El texto pasa a ser dato**"
  en: "**1 · The question → 2 · The graph picks → 3 · The AI reads only that → 4 · The summary, with citations → 5 · Check → 6 · The text becomes data**"
app.text.question: {es: "La pregunta", en: "The question"}
app.text.step2_title: {es: "El grafo elige, con una consulta exacta", en: "The graph picks, with an exact query"}
app.text.step2_help:
  es: "No es una búsqueda por palabras: la consulta usa la jerarquía de enfermedades de MeSH y la clase «inhibidor de quinasa» que deduce Rastro, así que trae exactamente esos ensayos."
  en: "It is not a keyword search: the query uses MeSH's disease hierarchy and the «kinase inhibitor» class that Rastro infers, so it brings exactly those trials."
app.text.picked: {es: "Ensayos elegidos por el grafo", en: "Trials picked by the graph"}
app.text.query_expander: {es: "La consulta SPARQL que elige los ensayos", en: "The SPARQL query that picks the trials"}
app.text.query_caption:
  es: "Pide conceptos del diccionario, no palabras: por eso trae exactamente estos ensayos, siempre los mismos."
  en: "It asks for dictionary concepts, not words: that is why it brings exactly these trials, always the same ones."
app.text.step3_title: {es: "La IA lee solo esos textos", en: "The AI reads only those texts"}
app.text.step3_help:
  es: "El asistente de IA no busca nada por su cuenta: recibe estos motivos y ninguno más."
  en: "The AI assistant does not search anything on its own: it receives these reasons and no others."
app.text.ai_fallback: {es: "Un asistente de IA leyó solo los {n} motivos.", en: "An AI assistant read only the {n} reasons."}
app.text.reasons_expander:
  es: "Los {n} motivos que leyó, tal como los escribió cada sponsor"
  en: "The {n} reasons it read, as each sponsor wrote them"
app.text.col_trial: {es: "Ensayo", en: "Trial"}
app.text.col_drugs: {es: "Fármacos", en: "Drugs"}
app.text.col_reason: {es: "Motivo escrito", en: "Written reason"}
app.text.step4_title: {es: "El resumen, con citas", en: "The summary, with citations"}
app.text.group:
  es: "- **{reason}** · {n} ensayos. {detail}  \n<small>Cita: {links}</small>"
  en: "- **{reason}** · {n} trials. {detail}  \n<small>Cites: {links}</small>"
app.text.step5_title: {es: "Comprobar", en: "Check"}
app.text.step5_help:
  es: "Cada grupo cita sus ensayos: se abren en ClinicalTrials.gov y se lee el motivo original."
  en: "Each group cites its trials: they open in ClinicalTrials.gov, where the original reason can be read."
app.text.step5_body:
  es: "Cada grupo cita sus ensayos, con el enlace a ClinicalTrials.gov; en el paso 3 está el motivo original de cada uno. Resumen guardado el {date}; los motivos se leen en vivo."
  en: "Each group cites its trials, with the link to ClinicalTrials.gov; step 3 has the original reason of each one. Summary saved on {date}; the reasons are read live."
app.text.step6_title: {es: "El texto pasa a ser dato", en: "The text becomes data"}
app.text.step6_help:
  es: "Cuando el texto se puede clasificar con reglas, el motivo queda como un hecho del grafo, con su evidencia (PROV-O), y se cuenta con una consulta exacta, sin IA."
  en: "When the text can be classified with rules, the reason becomes a fact in the graph, with its evidence (PROV-O), and it is counted with an exact query, without AI."
app.text.col_class: {es: "Motivo", en: "Reason"}
app.text.col_trials: {es: "Ensayos", en: "Trials"}
app.text.facts_caption:
  es: "Cada motivo es un hecho del grafo, clasificado con reglas a partir del texto del sponsor y con su evidencia. Un ensayo puede tener varios motivos. Las reglas aciertan 9 de cada 10 en una muestra revisada por un asistente de IA."
  en: "Each reason is a fact in the graph, classified with rules from the sponsor's text and with its evidence. A trial can have several reasons. The rules are right 9 times out of 10 in a sample reviewed by an AI assistant."
app.text.count_expander:
  es: "El conteo, sobre el motivo clasificado (oncologia:stopReason, con su evidencia en oncologia:StopReasonLink)"
  en: "The count, over the classified reason (oncologia:stopReason, with its evidence in oncologia:StopReasonLink)"

app.why.title: {es: "Cómo reconoció Rastro {valor} en los ensayos", en: "How Rastro recognized {valor} in the trials"}
app.why.explains:
  es: "Cada ensayo escribe el fármaco a su manera (una marca, un código, una combinación). Rastro lo reconoció una vez, con una regla, y guardó qué escribió el ensayo y con qué coincidió. Algunos ejemplos no obvios:"
  en: "Each trial writes the drug its own way (a brand, a code, a combination). Rastro recognized it once, with a rule, and kept what the trial wrote and what it matched. Some non-obvious examples:"
