enlaces.legend:
  es: "🔹 Regla automática: una regla escrita unió los datos y guardó su evidencia. 🟠 Revisada por IA, falta una persona: una corrección que revisó un asistente de IA; la usa Rastro, pero una persona todavía tiene que confirmarla. ✅ Confirmada por una persona: una corrección verificada con un documento, que se cita."
  en: "🔹 Automatic rule: a written rule joined the data and kept its evidence. 🟠 Reviewed by AI, a person must confirm: a correction an AI assistant reviewed; Rastro uses it, but a person still has to confirm it. ✅ Confirmed by a person: a correction verified against a document, which is cited."

