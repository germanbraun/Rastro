dominio.review.title: {es: "Uniones para confirmar ({n})", en: "Links to confirm ({n})"}
dominio.review.intro:
  es: "Correcciones que revisó un asistente de IA y esperan a una persona. Confirmá con el documento en que se apoya, o rechazá con el motivo: queda escrito quién, cuándo y por qué, y llega a las respuestas cuando se vuelve a armar Rastro."
  en: "Corrections an AI assistant reviewed that wait for a person. Confirm with the document they rest on, or reject with the reason: who, when and why stays written, and it reaches the answers when Rastro is rebuilt."
