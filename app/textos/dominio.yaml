dominio.show_enrichment_saved.title: {es: "**Guardado en Rastro**", en: "**Saved in Rastro**"}
dominio.show_enrichment_saved.not_saved:
  es: "Todavía no se guardó: `docker compose run --rm wikidata-energia-loader` y después el enlazador."
  en: "Not saved yet: `docker compose run --rm wikidata-energia-loader` and then the linker."
dominio.show_enrichment_saved.explain:
  es: "Lo mismo, guardado: lo que respondió Wikidata queda en Rastro como una fuente más, con el día de la consulta y la huella del
    archivo, unido por el LEI. No depende de internet, se puede repetir y lo usan las preguntas, el asistente de IA y el modelo de Rastro
    Lab. En vivo está siempre al día; guardado, queda como estaba ese día."
  en: "The same, saved: what Wikidata answered stays in Rastro as one more source, with the day of the query and the file's fingerprint,
    joined by the LEI. It does not depend on internet, it can be repeated and it is used by the questions, the AI assistant and the Rastro
    Lab model. Live is always up to date; saved, it stays as it was that day."

