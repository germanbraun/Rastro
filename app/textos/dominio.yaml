dominio.chat.intro:
  es: "Preguntá en tus palabras y seguí con otra pregunta («¿y Tecpetrol?»). Rastro traduce cada pregunta a una consulta sobre el diccionario de negocio, la responde con los datos y muestra debajo de dónde sale. Si un número de la respuesta no está en los datos, lo marca."
  en: "Ask in your own words and follow up («and Tecpetrol?»). Rastro translates each question into a query over the business dictionary, answers it with the data and shows below where it comes from. If a number in the answer is not in the data, it flags it."
