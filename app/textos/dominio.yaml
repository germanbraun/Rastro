  en: "The group's 40 largest contracts, selected with an exact query."
dominio.compare_text_search.caption:
  es: "La búsqueda considera la descripción del contrato y el nombre de la empresa, como lo haría una consulta SQL o un buscador. Rastro
    identifica esas empresas como parte del grupo porque el grupo se definió una sola vez, con la evidencia de cada vínculo."
  en: "The search looks at the contract's description and the company's name, as an SQL query or a search engine would. Rastro identifies
    those companies as part of the group because the group was defined only once, with the evidence of each link."

