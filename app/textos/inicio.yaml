wizard.requirements_title: {es: "Requisitos mínimos para armar tu propia capa", en: "Minimum requirements to build your own layer"}
wizard.requirements:
  es: "- **Una máquina en tu red** con Docker y Git: 4 CPU, 8 GB de RAM y 50 GB de disco alcanzan para un piloto de pocas fuentes (el tamaño de tus datos decide el disco).\n- **Acceso de solo lectura** a cada fuente: un usuario por base de datos, o archivos.\n- **La API de Claude**, para el agente que arma la capa y para conversar con los datos. Las preguntas de ejemplo, la demo, las reglas de calidad y el modelo funcionan sin ella; si tus datos no pueden salir de tu red, se usa Claude desde tu nube o un modelo local.\n- **Personas:** una de negocio, unas 2 horas por semana, para aprobar preguntas, definiciones y uniones dudosas; y una técnica para los accesos.\n- **Opcional:** tu inicio de sesión (single sign-on) delante de la app; si no, un usuario y contraseña propios.\n\nEl detalle, con la instalación en un comando: docs/customer-deployment.md."
  en: "- **A machine in your network** with Docker and Git: 4 CPUs, 8 GB of RAM and 50 GB of disk are enough for a pilot of a few sources (the size of your data decides the disk).\n- **Read-only access** to each source: a user per database, or files.\n- **The Claude API**, for the agent that builds the layer and to talk to the data. The example questions, the demo, the quality rules and the model work without it; if your data cannot leave your network, Claude through your cloud or a local model is used.\n- **People:** a business person, about 2 hours a week, to approve questions, definitions and doubtful links; and a technical person for the access.\n- **Optional:** your sign-on (single sign-on) in front of the app; otherwise, a user and password of its own.\n\nThe detail, with the one-command install: docs/customer-deployment.md."

