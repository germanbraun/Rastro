# The start page (app/inicio.py) and the wizard's sketch (app/wizard.py)
inicio.choose: {es: "¿Por dónde empezamos?", en: "Where do we start?"}
inicio.problem: {es: "**Lo que cuesta no tener los datos integrados**, medido en la demo con datos públicos:", en: "**What it costs not to have the data integrated**, measured in the demo on public data:"}
inicio.pilot_button: {es: "Hablemos de un piloto con tus datos", en: "Let's talk about a pilot with your data"}
inicio.pilot_title: {es: "Un piloto de 6 semanas, con tus datos", en: "A 6-week pilot, with your data"}
inicio.pilot_text:
  es: "- **Hasta 10 preguntas de negocio** tuyas y **hasta 3 fuentes**, con acceso de solo lectura, en tu infraestructura si preferís.\n- **Unas 2 horas por semana** de una persona de negocio, para aprobar las preguntas y las definiciones y confirmar las uniones dudosas.\n- **Se mide con las mismas pruebas de la demo:** la respuesta con su evidencia, la misma pregunta de varias formas, una fuente que cambia.\n- **Lo que se construye queda para tu empresa**, en estándares abiertos que leen otras herramientas.\n\nAl terminar: la app con tus preguntas, los resultados medidos con sus límites y una recomendación de próximo paso."
  en: "- **Up to 10 of your business questions** and **up to 3 sources**, with read-only access, on your infrastructure if you prefer.\n- **About 2 hours a week** of a business person, to approve the questions and definitions and confirm the doubtful links.\n- **Measured with the demo's own tests:** the answer with its evidence, the same question asked several ways, a source that changes.\n- **What gets built stays with your company**, in open standards other tools read.\n\nAt the end: the app with your questions, the measured results with their limits and a recommended next step."
inicio.pilot_write: {es: "Escribinos", en: "Write to us"}
inicio.demo_title: {es: "Ver la demo", en: "See the demo"}
inicio.demo_text:
  es: "Rastro funcionando sobre datos públicos de petróleo y gas de Argentina: preguntas de negocio respondidas con su evidencia, una fuente que cambia, una corrección que llega a todo y un modelo que explica sus predicciones. Con «Ver detalles técnicos», los otros dominios."
  en: "Rastro working on public oil and gas data from Argentina: business questions answered with their evidence, a source that changes, a correction that reaches everything and a model that explains its predictions. With «Show technical details», the other domains."
inicio.demo_button: {es: "Ver la demo", en: "See the demo"}
inicio.wizard_title: {es: "Armá tu capa semántica", en: "Build your own semantic layer"}
inicio.wizard_text:
  es: "Con tus fuentes y tus preguntas. Rastro propone cada paso y vos decidís lo que es de negocio:\n\n1. **Conectás tus fuentes**, con un usuario de solo lectura: Rastro mira tablas, claves y muestras.\n2. **Escribís tus preguntas** en tus palabras y aprobás qué significa cada una.\n3. **Aprobás el diccionario de negocio** que Rastro arma para responderlas.\n4. **Confirmás las uniones dudosas** entre fuentes, con su evidencia a la vista.\n5. **Ves los resultados medidos** y publicás la app para tu equipo.\n\nEs un boceto para discutir cómo sería: todavía no se conecta a nada."
  en: "With your sources and your questions. Rastro proposes each step and you decide what is a business decision:\n\n1. **You connect your sources**, with a read-only user: Rastro looks at tables, keys and samples.\n2. **You write your questions** in your own words and approve what each one means.\n3. **You approve the business dictionary** Rastro builds to answer them.\n4. **You confirm the doubtful links** between sources, with their evidence in view.\n5. **You see the measured results** and publish the app for your team.\n\nIt is a sketch to discuss what it would be like: it does not connect to anything yet."
inicio.wizard_button: {es: "Ver el boceto", en: "See the sketch"}
inicio.back: {es: "← Inicio", en: "← Start"}

wizard.sketch:
  es: "**Boceto para discutir.** No se conecta a nada, no guarda lo que escribas ni llama a un modelo: cada paso muestra qué haría Rastro, qué decidís vos y dónde existe hoy esa pieza."
  en: "**A sketch to discuss.** It connects to nothing, keeps nothing you type and calls no model: each step shows what Rastro would do, what you decide and where that piece exists today."
