# Texts of the oil and gas «Rastro Lab» tab (app/extensions/gas_lab/lab.py), in Spanish and English. Read with idioma.t("<key>").
# The per-well explanation sentences, factor and fact names are in app/textos/modelo.yaml (lab/gas/modelo.py reads them).
lab.datos.spinner:
  es: "Preparando el modelo: se entrena dos veces, con las tablas originales y con Rastro. La primera vez después de un cambio en los datos tarda unos 30 segundos; después queda guardado."
  en: "Preparing the model: it is trained twice, with the original tables and with Rastro. The first time after a data change takes about 30 seconds; then it is saved."

lab.show_lab.title: {es: "#### ¿Cuánto gas va a dar un pozo nuevo?", en: "#### How much gas will a new well produce?"}
lab.show_lab.intro:
  es: "Un modelo predice el gas de los meses 2 a 7 de un pozo nuevo de shale gas de Vaca Muerta. Es **el mismo
    modelo, entrenado dos veces**: una con las tablas tal como vienen y otra con Rastro. Rastro no lo hace más
    preciso: hace que **cada predicción se explique en conceptos de negocio, con los hechos que la respaldan, y
    que se pueda comprobar**."
  en: "A model predicts the gas of months 2 to 7 of a new Vaca Muerta shale gas well. It is **the same model, trained
    twice**: once with the tables as they come and once with Rastro. Rastro does not make it more accurate: it
    makes **every prediction explained in business concepts, with the facts that back it, and verifiable**."
lab.show_lab.error_without: {es: "Error sin Rastro", en: "Error without Rastro"}
lab.show_lab.error_with: {es: "Error con Rastro", en: "Error with Rastro"}
lab.show_lab.corrected: {es: "Con un dato corregido", en: "With a corrected value"}
lab.show_lab.corrected_value: {es: "{n} de {total}", en: "{n} of {total}"}
lab.show_lab.trained:
  es: "Entrenado con {train} pozos que empezaron de {start} a 2024; probado con {test} de 2025. Error medio por pozo,
    en millones de m³. Sin modelo, usar la mediana de cada concesión da {concession}, y la de cada operadora,
    {operator}."
  en: "Trained with {train} wells that started from {start} to 2024; tested with {test} from 2025. Mean error per
    well, in millions of m³. Without a model, using each concession's median gives {concession}, and each
    operator's, {operator}."
lab.show_lab.inputs_title: {es: "Lo que entra al modelo", en: "What goes into the model"}
lab.show_lab.inputs_text:
  es: "Los mismos {n} pozos y las mismas ideas de variables, de dos formas. Sin Rastro, las columnas de las tablas
    tal como vienen; con Rastro, conceptos del diccionario, cada uno con su fuente."
  en: "The same {n} wells and the same variable ideas, in two ways. Without Rastro, the table columns as they come;
    with Rastro, concepts from the dictionary, each one with its source."
lab.show_lab.without_rastro: {es: "Sin Rastro", en: "Without Rastro"}
lab.show_lab.with_rastro: {es: "Con Rastro", en: "With Rastro"}
lab.show_lab.inputs_raw_note:
  es: "El porcentaje sale de buscar el nombre de la empresa en el texto de socios del mapa: si el nombre no coincide,
    queda vacío; si el mapa está mal, nada lo dice."
  en: "The percentage comes from searching the company's name in the map's partner text: if the name does not match,
    it stays empty; if the map is wrong, nothing says so."
lab.show_lab.inputs_origin: {es: "**De dónde sale cada columna:**", en: "**Where each column comes from:**"}
# The model's tables in the technical view: modelo.py writes their headers in Spanish; in English, lab.py lays these
# over them, in the same order (modelo.ENTRADA_B, modelo.aprendido, modelo.peso_por_concepto)
