    "Agua (m³)", "Presión máxima (psi)", "Profundidad vertical (m)", "Gas meses 2 a 7 (M m³)", "Uso"]
  en: ["Well", "Started", "Operator", "Concession", "Share (%)", "Lateral length (m)", "Stages", "Sand (t)",
    "Water (m³)", "Maximum pressure (psi)", "Vertical depth (m)", "Gas months 2 to 7 (M m³)", "Use"]
lab.tables.use: {es: {prueba: prueba, entrenamiento: entrenamiento}, en: {prueba: test, entrenamiento: training}}
lab.tables.origin_columns: {es: ["Columna", "Concepto de Rastro", "Fuente"], en: ["Column", "Rastro concept", "Source"]}
lab.tables.origin_concepts:
  es: ["energia:WellStart → energia:aboutWell", "energia:startMonth", "energia:company (unida entre fuentes)",
    "energia:inConcession", "energia:Stake → energia:percent", "energia:Fracturing → energia:lateralLengthM",
    "energia:fracStages", "energia:proppantTonnes", "energia:waterM3", "energia:maxPressurePsi",
    "energia:WellTrajectory → energia:verticalDepthM", "energia:gasMonths2to7 (lo que se predice)"]
  en: ["energia:WellStart → energia:aboutWell", "energia:startMonth", "energia:company (linked across sources)",
    "energia:inConcession", "energia:Stake → energia:percent", "energia:Fracturing → energia:lateralLengthM",
    "energia:fracStages", "energia:proppantTonnes", "energia:waterM3", "energia:maxPressurePsi",
    "energia:WellTrajectory → energia:verticalDepthM", "energia:gasMonths2to7 (what is predicted)"]
lab.tables.origin_sources:
  es: ["Capítulo IV", "Capítulo IV", "Capítulo IV y correcciones revisadas", "Capítulo IV y mapa de concesiones",
    "Mapa de concesiones y correcciones con documento", "Datos de fractura", "Datos de fractura", "Datos de fractura",
    "Datos de fractura", "Datos de fractura", "Trayectorias de pozo", "Capítulo IV"]
  en: ["Capítulo IV", "Capítulo IV", "Capítulo IV and reviewed corrections", "Capítulo IV and concessions map",
    "Concessions map and corrections with a document", "Fracturing data", "Fracturing data", "Fracturing data",
    "Fracturing data", "Fracturing data", "Well trajectories", "Capítulo IV"]
lab.tables.learned_columns:
  es: ["Concesión", "Operadora", "Socios (Rastro)", "Pozos de entrenamiento", "Mediana de su gas", "Efecto en la predicción"]
  en: ["Concession", "Operator", "Partners (Rastro)", "Training wells", "Median of its gas", "Effect on the prediction"]
lab.tables.concepts:
  es: ["La concesión con su operadora y socios", "Cómo se fracturó el pozo", "La profundidad del pozo"]
  en: ["The concession with its operator and partners", "How the well was fractured", "The well's depth"]
lab.show_lab.learned_title: {es: "Qué aprendió el modelo", en: "What the model learned"}
lab.show_lab.learned_text:
  es: "El modelo explica el {r2} % de la diferencia entre los pozos de 2025; la mediana de cada concesión, sola, el
    {r2_concession} %. Casi todo lo que sabe es dónde está el pozo: la fractura y la profundidad agregan poco, y
    eso también es una conclusión. Lo que pesa cada factor, en millones de m³ por pozo, en promedio: {weights}. La
    operadora y los socios no se pueden separar de la concesión: Rastro muestra que dentro de una concesión son
    siempre los mismos."
  en: "The model explains {r2} % of the difference between the 2025 wells; each concession's median, alone,
    {r2_concession} %. Almost everything it knows is where the well is: fracturing and depth add little, and that
    is also a conclusion. What each factor weighs, in millions of m³ per well, on average: {weights}. The operator
    and the partners cannot be separated from the concession: Rastro shows that within a concession they are
    always the same."
lab.show_lab.learned_note:
  es: "Operadora y socios, de Rastro (con sus correcciones). Efecto: cuánto suma o resta, en millones de m³, estar en
    esa concesión, respecto de un pozo promedio."
  en: "Operator and partners, from Rastro (with their corrections). Effect: how much being in that concession adds or
    subtracts, in millions of m³, compared with an average well."
lab.show_lab.change_title: {es: "Cuando la fuente cambia", en: "When the source changes"}
lab.show_lab.change_text:
  es: "Los datos de fractura llegan tarde: de los {with_fracturing} pozos de 2025 que los tienen, en **{late}** se
    cargaron después de que el pozo empezó a producir (a la mitad, {months} meses o más). Si la predicción se hace
    cuando el pozo arranca, esos pozos todavía no tenían fractura: **su predicción cambia {mean_change} millones
    de m³ en promedio** (hasta {max_change}) cuando la fractura llega.\n\nSin Rastro, el número cambia y nada dice
    por qué. Con Rastro, cada predicción dice qué datos usó y cuándo se cargó cada uno (en «¿De dónde sale?» de la
    fractura), y marca los que llegaron después de que el pozo arrancó."
  en: "Fracturing data arrives late: of the {with_fracturing} 2025 wells that have it, for **{late}** it was loaded
    after the well started producing (for half of them, {months} months or more). If the prediction is made when
    the well starts, those wells did not have fracturing data yet: **their prediction changes by {mean_change}
    million m³ on average** (up to {max_change}) when the fracturing data arrives.\n\nWithout Rastro, the number
    changes and nothing says why. With Rastro, every prediction says which data it used and when each value was
    loaded (in «Where does it come from?» for the fracturing), and flags the values that arrived after the well
    started."
lab.show_lab.impact_text:
  es: "**Rastro sabe qué cambia.** Si la fuente corrige la fractura informada n.º {record}, Rastro dice de antemano
    qué predicciones dependen de ella (pozo {wells}), recorriendo de qué registros sale cada una. Se probó: se
    corrigió el registro, se rehízo todo y cambiaron exactamente esas{change}, ninguna otra. Sin Rastro, para
    saberlo hay que rehacer todas y comparar."
  en: "**Rastro knows what changes.** If the source corrects reported fracturing no. {record}, Rastro says in advance
    which predictions depend on it (well {wells}), by following which records each one comes from. It was tested:
    the record was corrected, everything was redone and exactly those changed{change}, no other. Without Rastro,
    finding out means redoing them all and comparing."
lab.show_lab.impact_change: {es: " (de {before} a {after} millones de m³)", en: " (from {before} to {after} million m³)"}
lab.show_lab.published_title: {es: "Las predicciones, en Rastro", en: "The predictions, in Rastro"}
lab.show_lab.how_title: {es: "¿Cómo se calcula?", en: "How is it calculated?"}
lab.show_lab.how_text:
  es: "Es una regresión lineal: la predicción es el gas de un pozo promedio más el aporte de cada variable, en
    millones de m³. Las dos versiones usan las mismas ideas de variables (operadora, concesión, participación y
    fractura); cambia de dónde salen. Sin Rastro: la empresa como se declara, el código de la concesión y el
    porcentaje del texto de socios del mapa. Con Rastro: la operadora unida entre fuentes, la concesión y la
    participación corregida, cada una con su regla y su evidencia. La operadora es la del primer mes del pozo, no
    la de hoy: usar la de hoy sería usar el futuro. La fractura (rama horizontal, etapas, arena, agua y presión)
    es la informada hasta el mes en que arrancó el pozo. El gas que se predice también sale de Rastro (el gas de
    los meses 2 a 7 de cada pozo), y coincide con el que calcula el SQL.\n\nOjo: la explicación dice cómo llegó el
    modelo a su número, no la causa física. Que un factor sume no prueba que produzca más gas; es lo que el modelo
    aprendió de los pozos anteriores."
  en: "It is a linear regression: the prediction is the gas of an average well plus the contribution of each
    variable, in millions of m³. Both versions use the same variable ideas (operator, concession, share and
    fracturing); what changes is where they come from. Without Rastro: the company as declared, the concession
    code and the percentage from the map's partner text. With Rastro: the operator linked across sources, the
    concession and the corrected share, each one with its rule and its evidence. The operator is the one of the
    well's first month, not today's: using today's would be using the future. The fracturing (lateral, stages,
    sand, water and pressure) is what was reported up to the month the well started. The predicted gas also comes
    from Rastro (the gas of months 2 to 7 of each well), and it matches the one the SQL calculates.\n\nNote: the
    explanation says how the model reached its number, not the physical cause. That a factor adds does not prove
    it produces more gas; it is what the model learned from earlier wells."
lab.show_lab.how_sql:
  es: "**Sin Rastro (SQL sobre las tablas tal como vienen):** la consulta que arma la entrada del modelo A. Cada
    cruce está en la consulta: el mes en que arrancó cada pozo, la empresa como se declaró, el texto de socios del
    mapa (el porcentaje se busca después por nombre) y la fractura sumada de la tabla cruda."
  en: "**Without Rastro (SQL over the tables as they come):** the query that builds model A's input. Every join is in
    the query: the month each well started, the company as declared, the map's partner text (the percentage is
    looked up later by name) and the fracturing summed from the raw table."
lab.show_lab.how_sparql:
  es: "**Con Rastro (SPARQL):** la misma entrada, pedida en conceptos del diccionario. Los cruces y las reglas están
    definidos una vez en Rastro; la consulta trae además la regla y la evidencia de cada dato."
  en: "**With Rastro (SPARQL):** the same input, asked in dictionary concepts. The joins and the rules are defined
    once in Rastro; the query also brings the rule and the evidence of each value."
lab.show_lab.how_code: {es: "Código del modelo: lab/gas/modelo.py.", en: "Model code: lab/gas/modelo.py."}

