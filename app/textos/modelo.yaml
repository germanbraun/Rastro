modelo.reparte:
  es: " Un pozo con más rama tiene más etapas: el modelo reparte entre las dos un mismo efecto, y juntas suman {total}."
  en: " A well with a longer lateral has more stages: the model splits one effect between the two, and together they add up to {total}."
modelo.sin_fractura:
  es: "No hay datos de fractura de este pozo: el modelo usa los de un pozo típico."
  en: "There is no fracturing data for this well: the model uses that of a typical well."

modelo.juntas:
  es: "El modelo no puede separar la concesión de su operadora ni de sus socios, y Rastro muestra por qué: {operators}{changes} y todos sus pozos comparten los mismos socios."
  en: "The model cannot separate the concession from its operator or its partners, and Rastro shows why: {operators}{changes} and all its wells share the same partners."
modelo.una_operadora: {es: "{area} tuvo una sola operadora en los pozos que vio el modelo", en: "{area} had a single operator in the wells the model saw"}
