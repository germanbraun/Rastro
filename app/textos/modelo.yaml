# Texts of the per-well explanation that lab/gas/modelo.py writes, in Spanish and English. modelo.py reads this file
# itself (modelo.texto), so the console, the blind test and the app use the same sentences. Names, rules and evidence
# from the sources stay as they come.
modelo.marca_documento: {es: "dato corregido con documento", en: "value corrected with a document"}
modelo.marca_ia: {es: "unión revisada por IA, a confirmar por una persona", en: "join reviewed by AI, to be confirmed by a person"}
modelo.vacio: {es: "vacío (se usa {value})", en: "empty ({value} is used)"}

modelo.hondo:
  es: "Está a {depth} m de profundidad vertical (típico: {typical}), de su trayectoria; en el entrenamiento, los pozos más {who} dieron más gas."
  en: "It is at {depth} m of vertical depth (typical: {typical}), from its trajectory; in training, {who} wells gave more gas."
modelo.hondos: {es: "hondos", en: "deeper"}
modelo.someros: {es: "someros", en: "shallower"}
modelo.sin_trayectoria:
  es: "No hay trayectoria de este pozo: el modelo usa la profundidad de un pozo típico."
  en: "There is no trajectory for this well: the model uses the depth of a typical well."

modelo.lugar:
  es: "Los {n} pozos de {area} que vio el modelo ({who}) dieron una mediana de {median} millones de m³, {more} que la de todos los pozos ({all})."
  en: "The {n} wells of {area} the model saw ({who}) gave a median of {median} million m³, {more} than that of all wells ({all})."
modelo.todos_de: {es: "todos de {operator}", en: "all from {operator}"}
modelo.mas: {es: "más", en: "more"}
modelo.menos: {es: "menos", en: "less"}
modelo.sin_pozos_area:
  es: "El modelo no vio pozos de {area}: usa lo que vio de {operator} en otras concesiones."
  en: "The model saw no wells of {area}: it uses what it saw of {operator} in other concessions."

modelo.fractura_rama: {es: "largo de la rama horizontal", en: "lateral length"}
modelo.fractura_etapas: {es: "etapas de fractura", en: "fracturing stages"}
modelo.fractura_arena: {es: "arena bombeada", en: "sand pumped"}
modelo.fractura_agua: {es: "agua inyectada", en: "water injected"}
modelo.fractura_presion: {es: "presión máxima", en: "maximum pressure"}
