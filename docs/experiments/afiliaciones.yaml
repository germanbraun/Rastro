    The bounded set has 962 distinct affiliation strings, not about 200 as estimated. The estimate counted only
    strings mentioning Argentina; the approved questions cover every affiliation in the 100
    works. The set is not redrawn; the user decides whether the reviewer's workload is acceptable or how the
    reference plan changes. Decided by the user on 2026-10-22.
