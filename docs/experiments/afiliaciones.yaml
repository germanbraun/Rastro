  failure_kind: manifest written by hand, not by the load; only the first ROR location kept; credentials interpolated
  fix: loader writes the manifest after commit, ror.location table, keyword connection parameters; process notes 11-13
- step: mapping
  check: Ontop startup with the new mapping
  failure_kind: Ontop's SQL parser rejected the source query because WORK is a reserved word (table crossref.work)
  fix: quote the table name in the mapping's source query; process note 15
- step: links
  check: reading the unidentified Argentina-text mentions by hand
  failure_kind: the normalization dropped non-ASCII dashes (— and ‐) while removing accents, gluing words ("airesconicet"),
    so rules missed CONICET and UBA in 24 mentions
  fix: drop only combining accents and turn every other symbol into a space; process note 20
- step: links
  check: reviewer (GPT) on the linker and requirements
  failure_kind: cq2 requirement still carried the old definition after the user approved a new reading; cq3 gaps only searched
    mentions without any identification; correction evidence lacked its sources
  fix: cq2 re-proposed and re-approved; posible_hueco table over all Argentine-context mentions; URLs in the CSV; process
    notes 23-24
- step: links
  check: reading the possible-gap segments by hand
