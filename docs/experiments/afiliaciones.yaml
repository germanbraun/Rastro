errors_caught:
- step: initialize
  check: YAML read-back of the experiment log
  failure_kind: duplicated key (reason) silently kept only the last value
  fix: merged into one value; process note 7
- step: inspection (before the log)
  check: reviewer (GPT) on the first inspection
  failure_kind: mixed counting units, acronym collisions, e-mail tokens read as evidence
  fix: revised inspection; process note 2
- step: sources
  check: reviewer (GPT) on the loader
  failure_kind: manifest written by hand, not by the load; only the first ROR location kept; credentials interpolated
  fix: loader writes the manifest after commit, ror.location table, keyword connection parameters; process notes 11-13
- step: mapping
  check: Ontop startup with the new mapping
  failure_kind: Ontop's SQL parser rejected the source query because WORK is a reserved word (table crossref.work)
  fix: quote the table name in the mapping's source query; process note 15
- step: links
  check: reading the unidentified Argentina-text mentions by hand
  failure_kind: >-
    the normalization dropped non-ASCII dashes (— and ‐) while removing accents, gluing words ("airesconicet"), so
    rules missed CONICET and UBA in 24 mentions
  fix: drop only combining accents and turn every other symbol into a space; process note 20
- step: links
  check: reviewer (GPT) on the linker and requirements
  failure_kind: >-
    cq2 requirement still carried the old definition after the user approved a new reading; cq3 gaps only searched
    mentions without any identification; correction evidence lacked its sources
  fix: cq2 re-proposed and re-approved; posible_hueco table over all Argentine-context mentions; URLs in the CSV;
    process notes 23-24
- step: links
  check: reading the possible-gap segments by hand
  failure_kind: publisher HTML entities (&amp;, &#x00E1;) split by the segment rule and left in normalized text
  fix: html.unescape in the single normalization; process note 23
- step: questions
  check: running cq3 against Ontop
  failure_kind: Ontop rejects FILTER NOT EXISTS inside a UNION branch (no common variables in its scope)
  fix: OPTIONAL with !BOUND inside the branch; process note 27
- step: questions
  check: YAML read-back of the experiment log, before commit
  failure_kind: >-
    an unquoted line with a colon made the log invalid; the update script failed but the commit and push ran anyway
    (commands chained with ; instead of &&), so f82554c lacked this session and the process notes
  fix: quoted the line, committed the log and notes separately; process note 30
- step: questions
  check: reviewer (GPT) on the queries and query checks (9b69da4)
  failure_kind: >-
    row-count bounds could pass with repeated and missing mentions; cq3 returned no evidence and its labels implied
    absence from ROR more strongly than a heuristic search shows; the quality proposal accepted any single source and
    read a filled decision field as review
  fix: >-
    structural-checks.py from the pinned records; cq3 evidence column and candidate wording; quality proposal revised;
    process notes 31-33
- step: quality
  check: good/bad examples (calidad.py --examples-only)
  failure_kind: >-
    the registry-status rule's aggregate SPARQL returned a row for an active organization (empty group with $this
    pre-bound), so the good example failed
  fix: HAVING (COUNT(?s) > 0); process note 35
- step: quality
  check: reading the system clock before committing the log
  failure_kind: session times were estimated by hand and one ended in the future; corrected from commit times
  fix: times taken from the clock and commits; process note 7 (a command to record sessions)
- step: quality
  check: reviewer (GPT) running the isolated rules directly (2c84127)
  failure_kind: >-
    a withdrawn record reported a violation (severity on the SPARQL constraint, not the shape); empty or arbitrary
    text passed as a person's confirmation; a missing status passed as active; blank evidence passed; the seven
    good/bad pairs passed throughout
  fix: severity on the shape; pending-only confirmation state; status completeness; non-blank patterns;
    quality-cases.py with severities; process notes 37-38
