name: rastro

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${PG_DB:-rastro}
      POSTGRES_USER: ${PG_USER:-rastro}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-rastro}
    ports:
      - "${PG_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  ontop:
    build: ./ontop
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ONTOP_ONTOLOGY_FILE: /opt/rastro/ontology/rastro.ttl
      ONTOP_MAPPING_FILE: /opt/rastro/mappings/rastro.r2rml.ttl
      ONTOP_DB_URL: jdbc:postgresql://postgres:5432/${PG_DB:-rastro}
      ONTOP_DB_USER: ${PG_USER:-rastro}
      ONTOP_DB_PASSWORD: ${PG_PASSWORD:-rastro}
      ONTOP_DB_DRIVER: org.postgresql.Driver
      ONTOP_CORS_ALLOWED_ORIGINS: "*"
      # Recarga ontología y mapeos al editarlos, sin reiniciar el contenedor
      ONTOP_DEV_MODE: "true"
    ports:
      - "${ONTOP_PORT:-8080}:8080"
    volumes:
      - ../ontology:/opt/rastro/ontology:ro
      - ../mappings:/opt/rastro/mappings:ro

  # Segundo dominio, proveedores del Estado: su propia ontología y sus mapeos
  ontop-proveedores:
    build: ./ontop
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ONTOP_ONTOLOGY_FILE: /opt/rastro/ontology/proveedores/proveedores.ttl
      ONTOP_MAPPING_FILE: /opt/rastro/mappings/proveedores.r2rml.ttl
      ONTOP_DB_URL: jdbc:postgresql://postgres:5432/${PG_DB:-rastro}
      ONTOP_DB_USER: ${PG_USER:-rastro}
      ONTOP_DB_PASSWORD: ${PG_PASSWORD:-rastro}
      ONTOP_DB_DRIVER: org.postgresql.Driver
      ONTOP_CORS_ALLOWED_ORIGINS: "*"
      ONTOP_DEV_MODE: "true"
    ports:
      - "${ONTOP_PROVEEDORES_PORT:-8081}:8080"
    volumes:
      - ../ontology:/opt/rastro/ontology:ro
      - ../mappings:/opt/rastro/mappings:ro

  # Tercer dominio, petróleo y gas en Argentina
  ontop-energia:
    build: ./ontop
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ONTOP_ONTOLOGY_FILE: /opt/rastro/ontology/energia/energia.ttl
      ONTOP_MAPPING_FILE: /opt/rastro/mappings/energia.r2rml.ttl
      ONTOP_DB_URL: jdbc:postgresql://postgres:5432/${PG_DB:-rastro}
      ONTOP_DB_USER: ${PG_USER:-rastro}
      ONTOP_DB_PASSWORD: ${PG_PASSWORD:-rastro}
      ONTOP_DB_DRIVER: org.postgresql.Driver
      ONTOP_CORS_ALLOWED_ORIGINS: "*"
      ONTOP_DEV_MODE: "true"
    ports:
      - "${ONTOP_ENERGIA_PORT:-8082}:8080"
    volumes:
      - ../ontology:/opt/rastro/ontology:ro
      - ../mappings:/opt/rastro/mappings:ro

  # Research affiliations (transfer experiment): only while it runs, with --profile afiliaciones
  ontop-afiliaciones:
    build: ./ontop
    profiles: ["afiliaciones"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ONTOP_ONTOLOGY_FILE: /opt/rastro/ontology/afiliaciones/afiliaciones.ttl
      ONTOP_MAPPING_FILE: /opt/rastro/mappings/afiliaciones.r2rml.ttl
      ONTOP_DB_URL: jdbc:postgresql://postgres:5432/${PG_DB:-rastro}
      ONTOP_DB_USER: ${PG_USER:-rastro}
      ONTOP_DB_PASSWORD: ${PG_PASSWORD:-rastro}
      ONTOP_DB_DRIVER: org.postgresql.Driver
      ONTOP_CORS_ALLOWED_ORIGINS: "*"
      ONTOP_DEV_MODE: "true"
    ports:
      - "${ONTOP_AFILIACIONES_PORT:-8083}:8080"
    volumes:
      - ../ontology:/opt/rastro/ontology:ro
      - ../mappings:/opt/rastro/mappings:ro

  # Demo de Rastro Layer: http://localhost:8501
  app:
    build: ./loaders
    depends_on:
      postgres:
        condition: service_healthy
      ontop-energia:            # la app abre en petróleo y gas; los otros casos se ven con «Ver detalles técnicos»
        condition: service_healthy
    environment:
      PG_DB: ${PG_DB:-rastro}
      PG_USER: ${PG_USER:-rastro}
      PG_PASSWORD: ${PG_PASSWORD:-rastro}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RASTRO_PROVIDER: ${RASTRO_PROVIDER:-}
      RASTRO_MODEL: ${RASTRO_MODEL:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
    ports:
      - "${APP_PORT:-8501}:8501"
    volumes:
      - ../app:/app:ro
      - ../layer:/layer:ro
      - ../lab:/lab:ro
      - ../ontology:/ontology:ro
      - ../mappings:/mappings:ro
      - ../data/cache:/data/cache:ro
    command: ["streamlit", "run", "/app/app.py", "--server.port", "8501", "--server.address", "0.0.0.0",
              "--server.headless", "true", "--browser.gatherUsageStats", "false"]

  graphdb:
    image: ontotext/graphdb:10.8.5
    restart: unless-stopped
    environment:
      GDB_HEAP_SIZE: ${GRAPHDB_HEAP:-2g}
      # http.agent: Wikidata exige identificarse en las consultas federadas (SERVICE)
      GDB_JAVA_OPTS: -Dgraphdb.workbench.importDirectory=/import -Dhttp.agent=RastroMVP/0.1+https://github.com/germanbraun/Rastro
    ports:
      - "${GRAPHDB_PORT:-7210}:7200"
    volumes:
      - graphdb-data:/opt/graphdb/home
      # Carpeta de importación del servidor: los cargadores dejan ahí los RDF descargados
      - ../data/raw/mesh:/import:ro

  # Crea el repositorio "rastro" en GraphDB si no existe y termina.
  graphdb-init:
    image: curlimages/curl:8.10.1
    depends_on:
      - graphdb
    volumes:
      - ./graphdb:/config:ro
    entrypoint: ["sh", "/config/init.sh"]
    restart: "no"

  # Cargadores de datos: se corren a demanda con `docker compose run --rm <servicio>`
  aact-loader:
    image: postgres:17
    profiles: ["load"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_DB: ${PG_DB:-rastro}
      PG_USER: ${PG_USER:-rastro}
      PG_PASSWORD: ${PG_PASSWORD:-rastro}
      AACT_USER: ${AACT_USER:-}
      AACT_PASSWORD: ${AACT_PASSWORD:-}
      AACT_DUMP: ${AACT_DUMP:-}
    volumes:
      - ../data:/data
    entrypoint: ["bash", "/data/aact/load.sh"]

  chembl-loader:
    build: ./loaders
    profiles: ["load"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_DB: ${PG_DB:-rastro}
      PG_USER: ${PG_USER:-rastro}
      PG_PASSWORD: ${PG_PASSWORD:-rastro}
    volumes:
      - ../data:/data
    command: ["python", "-u", "/data/chembl/load.py"]

  openfda-loader:
    build: ./loaders
    profiles: ["load"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_DB: ${PG_DB:-rastro}
      PG_USER: ${PG_USER:-rastro}
      PG_PASSWORD: ${PG_PASSWORD:-rastro}
      OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
    volumes:
      - ../data:/data
    command: ["python", "-u", "/data/openfda/load.py"]

  mesh-loader:
    build: ./loaders
    profiles: ["load"]
    depends_on:
      postgres:
        condition: service_healthy
      graphdb-init:
        condition: service_completed_successfully
    environment:
      PG_DB: ${PG_DB:-rastro}
      PG_USER: ${PG_USER:-rastro}
      PG_PASSWORD: ${PG_PASSWORD:-rastro}
      MESH_YEAR: ${MESH_YEAR:-2026}
    volumes:
      - ../data:/data
    command: ["python", "-u", "/data/mesh/load.py"]

  # Segundo dominio, proveedores del Estado (docs/plan-proveedores.md)
  usaspending-loader:
    build: ./loaders
    profiles: ["load"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_DB: ${PG_DB:-rastro}
      PG_USER: ${PG_USER:-rastro}
      PG_PASSWORD: ${PG_PASSWORD:-rastro}
    volumes:
      - ../data:/data
    command: ["python", "-u", "/data/usaspending/load.py"]

  naics-loader:
    build: ./loaders
    profiles: ["load"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_DB: ${PG_DB:-rastro}
      PG_USER: ${PG_USER:-rastro}
      PG_PASSWORD: ${PG_PASSWORD:-rastro}
    volumes:
      - ../data:/data
    command: ["python", "-u", "/data/naics/load.py"]

  csl-loader:
    build: ./loaders
    profiles: ["load"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_DB: ${PG_DB:-rastro}
      PG_USER: ${PG_USER:-rastro}
      PG_PASSWORD: ${PG_PASSWORD:-rastro}
    volumes:
      - ../data:/data
    command: ["python", "-u", "/data/csl/load.py"]

  gleif-loader:
    build: ./loaders
    profiles: ["load"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_DB: ${PG_DB:-rastro}
      PG_USER: ${PG_USER:-rastro}
      PG_PASSWORD: ${PG_PASSWORD:-rastro}
    volumes:
      - ../data:/data
    command: ["python", "-u", "/data/gleif/load.py"]

  wikidata-loader:
    build: ./loaders
    profiles: ["load"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_DB: ${PG_DB:-rastro}
      PG_USER: ${PG_USER:-rastro}
      PG_PASSWORD: ${PG_PASSWORD:-rastro}
    volumes:
      - ../data:/data
    command: ["python", "-u", "/data/wikidata/load.py"]

  # Tablas y enlaces del dominio de proveedores (linking/proveedores/)
  proveedores-linker:
    build: ./loaders
    profiles: ["load"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_DB: ${PG_DB:-rastro}
      PG_USER: ${PG_USER:-rastro}
      PG_PASSWORD: ${PG_PASSWORD:-rastro}
    volumes:
      - ../linking:/linking:ro
    command: ["python", "-u", "/linking/proveedores/link.py"]

  # Tercer dominio, petróleo y gas en Argentina (docs/plan-energia.md)
  energia-loader:
    build: ./loaders
    profiles: ["load"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_DB: ${PG_DB:-rastro}
      PG_USER: ${PG_USER:-rastro}
      PG_PASSWORD: ${PG_PASSWORD:-rastro}
    volumes:
      - ../data:/data
    command: ["python", "-u", "/data/energia/load.py"]

  # Datos que solo usa Rastro Lab: Capítulo IV de 2018 a 2022 y datos de fractura (data/lab-gas/)
  lab-gas-loader:
    build: ./loaders
    profiles: ["load"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_DB: ${PG_DB:-rastro}
      PG_USER: ${PG_USER:-rastro}
      PG_PASSWORD: ${PG_PASSWORD:-rastro}
    volumes:
      - ../data:/data
    command: ["python", "-u", "/data/lab-gas/load.py"]

  # Enriquecimiento con Wikidata, materializado (data/wikidata-energia/): corre después de energia-linker
  wikidata-energia-loader:
    build: ./loaders
    profiles: ["load"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_DB: ${PG_DB:-rastro}
      PG_USER: ${PG_USER:-rastro}
      PG_PASSWORD: ${PG_PASSWORD:-rastro}
    volumes:
      - ../data:/data
    command: ["python", "-u", "/data/wikidata-energia/load.py"]

  energia-linker:
    build: ./loaders
    profiles: ["load"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_DB: ${PG_DB:-rastro}
      PG_USER: ${PG_USER:-rastro}
      PG_PASSWORD: ${PG_PASSWORD:-rastro}
    volumes:
      - ../linking:/linking:ro
      - ../data/lab-gas/schema.sql:/data/lab-gas/schema.sql:ro
      - ../data/wikidata-energia/schema.sql:/data/wikidata-energia/schema.sql:ro
      - ../layer/energia/reader.sql:/layer/energia/reader.sql:ro
    command: ["python", "-u", "/linking/energia/link.py"]

  # Enlaza ensayos con MeSH y ChEMBL (linking/): docker compose run --rm linker
  linker:
    build: ./loaders
    profiles: ["load"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_DB: ${PG_DB:-rastro}
      PG_USER: ${PG_USER:-rastro}
      PG_PASSWORD: ${PG_PASSWORD:-rastro}
    volumes:
      - ../linking:/linking:ro
    command: ["python", "-u", "/linking/link.py"]

  # Evaluación de Rastro Layer (layer/eval/): docker compose run --rm layer-eval
  layer-eval:
    build: ./loaders
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
      ontop-energia:
        condition: service_healthy
    environment:
      PG_DB: ${PG_DB:-rastro}
      PG_USER: ${PG_USER:-rastro}
      PG_PASSWORD: ${PG_PASSWORD:-rastro}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RASTRO_PROVIDER: ${RASTRO_PROVIDER:-}
      RASTRO_MODEL: ${RASTRO_MODEL:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
    volumes:
      - ../layer:/layer
      - ../ontology:/ontology:ro
    command: ["python", "-u", "/layer/eval/run.py"]

  # Herramientas: docker compose run --rm <servicio>
  calidad:                      # reglas de calidad (SHACL) sobre los datos de petróleo y gas
    build: ./loaders
    profiles: ["tools"]
    depends_on:
      ontop-energia:
        condition: service_healthy
    volumes:
      - ../ontology:/ontology:ro
      - ../layer:/layer
    command: ["python", "/ontology/calidad.py"]

  ontology-check:
    build: ./loaders
    profiles: ["tools"]
    volumes:
      - ../ontology:/ontology:ro
      - ../mappings:/mappings:ro
      - ../layer:/layer:ro
    command: ["python", "/ontology/check.py"]

volumes:
  pgdata:
  graphdb-data:
