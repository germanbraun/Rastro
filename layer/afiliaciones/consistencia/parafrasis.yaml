# Consistency check: the same question written in other ways, with the same definitions, so the correct answer is
# the same. Two of the five questions, as approved (e1, a number; e4, a list).

e1:
  - Contando cada publicación una sola vez, ¿cuántas de las 100 publicaciones del conjunto tienen alguna afiliación que nombra al CONICET (ROR https://ror.org/03cqe8w59), sin sumarle las publicaciones de sus institutos? Una afiliación nombra a una organización cuando su texto contiene el nombre de la organización, un nombre o alias que registra ROR, o una sigla que en ROR usa solo esa organización argentina. Una organización madre no recibe las menciones de sus institutos.
  - Número de publicaciones distintas del conjunto de 100 en las que una afiliación nombra al CONICET (https://ror.org/03cqe8w59); las de sus institutos no cuentan para el CONICET. Una afiliación nombra a una organización cuando su texto contiene el nombre de la organización, un nombre o alias que registra ROR, o una sigla que en ROR usa solo esa organización argentina.
  - ¿Cuántas publicaciones del conjunto, cada una contada una vez, nombran al CONICET (organización ROR https://ror.org/03cqe8w59) en al menos una afiliación? No se suman las de sus institutos. Una afiliación nombra a una organización cuando su texto contiene el nombre de la organización, un nombre o alias que registra ROR, o una sigla que en ROR usa solo esa organización argentina.
e4:
  - Listá los DOI, en minúsculas, de las publicaciones del conjunto con al menos una afiliación que nombra a la Universidad de Buenos Aires (ROR https://ror.org/0081fs513). Una afiliación nombra a una organización cuando su texto contiene el nombre de la organización, un nombre o alias que registra ROR, o una sigla que en ROR usa solo esa organización argentina. Una organización madre no recibe las menciones de sus institutos.
  - ¿En qué publicaciones del conjunto (DOI en minúsculas) alguna afiliación nombra a la Universidad de Buenos Aires, organización ROR https://ror.org/0081fs513? Una afiliación nombra a una organización cuando su texto contiene el nombre de la organización, un nombre o alias que registra ROR, o una sigla que en ROR usa solo esa organización argentina. Las menciones de sus institutos no cuentan para la universidad.
  - Publicaciones del conjunto, por DOI en minúsculas, que nombran a la Universidad de Buenos Aires (https://ror.org/0081fs513) en una afiliación. Una afiliación nombra a una organización cuando su texto contiene el nombre de la organización, un nombre o alias que registra ROR, o una sigla que en ROR usa solo esa organización argentina. Una organización madre no recibe las menciones de sus institutos.
