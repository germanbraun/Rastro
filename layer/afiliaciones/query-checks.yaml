# Executable checks for the afiliaciones competency queries (python layer/method.py verify afiliaciones ...).
# These are invariants from the approved definitions and the inspection, not accuracy: the answers are compared with
# the blind reviewer's reference later (evaluate). Never copy a query's output here to make it pass.
# Row bounds are smoke checks. The structural properties (cq1 covers exactly the source mention keys, cq2 counts 1-100
# publications once per organization, cq3 returns the independently established candidate) are checked from the
# pinned records by docs/experiments/research-affiliations/structural-checks.py, receipt structural-checks.json.
cq1.rq:
  query_sha256: 31c72907250015f447c70ef6aff104d3c3f16293faedca08b550734192dec7d4
  columns: [doi, authorPosition, affiliationPosition, affiliation, organization, organizationName, rule, evidence, disposition]
  # Approved scope: every affiliation of the 100 works appears (1,456 mentions loaded), identified or not.
  min_rows: 1456
cq2.rq:
  query_sha256: dbc69b0a6be8f02e1571b28315f35511633a97d8120e5aa562b34558d73d59fa
  columns: [organization, organizationName, publications]
  # Only Argentine organizations can be counted (538 in ROR v2.15), and the set has Argentine affiliations.
  min_rows: 1
  max_rows: 538
cq3.rq:
  query_sha256: 48b005d20e90bd67b0f545cef223bf857ce96518002ad67928945110f9b22c58
  columns: [doi, authorPosition, affiliationPosition, affiliation, candidate, kind, evidence]
  # Instituto Sabato is named in a selected affiliation and no ROR v2.15 name or relationship label has it
  # (established from the pinned records, independently of the linker; see structural-checks.py).
  min_rows: 1
