# Lo propio de cada dominio para responder preguntas (answer.py): qué endpoint, qué
# diccionario de negocio, qué notas lee el LLM y con qué usuario de solo lectura corre el SQL.
# Las rutas son relativas a la raíz del repo.

oncologia:
  base: >-
    Respondés preguntas de negocio sobre ensayos clínicos de oncología, fármacos,
    sus targets y sus eventos adversos. Seguí al pie de la letra las definiciones que trae
    la pregunta (qué fases o estados cuentan). Si la respuesta es una lista, devolvé solo
    los nombres pedidos; si es un número, un solo número.
  ontop: http://ontop:8080/sparql
  ontology: ontology/rastro.ttl
  sparql_notes: layer/sparql-notes.md
  sql_notes: layer/sql-notes.md
  links_notes: layer/sql-enlaces-notes.md
  readers: {B: rastro_reader, D: rastro_reader_links}
  namespace: https://w3id.org/rastro/oncologia#
  # Where each piece of the method lives for this domain (read by the method skills; see docs/method.md)
  method:
    app: app/dominios/oncologia.yaml
    app_mode: legacy
    questions: ontology/competency-questions.md
    queries: ontology/queries/
    mapping: mappings/rastro.r2rml.ttl
    ontop: {service: ontop, port: 8080}
    loaders: [aact-loader, chembl-loader, openfda-loader, mesh-loader]
    linker: {service: linker, folder: linking/, corrections: [linking/regimens.csv, linking/generic_words.csv]}
    evaluation: {folder: layer/eval, harness: legacy, run: docker compose run --rm layer-eval}
    evidence: {result: layer/eval/evidencia.json, link_classes: [DrugLink],
               pattern: "?l prov:wasDerivedFrom ?f ; oncologia:interventionText ?t ; oncologia:linkRule ?r ."}
  label_source: mesh           # rdfs:label comes from this source (the disease names of MeSH)
  # De qué fuente viene cada término de la ontología («rastro» = enlace de Rastro)
  term_sources:
    aact: [Trial, Sponsor, nctId, title, phase, status, startDate, whyStopped, sponsor, industry, condition]
    chembl: [Drug, Target, hasTarget, gene, approved, chemblId]
    openfda: [YearlyReports, ReportedReaction, reports, seriousReports, reaction, year, drug]
    mesh: [within]
    rastro: [testsDrug, DrugLink, linkTrial, linkDrug, interventionText, matchedText, linkRule]
  # De qué fuentes sale cada enlace de Rastro: cada respuesta nombra esas fuentes, además de los enlaces
  link_sources:
    aact: [testsDrug, DrugLink, linkTrial, interventionText]
    chembl: [testsDrug, DrugLink, linkDrug]

proveedores:
  base: >-
    Respondés preguntas de negocio sobre los contratos federales de EE. UU. del año fiscal
    2025 de más de US$10 millones, las empresas que los reciben, sus grupos empresarios,
    sus sectores y las listas de control del gobierno. Seguí al pie de la letra las
    definiciones que trae la pregunta. Si la respuesta es una lista, devolvé solo los
    nombres pedidos; si es un número, un solo número.
  ontop: http://ontop-proveedores:8080/sparql
  ontology: ontology/proveedores/proveedores.ttl
  sparql_notes: layer/proveedores/sparql-notes.md
  sql_notes: layer/proveedores/sql-notes.md
  links_notes: layer/proveedores/sql-enlaces-notes.md
  readers: {B: proveedores_reader, D: proveedores_reader_links}
  namespace: https://w3id.org/rastro/proveedores#
  method:
    app: app/dominios/proveedores.yaml
    questions: ontology/proveedores/competency-questions.md
    queries: ontology/proveedores/queries/
    mapping: mappings/proveedores.r2rml.ttl
    ontop: {service: ontop-proveedores, port: 8081}
    loaders: [usaspending-loader, naics-loader, csl-loader, gleif-loader, wikidata-loader]
    linker: {service: proveedores-linker, folder: linking/proveedores/, corrections: [linking/proveedores/correcciones.csv]}
    evaluation: {folder: layer/proveedores, harness: current, run: docker compose run --rm -T layer-eval python /layer/evaluar.py proveedores,
                 title: proveedores del Estado, normalize: proveedores.normalize}
    change_tests: layer/proveedores/cambio/
    change_guard:
      files: [mappings/proveedores.r2rml.ttl, layer/proveedores/respuestas]
      tables:
        cambio: [usaspending.contract]
      renamed: {table: usaspending.contract, column: awarding_agency, to: agency_name}
    evidence: {result: layer/proveedores/evidencia.json, link_classes: [GroupLink, LeiLink, WatchlistLink],
               pattern: "?l prov:wasDerivedFrom ?f ; proveedores:sourceText ?t ."}
  term_sources:
    usaspending: [Contract, Supplier, Group, Agency, contractId, amount, startDate, endDate, description,
                  subAgency, supplier, agency, uei, state]
    naics: [Sector, sector, within]
    gleif: [LegalEntity, lei, ultimateParent, country, Country]
    csl: [WatchlistEntry, list, alias, entryType]
    wikidata: [listed, wikidataId, stockExchange, headquarters]
    rastro: [group, legalEntity, watchlistMatch, GroupLink, LeiLink, WatchlistLink, linkFrom, linkTo,
             sourceText, matchedText, linkRule, SupplierToReview, ForeignParentSupplier, WatchlistSupplier]
  link_sources:
    usaspending: [group, GroupLink]
    gleif: [group, GroupLink, legalEntity, LeiLink, ForeignParentSupplier, SupplierToReview]
    csl: [watchlistMatch, WatchlistLink, WatchlistSupplier, SupplierToReview]

energia: &energia
  base: >-
    Respondés preguntas de negocio sobre la producción de petróleo y gas de Argentina en 2025,
    pozo por pozo, las concesiones, sus socios y operadoras, los venteos de gas, los gasoductos
    de transporte, las localidades y áreas protegidas cercanas y el LEI de las empresas. Seguí al pie de
    la letra las definiciones que trae la pregunta. Si la respuesta es una lista, devolvé solo los
    nombres pedidos; si es un número, un solo número.
  ontop: http://ontop-energia:8080/sparql
  ontology: ontology/energia/energia.ttl
  sparql_notes: layer/energia/sparql-notes.md
  sql_notes: layer/energia/sql-notes.md
  links_notes: layer/energia/sql-enlaces-notes.md
  readers: {B: energia_reader, D: energia_reader_links}
  namespace: https://w3id.org/rastro/energia#
  method: &energia_method
    app: app/dominios/energia.yaml
    questions: ontology/energia/competency-questions.md
    queries: ontology/energia/queries/
    mapping: mappings/energia.r2rml.ttl
    ontop: {service: ontop-energia, port: 8082}
    loaders: [energia-loader, lab-gas-loader, wikidata-energia-loader]
    linker: {service: energia-linker, folder: linking/energia/,
             corrections: [linking/energia/correcciones.csv, linking/energia/participaciones-revisadas.csv]}
    quality: {prefix: energia, rules: ontology/energia/calidad/reglas.ttl, examples: ontology/energia/calidad/ejemplos.yaml,
              result: layer/energia/calidad.json, run: docker compose run --rm calidad,
              data: ontology/energia/calidad/datos.yaml, predictions: ontology/energia/calidad/predicciones.rq}
    evaluation: {folder: layer/energia, harness: current, run: docker compose run --rm -T layer-eval python /layer/evaluar.py energia,
                 title: petróleo y gas en Argentina, normalize: energia.normalizar}
    change_tests: layer/energia/cambio/
    change_guard:                 # what each change test may change; layer/change_guard.py restores it exactly
      files: [mappings/energia.r2rml.ttl, linking/energia/participaciones-revisadas.csv, layer/energia/respuestas]
      tables:
        cambio: [capitulo4.produccion]
        correccion: []
        impacto: [fractura.fractura, lab_gas.corrida, lab_gas.prediccion, lab_gas.entrada, lab_gas.aporte]
      renamed: {table: capitulo4.produccion, column: prod_pet, to: petroleo}   # what the cambio test renames
    evidence: {result: layer/energia/evidencia.json,
               link_classes: [Stake, OperatorLink, CompanyName, LocationLink, PipelineLink, SurroundingsLink,
                              LeiLink, StudyLink, OperatorChange],
               pattern: "?l prov:wasDerivedFrom ?f ; prov:wasGeneratedBy ?g ; energia:sourceText ?t ."}
  term_sources:
    capitulo4: [WellProduction, ShaleProduction, TightProduction, UnconventionalProduction, Well, oil, gas,
                formation, basin, province, wellId, well, declaredBy, aboutWell]
    sig_energia: [Concession, concessionId, reportedBy, operatorOnMap, DetectedVenting, DeclaredVenting, Venting,
                  date, satellite]
    enargas: [pipeline, pipelineOperator, Pipeline]
    ign: [nearestTown, protectedArea]
    gleif: [lei, legalName]
    fractura: [Fracturing, lateralLengthM, fracStages, proppantTonnes, waterM3, maxPressurePsi, fracDate, loadedOn,
               FractureReport, reportId]
    trayectorias: [WellTrajectory, verticalDepthM, drillingEnd]
    wikidata: [Enrichment, wikidataEntity, headquarters, stockExchange, owner, website]
    lab: [ModelRun, modelVersion, trainedUntil, testError, testR2, inRangeShare, current, Prediction, predictedGas,
          predictedLow, predictedHigh, inTest, Contribution, ofPrediction, factor, amount]
    ambiental: [EnvironmentalStudy, studyId, studyType]
    rastro: [OperatorChange, previousCompany, newCompany, month, oilBefore, oilAfter, gasBefore, gasAfter,
             ConcessionToReview, VentingFarFromPipeline, VentingWithoutReports, reviewReason, Stake, partner, percent, OperatorLink, LocationLink, PipelineLink, SurroundingsLink, LeiLink, StudyLink, aboutStudy, aboutVenting,
             aboutConcession, distanceKm, operator, inConcession, company, registryCompany, CompanyName,
             nameInSource, rule, sourceText, Company, WellStart, startMonth, startWellType, startFormation,
             startResource, declaredName, gasMonths2to7, gasFirst12Months]
  link_sources:
    sig_energia: [Stake, partner, percent, inConcession, LocationLink, aboutVenting, ConcessionToReview, reviewReason]
    capitulo4: [OperatorLink, operator, aboutWell, WellStart, startMonth, startWellType, startFormation, startResource, declaredName, gasMonths2to7, gasFirst12Months, MonthlyGas,
                productionMonth, monthGas, OperatorChange, previousCompany, newCompany, month,
                oilBefore, oilAfter, gasBefore, gasAfter, CompanyName]
    enargas: [PipelineLink, aboutConcession, VentingFarFromPipeline, ConcessionToReview]
    ign: [SurroundingsLink]
    ambiental: [StudyLink, aboutStudy, VentingWithoutReports, ConcessionToReview]
    gleif: [LeiLink, registryCompany]

# Las preguntas sobre las predicciones de Rastro Lab: el mismo dominio, con usuarios y notas de SQL propios
energia_lab:
  <<: *energia
  base: >-
    Respondés preguntas sobre las predicciones de un modelo que estima el gas de los meses 2 a 7 de pozos nuevos de
    shale gas de Vaca Muerta: qué predijo, con qué datos y de qué registros de origen salen. Seguí al pie de la letra
    las definiciones que trae la pregunta. Si la respuesta es una lista, devolvé solo lo pedido; si es un número, un
    solo número.
  sql_notes: layer/energia_lab/sql-notes.md
  links_notes: layer/energia_lab/sql-enlaces-notes.md
  readers: {B: energia_lab_reader, D: energia_lab_reader_links}
  method:
    <<: *energia_method
    evaluation: {folder: layer/energia_lab, harness: current,
                 run: docker compose run --rm -T layer-eval python /layer/evaluar.py energia_lab,
                 title: las predicciones de Rastro Lab, normalize: energia.normalizar}

afiliaciones:
  base: >-
    Respondés preguntas sobre las afiliaciones de un conjunto acotado de publicaciones científicas de 2025 con
    afiliaciones argentinas: qué organizaciones de investigación nombra cada afiliación y cuántas publicaciones
    nombran a cada organización. Seguí al pie de la letra las definiciones que trae la pregunta.
  ontop: http://ontop-afiliaciones:8080/sparql
  ontology: ontology/afiliaciones/afiliaciones.ttl
  sparql_notes: layer/afiliaciones/sparql-notes.md
  sql_notes: layer/afiliaciones/sql-notes.md
  links_notes: layer/afiliaciones/sql-enlaces-notes.md
  readers: {B: afiliaciones_reader, D: afiliaciones_reader_links}
  namespace: https://w3id.org/rastro/afiliaciones#
  term_sources:
    crossref: [Publication, doi, AffiliationMention, inPublication, affiliationText, authorPosition,
               affiliationPosition, suppliedOrganization]
    ror: [Organization, ArgentineOrganization, name, acronym, status, country, hasParent, successor]
  link_sources:
    crossref: [Identification, ofMention, identifies, rule, sourceText, linkStatus, DoubtfulCandidate, candidate,
               reviewDecision, decisionReason, humanConfirmation, PossibleGap, segmentText]
    ror: [Identification, identifies, DoubtfulCandidate, candidate]
  # A new domain experiment (research affiliations). Keys for pieces not built yet are left out.
  method:
    questions: ontology/afiliaciones/competency-questions.md
    queries: ontology/afiliaciones/queries/
    mapping: mappings/afiliaciones.r2rml.ttl
    ontop: {service: ontop-afiliaciones, port: 8083}
    loaders: [afiliaciones-loader]
    linker: {service: afiliaciones-linker, folder: linking/afiliaciones/,
             corrections: [linking/afiliaciones/correcciones.csv]}
    quality: {prefix: afiliaciones, rules: ontology/afiliaciones/calidad/reglas.ttl,
              examples: ontology/afiliaciones/calidad/ejemplos.yaml, data: ontology/afiliaciones/calidad/datos.yaml,
              result: layer/afiliaciones/calidad.json,
              run: docker compose run --rm --no-deps calidad python /ontology/calidad.py afiliaciones}
    app: app/dominios/afiliaciones.yaml
    change_tests: layer/afiliaciones/cambio/
    change_guard:
      files: [linking/afiliaciones/correcciones.csv, layer/afiliaciones/respuestas]
      tables:
        correccion: [ror.name, afiliaciones.identificacion, afiliaciones.dudosa, afiliaciones.posible_hueco,
                     afiliaciones.sin_identificar]
    evaluation: {folder: layer/afiliaciones, harness: current,
                 run: docker compose run --rm -T layer-eval python /layer/evaluar.py afiliaciones,
                 title: afiliaciones de investigación en Argentina}
    lifecycle: layer/afiliaciones/lifecycle.json
    source_manifest: layer/afiliaciones/sources.yaml

