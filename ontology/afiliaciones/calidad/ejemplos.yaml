  bueno: 'e:id a afiliaciones:Identification ; afiliaciones:ofMention e:mencion ; afiliaciones:identifies <https://ror.org/03cqe8w59> ; afiliaciones:rule "R2: sigla única" ; afiliaciones:sourceText "El texto contiene la sigla «CONICET» y «Argentina»." ; prov:wasDerivedFrom fuente:crossref, fuente:ror .'
  malo: 'e:id a afiliaciones:Identification ; afiliaciones:ofMention e:mencion ; afiliaciones:identifies <https://ror.org/03cqe8w59> ; afiliaciones:rule "R2: sigla única" ; afiliaciones:sourceText "El texto contiene la sigla «CONICET» y «Argentina»." ; prov:wasDerivedFrom fuente:crossref .'
