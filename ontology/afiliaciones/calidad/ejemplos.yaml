# For each quality rule (reglas.ttl), a value that passes and a broken one, in Turtle (prefixes afiliaciones:, prov:,
# fuente: and e:). The tests (tests/test_calidad.py) and the app use them. Real cases where there is one: IDEHU,
# withdrawn in ROR v2.15, and a reviewed «UK» candidate still waiting for a person.
